workflows:
  ios-workflow:
    name: SIGILLUM iOS User

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        certificates:
          - "com.sigillum.hcv"
        provisioning_profiles:
          - "SIGILLUM HCV Development"
          - "SIGILLUM HCV Share Development"

    integrations:
      app_store_connect: Codemagic-HCV

    scripts:
      - name: Resolve build identity
        script: |
          export BUILD_GIT_COMMIT="$(git rev-parse HEAD)"
          export BUILD_GIT_BRANCH="${CM_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
          export BUILD_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SIGILLUM BUILD COMMIT: $BUILD_GIT_COMMIT"
          echo "SIGILLUM BUILD BRANCH: $BUILD_GIT_BRANCH"
          echo "SIGILLUM BUILD TIME: $BUILD_TIME_UTC"
          test -n "$BUILD_GIT_COMMIT"
          echo "BUILD_GIT_COMMIT=$BUILD_GIT_COMMIT" >> "$CM_ENV"
          echo "BUILD_GIT_BRANCH=$BUILD_GIT_BRANCH" >> "$CM_ENV"
          echo "BUILD_TIME_UTC=$BUILD_TIME_UTC" >> "$CM_ENV"

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Run production tests
        script: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Configure SIGILLUM User edition
        script: |
          cat > ios/Flutter/SigillumEdition.xcconfig <<'XCCONFIG'
          SIGILLUM_APP_DISPLAY_NAME=SIGILLUM
          SIGILLUM_BUNDLE_ID=com.sigillum.hcv
          SIGILLUM_SHARE_BUNDLE_ID=com.sigillum.hcv.share
          SIGILLUM_APP_GROUP_ID=group.com.sigillum.hcv
          SIGILLUM_URL_SCHEME=sigillum
          SIGILLUM_APP_PROFILE=SIGILLUM HCV Development
          SIGILLUM_SHARE_PROFILE=SIGILLUM HCV Share Development
          XCCONFIG

      - name: Set up iOS export options
        script: |
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>DN9W7Z3HCZ</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sigillum.hcv</key>
              <string>SIGILLUM HCV Development</string>
              <key>com.sigillum.hcv.share</key>
              <string>SIGILLUM HCV Share Development</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=GIT_COMMIT="$BUILD_GIT_COMMIT" \
            --dart-define=GIT_BRANCH="$BUILD_GIT_BRANCH" \
            --dart-define=BUILD_TIME_UTC="$BUILD_TIME_UTC" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

