workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        certificates:
          - "SIGILLUM Apple Distribution"
        provisioning_profiles:
          - "SIGILLUM HCV AdHoc"
          - "SIGILLUM HCV Share AdHoc"

    integrations:
      app_store_connect: Codemagic-HCV

    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Set up iOS export options
        script: |
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>DN9W7Z3HCZ</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sigillum.hcv</key>
              <string>SIGILLUM HCV AdHoc</string>
              <key>com.sigillum.hcv.share</key>
              <string>SIGILLUM HCV Share AdHoc</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
