workflows:
  ios-workflow:
    name: SIGILLUM iOS User

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        certificates:
          - "com.sigillum.hcv"
        provisioning_profiles:
          - "SIGILLUM HCV Development"
          - "SIGILLUM HCV Share Development"

    integrations:
      app_store_connect: Codemagic-HCV

    scripts:
      - name: Apply reliable iOS share handoff
        script: |
          python3 tool/run_ios_share_handoff_fix.py

      - name: Apply document import and Messenger OCR fixes
        script: |
          python3 tool/apply_file_import_and_ocr_fix.py

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Verify source and tests
        script: |
          echo "Building commit $(git rev-parse HEAD)"
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Configure SIGILLUM User edition
        script: |
          cat > ios/Flutter/SigillumEdition.xcconfig <<'XCCONFIG'
          SIGILLUM_APP_DISPLAY_NAME=Fotocamera Sigillum
          SIGILLUM_BUNDLE_ID=com.sigillum.hcv
          SIGILLUM_SHARE_BUNDLE_ID=com.sigillum.hcv.share
          SIGILLUM_APP_GROUP_ID=group.com.sigillum.hcv
          SIGILLUM_URL_SCHEME=sigillum
          SIGILLUM_APP_PROFILE=SIGILLUM HCV Development
          SIGILLUM_SHARE_PROFILE=SIGILLUM HCV Share Development
          XCCONFIG

      - name: Set up iOS export options
        script: |
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>DN9W7Z3HCZ</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sigillum.hcv</key>
              <string>SIGILLUM HCV Development</string>
              <key>com.sigillum.hcv.share</key>
              <string>SIGILLUM HCV Share Development</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build IPA
        script: |
          BUILD_COMMIT="$(git rev-parse HEAD)"
          flutter build ipa --release --dart-define=SIGILLUM_EDITION=user --dart-define=GIT_COMMIT="$BUILD_COMMIT" --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

