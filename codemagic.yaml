workflows:
  ios-workflow:
    name: SIGILLUM iOS User
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'fix/capture-lifecycle-lock-build92'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      flutter: 3.47.1
      xcode: latest
      ios_signing:
        certificates:
          - "com.sigillum.hcv"
        provisioning_profiles:
          - "SIGILLUM HCV Development"
          - "SIGILLUM HCV Share Development"
    integrations:
      app_store_connect: Codemagic-HCV
    scripts:
      - name: Resolve locked Flutter dependencies
        script: |
          set -euo pipefail
          echo "Building committed materialized source $(git rev-parse HEAD)"
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Validate committed materialized source
        script: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          git diff --exit-code -- lib test ios/Runner ios/Podfile
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded 2>&1 | tee /tmp/xcodebuild_logs/flutter-tests-materialized.log
          python3 tool/verify_postpatch_release_20260825.py
          git diff --exit-code -- lib test ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Configure SIGILLUM User edition
        script: |
          cat > ios/Flutter/SigillumEdition.xcconfig <<'XCCONFIG'
          SIGILLUM_APP_DISPLAY_NAME=Fotocamera Sigillum
          SIGILLUM_BUNDLE_ID=com.sigillum.hcv
          SIGILLUM_SHARE_BUNDLE_ID=com.sigillum.hcv.share
          SIGILLUM_APP_GROUP_ID=group.com.sigillum.hcv
          SIGILLUM_URL_SCHEME=sigillum
          SIGILLUM_APP_PROFILE=SIGILLUM HCV Development
          SIGILLUM_SHARE_PROFILE=SIGILLUM HCV Share Development
          XCCONFIG

      - name: Apply development signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Install validated iOS pods
        script: |
          set -euo pipefail
          pushd ios >/dev/null
          pod install --repo-update
          popd >/dev/null
          grep -F "TensorFlowLiteSwift (2.17.0)" ios/Podfile.lock
          git diff --exit-code -- lib test ios/Runner ios/Podfile

      - name: Build IPA from committed source
        script: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse HEAD)"
          flutter build ipa --release --no-pub \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=GIT_COMMIT="$BUILD_COMMIT" \
            --export-options-plist=/Users/builder/export_options.plist
          git diff --exit-code -- lib test ios/Runner ios/Podfile
          python3 tool/verify_postpatch_release_20260825.py

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: SIGILLUM iOS TestFlight
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/testflight-final-20260827'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      flutter: 3.47.1
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sigillum.hcv
      vars:
        APP_STORE_APPLE_ID: "6800755999"
    integrations:
      app_store_connect: Codemagic-HCV
    scripts:
      - name: Resolve locked Flutter dependencies
        script: |
          set -euo pipefail
          echo "Building committed materialized source $(git rev-parse HEAD)"
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Validate committed materialized source
        script: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          git diff --exit-code -- lib test ios/Runner ios/Podfile
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded 2>&1 | tee /tmp/xcodebuild_logs/flutter-tests-materialized.log
          python3 tool/verify_postpatch_release_20260825.py
          git diff --exit-code -- lib test ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Configure SIGILLUM User edition for App Store
        script: |
          cat > ios/Flutter/SigillumEdition.xcconfig <<'XCCONFIG'
          SIGILLUM_APP_DISPLAY_NAME=Fotocamera Sigillum
          SIGILLUM_BUNDLE_ID=com.sigillum.hcv
          SIGILLUM_SHARE_BUNDLE_ID=com.sigillum.hcv.share
          SIGILLUM_APP_GROUP_ID=group.com.sigillum.hcv
          SIGILLUM_URL_SCHEME=sigillum
          SIGILLUM_APP_PROFILE=SIGILLUM HCV App Store
          SIGILLUM_SHARE_PROFILE=SIGILLUM HCV Share App Store
          XCCONFIG

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Build and prove TestFlight IPA from committed source
        script: bash tool/build_testflight_ipa_rc2_20260825.sh

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
