workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: stable
      xcode: latest

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Build IPA
        script: |
          flutter build ipa --debug

    artifacts:
      - build/ios/ipa/*.ipa
