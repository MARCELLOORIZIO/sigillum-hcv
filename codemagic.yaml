workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.sigillum.hcv

    integrations:
      app_store_connect: Codemagic-HCV

    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --debug

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
