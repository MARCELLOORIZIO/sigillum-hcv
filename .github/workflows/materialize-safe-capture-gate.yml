name: Materialize safe capture movement gate

on:
  push:
    paths:
      - '.github/workflows/materialize-safe-capture-gate.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0
      - name: Restore detector and apply camera-only gate
        run: python3 tool/apply_capture_motion_gate_safe_fix.py
      - name: Commit restored detector and UX gate
        run: |
          git config user.name 'SIGILLUM Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/camera_page.dart lib/hcv_live_screen_probe_core.dart lib/hcv_scene_geometry_classifier.dart test/capture_motion_gate_contract_test.dart
          if git diff --cached --quiet; then
            echo 'Safe capture gate already materialized'
          else
            git commit -m 'Restore monitor detection and keep camera-only movement gate'
            git push origin HEAD:fix/reality-monitor-geometry-20260725
          fi
