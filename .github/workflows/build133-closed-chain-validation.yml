name: BUILD133 closed-chain validation

on:
  push:
    branches:
      - feature/build133-closed-chain-vault-youtube-20260925
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build133-closed-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format BUILD133 sources
        run: |
          dart format lib/hcv_secure_media_vault.dart lib/verified_originals_publish_service.dart lib/secure_originals_page.dart lib/verified_originals_page.dart lib/user_home_page.dart lib/home_page.dart lib/commercial_gate.dart lib/camera_page.dart lib/sigillum_localization.dart lib/sigillum_quick_guide_page.dart test/verified_originals_v2_contract_test.dart
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "BUILD133: apply dart format"
            git push
          fi
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test --reporter expanded
      - name: Release architecture guard
        run: python3 tool/verify_postpatch_release_20260825.py
