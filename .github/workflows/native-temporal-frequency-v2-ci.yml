name: Native temporal frequency V2 validation

on:
  push:
    branches:
      - feature/native-temporal-frequency-v2

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply isolated native V2 patch
        run: |
          python3 tool/normalize_native_v2_patcher.py
          python3 tool/apply_native_temporal_frequency_v2.py
          python3 tool/update_frequency_v2_legacy_test.py

      - name: Format changed Dart
        run: dart format lib/camera_page.dart lib/hcv_temporal_frequency_probe.dart test/native_temporal_frequency_v2_contract_test.dart test/frequency_probe_session_safety_contract_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Native V2 regression tests
        run: flutter test test/native_temporal_frequency_v2_contract_test.dart test/frequency_probe_session_safety_contract_test.dart test/temporal_frequency_probe_contract_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Compile iOS device without signing
        run: flutter build ios --debug --no-codesign

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SIGILLUM CI"
          git config user.email "actions@users.noreply.github.com"
          git add ios/Runner/AppDelegate.swift lib/camera_page.dart lib/hcv_temporal_frequency_probe.dart test/native_temporal_frequency_v2_contract_test.dart test/frequency_probe_session_safety_contract_test.dart
          git rm -f tool/apply_native_temporal_frequency_v2.py tool/normalize_native_v2_patcher.py tool/update_frequency_v2_legacy_test.py .github/workflows/native-temporal-frequency-v2-ci.yml
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 0
          fi
          git commit -m "Add isolated native temporal frequency probe V2"
          git push origin HEAD:feature/native-temporal-frequency-v2
