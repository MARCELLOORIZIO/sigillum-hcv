name: Verify SIGILLUM TestFlight RC 20260824
# Final Codemagic-equivalent run after Registry finalizer analyzer corrections.

on:
  push:
    branches:
      - release/testflight-rc-20260824
    paths:
      - .github/workflows/verify-testflight-rc-20260824.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark pending
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"pending","context":"sigillum/testflight-preflight"}'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard frozen HCV core
        run: |
          git diff --exit-code f810af479546075ffe84c3ea2411dcc6300c0bb3..HEAD -- \
            lib/camera_page.dart lib/text_cert_page.dart lib/hcv_engine.dart \
            lib/hcv_live_screen_probe.dart lib/hcv_live_screen_probe_core.dart \
            lib/hcv_live_screen_probe_geometry.dart lib/hcv_scene_geometry_classifier.dart \
            lib/hcv_scene_decision_fusion.dart lib/hcv_display_risk_fusion.dart \
            lib/hcv_planar_motion_model.dart lib/hcv_projective_motion_model.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply reliable iOS share handoff
        run: python3 tool/run_ios_share_handoff_fix.py
      - name: Apply document import and Messenger OCR fixes
        run: python3 tool/apply_file_import_and_ocr_fix.py
      - name: Mark share OCR
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-share-ocr"}'

      - name: Apply certificate/capture corrections and format
        run: |
          python3 tool/apply_safe_capture_location_fix.py
          python3 tool/apply_mixed_scene_monitor_fix.py
          python3 tool/apply_planar_parallax_compile_safety.py
          python3 tool/apply_certificate_regression_fix.py
          python3 tool/apply_certificate_regression_compile_fix.py
          python3 tool/apply_certificate_regression_behavior_fix.py
          python3 tool/apply_certificate_contract_test_fix.py
          dart format lib/camera_page.dart lib/registry_verify_page.dart lib/hcv_capture_location.dart lib/hcv_location_image_watermark.dart lib/hcv_location_video_watermark.dart lib/hcv_planar_motion_model.dart lib/hcv_projective_motion_model.dart lib/hcv_live_screen_probe.dart lib/hcv_live_screen_probe_sampling.dart lib/hcv_live_screen_probe_geometry.dart lib/hcv_scene_geometry_classifier.dart lib/hcv_scene_decision_fusion.dart lib/hcv_display_risk_fusion.dart lib/hcv_live_screen_probe_core.dart test/camera_physical_scene_contract_test.dart test/photo_pre_capture_only_contract_test.dart test/registry_verify_hcv_id16_contract_test.dart test/capture_location_contract_test.dart test/camera_ready_video_evidence_contract_test.dart test/hcv_planar_motion_model_test.dart test/mixed_scene_monitor_regression_test.dart test/photo_display_risk_policy_test.dart test/monitor_certificate_regression_test.dart test/hcv_projective_motion_model_test.dart test/registry_local_republish_contract_test.dart
      - name: Mark capture format
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-capture-format"}'

      - name: Apply isolated Account success feedback
        run: |
          python3 tool/apply_account_success_feedback.py
          dart format lib/account_page.dart test/account_success_feedback_contract_test.dart
      - name: Mark account format
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-account-format"}'

      - name: Apply persistent text, Registry recovery and photo arming
        run: |
          python3 tool/apply_text_social_verification.py
          python3 tool/apply_text_keyboard_registry_photo_arm_fix.py
          dart format lib/camera_page.dart lib/text_cert_page.dart lib/hcv_text_integrity.dart lib/text_social_verify_page.dart test/hcv_text_integrity_test.dart test/text_social_workflow_contract_test.dart test/text_keyboard_registry_photo_arm_contract_test.dart
      - name: Mark text format
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-text-format"}'

      - name: Apply commercial access shell
        run: |
          python3 tool/apply_commercial_registry_auth.py
          python3 tool/apply_commercial_profile_shell.py
          python3 tool/apply_server_verified_billing_gate.py
          python3 tool/apply_media_specific_verification_picker_fix_20260822.py
          dart format lib/import_page.dart lib/hcv_registry_service.dart lib/hcv_auth_service.dart lib/user_home_page.dart lib/commercial_account_service.dart lib/commercial_billing_service.dart lib/commercial_gate.dart lib/commercial_profile_page.dart lib/main.dart test/commercial_billing_server_verification_contract_test.dart test/media_specific_verification_picker_contract_test.dart
      - name: Mark commercial format
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-commercial-format"}'

      - name: Flutter pub get
        run: flutter pub get
      - name: Mark pub get
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-pubget"}'

      - name: Pre-test media finalizer and contract
        run: |
          python3 tool/apply_media_specific_verification_picker_fix_20260822.py
          dart format lib/import_page.dart test/media_specific_verification_picker_contract_test.dart
          grep -F "import 'package:image_picker/image_picker.dart';" lib/import_page.dart
          grep -F "pickImage(source: ImageSource.gallery)" lib/import_page.dart
          grep -F "pickVideo(source: ImageSource.gallery)" lib/import_page.dart
          grep -F -- '--dart-define=SIGILLUM_EDITION=user' codemagic.yaml
          grep -F -- '--dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com' codemagic.yaml
      - name: Mark pretest contract
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-pretest-contract"}'

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Mark analyze
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-analyze"}'

      - name: Tests
        run: flutter test --reporter expanded
      - name: Mark tests
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-tests"}'

      - name: Post-test media finalizer
        run: |
          python3 tool/apply_media_specific_verification_picker_fix_20260822.py
          dart format lib/import_page.dart
          grep -F "import 'package:image_picker/image_picker.dart';" lib/import_page.dart
          grep -F "pickImage(source: ImageSource.gallery)" lib/import_page.dart
          grep -F "pickVideo(source: ImageSource.gallery)" lib/import_page.dart
      - name: Mark preflight success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/testflight-preflight","description":"Codemagic-equivalent TestFlight preflight passed"}'
      - name: Mark preflight failure
        if: failure()
        run: |
          curl -sS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"sigillum/testflight-preflight","description":"Codemagic-equivalent TestFlight preflight failed"}' || true
