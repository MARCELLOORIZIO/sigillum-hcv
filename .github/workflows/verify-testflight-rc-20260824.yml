name: Verify SIGILLUM TestFlight RC 20260824

on:
  push:
    branches:
      - release/testflight-rc-20260824
    paths:
      - .github/workflows/verify-testflight-rc-20260824.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark preflight pending
        run: |
          curl -fsS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"sigillum/testflight-preflight","description":"Validating TestFlight RC materialization"}'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard frozen HCV core
        run: |
          git diff --exit-code f810af479546075ffe84c3ea2411dcc6300c0bb3..HEAD -- \
            lib/camera_page.dart \
            lib/text_cert_page.dart \
            lib/hcv_engine.dart \
            lib/hcv_live_screen_probe.dart \
            lib/hcv_live_screen_probe_core.dart \
            lib/hcv_live_screen_probe_geometry.dart \
            lib/hcv_scene_geometry_classifier.dart \
            lib/hcv_scene_decision_fusion.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_planar_motion_model.dart \
            lib/hcv_projective_motion_model.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize Codemagic source
        run: |
          python3 tool/run_ios_share_handoff_fix.py
          python3 tool/apply_file_import_and_ocr_fix.py
          python3 tool/apply_safe_capture_location_fix.py
          python3 tool/apply_mixed_scene_monitor_fix.py
          python3 tool/apply_planar_parallax_compile_safety.py
          python3 tool/apply_certificate_regression_fix.py
          python3 tool/apply_certificate_regression_compile_fix.py
          python3 tool/apply_certificate_regression_behavior_fix.py
          python3 tool/apply_certificate_contract_test_fix.py
          python3 tool/apply_account_success_feedback.py
          python3 tool/apply_text_social_verification.py
          python3 tool/apply_text_keyboard_registry_photo_arm_fix.py
          python3 tool/apply_commercial_registry_auth.py
          python3 tool/apply_commercial_profile_shell.py
          python3 tool/apply_server_verified_billing_gate.py
          python3 tool/apply_media_specific_verification_picker_fix_20260822.py
          dart format lib test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify User/TestFlight contract
        run: |
          grep -F -- '--dart-define=SIGILLUM_EDITION=user' codemagic.yaml
          grep -F -- '--dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com' codemagic.yaml
          grep -F "import 'package:image_picker/image_picker.dart';" lib/import_page.dart
          grep -F "pickImage(source: ImageSource.gallery)" lib/import_page.dart
          grep -F "pickVideo(source: ImageSource.gallery)" lib/import_page.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      - name: Mark preflight success
        if: success()
        run: |
          curl -fsS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"success","context":"sigillum/testflight-preflight","description":"TestFlight RC preflight passed"}'

      - name: Mark preflight failure
        if: failure()
        run: |
          curl -sS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"failure","context":"sigillum/testflight-preflight","description":"TestFlight RC preflight failed"}' || true
