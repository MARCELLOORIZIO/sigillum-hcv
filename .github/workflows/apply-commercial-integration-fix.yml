name: Apply Commercial Integration Fix

on:
  push:
    branches:
      - fix/commercial-integration-20260816

permissions:
  contents: write

concurrency:
  group: commercial-integration-fix-20260816
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/commercial-integration-20260816
          fetch-depth: 0

      - name: Record frozen HCV hashes
        id: frozen
        shell: bash
        run: |
          echo "engine=$(git hash-object lib/hcv_engine.dart)" >> "$GITHUB_OUTPUT"
          echo "verifier=$(git hash-object lib/hcv_verifier.dart)" >> "$GITHUB_OUTPUT"
          echo "signer=$(git hash-object lib/hcv_keystore_signer.dart)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture pre-repair baseline test failures
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/commercial_fix_baseline_test.log
          status=${PIPESTATUS[0]}
          echo "Baseline flutter test exit code: $status"
          sed -nE 's#.*test/([^:]+\.dart):.*\[E\]$#\1#p' /tmp/commercial_fix_baseline_test.log | sort -u > /tmp/commercial_fix_baseline_failures.txt
          echo "Baseline failing test files:"
          cat /tmp/commercial_fix_baseline_failures.txt || true
          exit 0

      - name: Harden one-time patch helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_commercial_integration_fix.py')
          source = path.read_text(encoding='utf-8')
          old = """    if new in source:\n        print(f'{label}: already applied')\n        return\n    if old not in source:\n        raise RuntimeError(f'{label}: anchor not found in {path_str}')\n    path.write_text(source.replace(old, new, 1), encoding='utf-8')\n    print(f'{label}: applied')\n"""
          new = """    if old in source:\n        path.write_text(source.replace(old, new, 1), encoding='utf-8')\n        print(f'{label}: applied')\n        return\n    if new and new in source:\n        print(f'{label}: already applied')\n        return\n    raise RuntimeError(f'{label}: anchor not found in {path_str}')\n"""
          if old not in source:
              raise RuntimeError('replace_once helper anchor missing')
          source = source.replace(old, new, 1)
          old_guard = """for path in Path('lib').glob('*.dart'):\n    if 'https://hcv-registry-server.onrender.com' in path.read_text(encoding='utf-8'):\n        raise RuntimeError(f'legacy Registry host still present in {path}')\n"""
          new_guard = """for path in Path('lib').glob('*.dart'):\n    if path.name == 'hcv_ai_training_service.dart':\n        continue\n    if 'https://hcv-registry-server.onrender.com' in path.read_text(encoding='utf-8'):\n        raise RuntimeError(f'legacy Registry host still present in {path}')\n"""
          if old_guard not in source:
              raise RuntimeError('legacy-host guard anchor missing')
          source = source.replace(old_guard, new_guard, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply commercial-only repair
        run: python3 tool/apply_commercial_integration_fix.py

      - name: Apply entitlement and profile follow-up
        run: python3 tool/apply_commercial_integration_fix_followup.py

      - name: Align Registry authentication contract
        run: python3 tool/apply_commercial_contract_alignment.py

      - name: Verify frozen HCV files unchanged
        shell: bash
        run: |
          test "$(git hash-object lib/hcv_engine.dart)" = "${{ steps.frozen.outputs.engine }}"
          test "$(git hash-object lib/hcv_verifier.dart)" = "${{ steps.frozen.outputs.verifier }}"
          test "$(git hash-object lib/hcv_keystore_signer.dart)" = "${{ steps.frozen.outputs.signer }}"
          if git diff --name-only | grep -E '^lib/(hcv_engine|hcv_verifier|hcv_keystore_signer)\.dart$'; then
            echo "Frozen HCV core changed unexpectedly"
            exit 1
          fi

      - name: Reject obsolete commercial production host
        shell: bash
        run: |
          if grep -R --exclude='hcv_ai_training_service.dart' --line-number --fixed-strings 'https://hcv-registry-server.onrender.com' lib; then
            echo "Obsolete Registry host remains in commercial user-edition source"
            exit 1
          fi

      - name: Format repaired files
        run: |
          dart format \
            lib/hcv_registry_service.dart \
            lib/commercial_account_service.dart \
            lib/hcv_auth_service.dart \
            lib/commercial_gate.dart \
            lib/camera_page.dart \
            lib/legal_info_page.dart \
            lib/account_page.dart \
            lib/user_home_page.dart \
            lib/commercial_profile_page.dart

      - name: Analyze repaired app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run commercial integration contract tests
        run: |
          flutter test --reporter expanded \
            test/commercial_billing_server_verification_contract_test.dart \
            test/commercial_api_transport_contract_test.dart \
            test/account_page_contract_test.dart \
            test/kyc_recovery_contract_test.dart

      - name: Capture post-repair full test results
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/commercial_fix_patched_test.log
          status=${PIPESTATUS[0]}
          echo "Patched flutter test exit code: $status"
          sed -nE 's#.*test/([^:]+\.dart):.*\[E\]$#\1#p' /tmp/commercial_fix_patched_test.log | sort -u > /tmp/commercial_fix_patched_failures.txt
          echo "Post-repair failing test files:"
          cat /tmp/commercial_fix_patched_failures.txt || true
          exit 0

      - name: Reject any new full-suite regression
        shell: bash
        run: |
          comm -13 /tmp/commercial_fix_baseline_failures.txt /tmp/commercial_fix_patched_failures.txt > /tmp/commercial_fix_new_failures.txt
          if [ -s /tmp/commercial_fix_new_failures.txt ]; then
            echo "New failing test files introduced by commercial repair:"
            cat /tmp/commercial_fix_new_failures.txt
            exit 1
          fi
          for repaired in \
            commercial_billing_server_verification_contract_test.dart \
            commercial_api_transport_contract_test.dart \
            account_page_contract_test.dart; do
            if grep -Fxq "$repaired" /tmp/commercial_fix_patched_failures.txt; then
              echo "Commercial repair contract still failing: $repaired"
              exit 1
            fi
          done
          echo "No new full-suite regressions relative to pre-repair baseline."

      - name: Preserve test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p commercial-fix-diagnostics
          cp /tmp/commercial_fix_baseline_test.log commercial-fix-diagnostics/baseline_flutter_test.log 2>/dev/null || true
          cp /tmp/commercial_fix_patched_test.log commercial-fix-diagnostics/patched_flutter_test.log 2>/dev/null || true
          cp /tmp/commercial_fix_baseline_failures.txt commercial-fix-diagnostics/baseline_failures.txt 2>/dev/null || true
          cp /tmp/commercial_fix_patched_failures.txt commercial-fix-diagnostics/patched_failures.txt 2>/dev/null || true
          cp /tmp/commercial_fix_new_failures.txt commercial-fix-diagnostics/new_failures.txt 2>/dev/null || true

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-fix-test-diagnostics
          path: commercial-fix-diagnostics/
          if-no-files-found: error
          retention-days: 2

      - name: Show repair diff
        run: git diff --check && git diff --stat && git diff --name-only

      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet -- \
            lib/hcv_registry_service.dart \
            lib/commercial_account_service.dart \
            lib/hcv_auth_service.dart \
            lib/commercial_gate.dart \
            lib/camera_page.dart \
            lib/legal_info_page.dart \
            lib/account_page.dart \
            lib/user_home_page.dart \
            lib/commercial_profile_page.dart; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/hcv_registry_service.dart \
            lib/commercial_account_service.dart \
            lib/hcv_auth_service.dart \
            lib/commercial_gate.dart \
            lib/camera_page.dart \
            lib/legal_info_page.dart \
            lib/account_page.dart \
            lib/user_home_page.dart \
            lib/commercial_profile_page.dart
          git commit -m "Fix commercial billing KYC and Registry integration"
          git push origin HEAD:fix/commercial-integration-20260816
