name: Validate BUILD106 HFR V3 display and reality

on:
  push:
    branches:
      - fix/hfr-v3-display-reality-build106-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify BUILD105 clean base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f612a57df398342363bf32e261cd4ebbed24b99d HEAD
          echo "BUILD105 base verified"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply BUILD106 V3 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "BUILD106: the global physical display proof" lib/hcv_temporal_frequency_probe.dart; then
            echo "BUILD106 patch already materialized"
          else
            python3 tools/apply_build106_hfr_v3_display_reality.py
          fi

      - name: Guard intended diff only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u | tee /tmp/changed-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          lib/hcv_display_risk_fusion.dart
          lib/hcv_temporal_frequency_probe.dart
          test/hfr_v3_fullframe_mixed_scene_test.dart
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full test suite
        run: flutter test --reporter expanded

      - name: Commit validated application and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_temporal_frequency_probe.dart \
            test/hfr_v3_fullframe_mixed_scene_test.dart
          if git diff --cached --quiet; then
            echo "No new application diff to commit"
            exit 0
          fi
          git commit -m "fix: activate HFR V3 display-family and reality evidence"
          git push origin HEAD:fix/hfr-v3-display-reality-build106-20260912
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
          git status --short
