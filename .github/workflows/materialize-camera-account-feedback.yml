name: Materialize camera and account feedback

on:
  push:
    paths:
      - '.github/workflows/materialize-camera-account-feedback.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0
      - name: Apply camera and Account feedback changes
        run: python3 tool/apply_camera_account_feedback_fix.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format and verify
        run: |
          dart format lib/camera_page.dart lib/account_page.dart test/camera_ready_video_evidence_contract_test.dart test/account_page_contract_test.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Commit verified source
        run: |
          git config user.name 'SIGILLUM Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/camera_page.dart lib/account_page.dart test/camera_ready_video_evidence_contract_test.dart test/account_page_contract_test.dart
          if git diff --cached --quiet; then
            echo 'Camera and Account feedback already materialized'
          else
            git commit -m 'Align video monitor evidence and add success feedback'
            git push origin HEAD:fix/reality-monitor-geometry-20260725
          fi
