name: Apply BUILD92 capture lifecycle lock

on:
  push:
    branches:
      - fix/capture-lifecycle-lock-build92

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-lifecycle-lock-build92
          fetch-depth: 0

      - name: Verify BUILD92 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9d4b82082ec750203c13bb45fac5a8692a5351ca HEAD
          echo "HEAD before patch: $(git rev-parse HEAD)"

      - name: Correct exact BUILD92 generator details
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_capture_lifecycle_lock_build92.py')
          source = path.read_text(encoding='utf-8')

          old_matcher = "r'^\\s{32}recording = false;\\n',"
          new_matcher = "r'^\\s{28,36}recording = false;\\n',"
          if source.count(old_matcher) != 1:
              raise SystemExit('BUILD92 result-state matcher target mismatch')
          source = source.replace(old_matcher, new_matcher, 1)

          replacements = [
              (r"switchCamera() async {\n    if", r"switchCamera() async {\\n    if"),
              (r"toggleFlash() async {\n    if", r"toggleFlash() async {\\n    if"),
              (r"setZoom(double zoom) async {\n    if", r"setZoom(double zoom) async {\\n    if"),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'contract newline target mismatch: {old}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply capture lifecycle patch
        run: python3 tool/apply_capture_lifecycle_lock_build92.py

      - name: Restore HFR and torch behavior exactly to BUILD92
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          camera = Path('lib/camera_page.dart')
          source = camera.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "    var restoredFlashStateBeforeCapture = 'NOT_ATTEMPTED';\n",
              "",
              'remove HFR flash metadata state',
          )
          replace_once(
              """      try {
                await replacement.setFlashMode(savedFlash);
                restoredFlashStateBeforeCapture =
                    savedFlash == FlashMode.torch ? 'torch' : 'off';
              } catch (error) {
                restoredFlashStateBeforeCapture = 'RESTORE_FAILED';
                throw StateError('USER_FLASH_RESTORE_AFTER_NATIVE_PROBE_FAILED: $error');
              }
""",
              """      try {
                await replacement.setFlashMode(savedFlash);
              } catch (_) {}
""",
              'restore native probe flash behavior',
          )
          replace_once(
              """    probe = <String, dynamic>{
              ...probe,
              'requestedFlashStateBeforeProbe':
                  savedFlash == FlashMode.torch ? 'torch' : 'off',
              'actualTorchStateDuringProbe': 'NOT_VERIFIED_NATIVE_SESSION',
              'restoredFlashStateBeforeCapture': restoredFlashStateBeforeCapture,
              if (savedFlash == FlashMode.torch) ...{
                'captureLightingComparable': false,
                'nonComparableReason':
                    'USER_TORCH_ACTIVE_NATIVE_HFR_LIGHTING_NOT_VERIFIED',
                'decisionRole': 'SHADOW_ONLY_NEVER_DECISIONAL',
              },
            };
            return probe;
""",
              """    return probe;
""",
              'remove HFR torch metadata',
          )
          replace_once(
              """        } catch (error) {
                  throw StateError('USER_FLASH_RESTORE_BEFORE_PHOTO_FAILED: $error');
                }
""",
              """        } catch (_) {}
""",
              'restore photo flash behavior',
          )
          camera.write_text(source, encoding='utf-8')

          test = Path('test/camera_capture_lifecycle_contract_test.dart')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              "test('capture controls and torch handoff are guarded', () {",
              "test('capture controls are guarded', () {",
          )
          for assertion in [
              "            expect(source, contains(\"'actualTorchStateDuringProbe': 'NOT_VERIFIED_NATIVE_SESSION'\"));\n",
              "            expect(source, contains(\"'decisionRole': 'SHADOW_ONLY_NEVER_DECISIONAL'\"));\n",
              "            expect(source, contains('USER_FLASH_RESTORE_AFTER_NATIVE_PROBE_FAILED'));\n",
              "            expect(source, contains('USER_FLASH_RESTORE_BEFORE_PHOTO_FAILED'));\n",
          ]:
              if t.count(assertion) != 1:
                  raise SystemExit(f'torch assertion target mismatch: {assertion.strip()}')
              t = t.replace(assertion, '', 1)
          test.write_text(t, encoding='utf-8')
          PY

      - name: Migrate BUILD72 stop contract
        run: python3 tool/update_build72_lifecycle_contract.py

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Format changed Dart files
        run: dart format lib/camera_page.dart lib/hcv_capture_lifecycle.dart test/camera_capture_lifecycle_contract_test.dart test/build72_video_reality_and_container_regression_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Focused capture lifecycle tests
        run: flutter test test/camera_capture_lifecycle_contract_test.dart test/build72_video_reality_and_container_regression_test.dart --reporter expanded

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter suite
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/full-flutter-suite.log

      - name: Upload full Flutter suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-flutter-suite-log
          path: /tmp/full-flutter-suite.log
          if-no-files-found: error

      - name: Release verifier
        run: python3 tool/verify_postpatch_release_20260825.py

      - name: Commit validated patch only
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_capture_lifecycle_lock_build92.py
          rm -f tool/update_build72_lifecycle_contract.py
          rm -f .github/workflows/apply-capture-lifecycle-lock-build92.yml
          rm -f FAILING_TEST_FILE.txt
          rm -f FULL_FLUTTER_SUITE_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart lib/hcv_capture_lifecycle.dart test/camera_capture_lifecycle_contract_test.dart test/build72_video_reality_and_container_regression_test.dart tool/apply_capture_lifecycle_lock_build92.py tool/update_build72_lifecycle_contract.py .github/workflows/apply-capture-lifecycle-lock-build92.yml FAILING_TEST_FILE.txt FULL_FLUTTER_SUITE_FAILURE.log
          git diff --cached --check
          git commit -m "fix: lock camera capture lifecycle from BUILD92"
          git push origin HEAD:fix/capture-lifecycle-lock-build92