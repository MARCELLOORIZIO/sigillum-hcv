name: Apply BUILD92 capture lifecycle lock

on:
  push:
    branches:
      - fix/capture-lifecycle-lock-build92

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-lifecycle-lock-build92
          fetch-depth: 0

      - name: Verify BUILD92 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9d4b82082ec750203c13bb45fac5a8692a5351ca HEAD
          echo "HEAD before patch: $(git rev-parse HEAD)"

      - name: Apply capture lifecycle patch
        run: python3 tool/apply_capture_lifecycle_lock_build92.py

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Format changed Dart files
        run: dart format lib/camera_page.dart lib/hcv_capture_lifecycle.dart test/camera_capture_lifecycle_contract_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Focused capture lifecycle tests
        run: flutter test test/camera_capture_lifecycle_contract_test.dart --reporter expanded

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter suite
        run: flutter test --reporter expanded

      - name: Release verifier
        run: python3 tool/verify_postpatch_release_20260825.py

      - name: Commit validated patch only
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_capture_lifecycle_lock_build92.py
          rm -f .github/workflows/apply-capture-lifecycle-lock-build92.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart lib/hcv_capture_lifecycle.dart test/camera_capture_lifecycle_contract_test.dart tool/apply_capture_lifecycle_lock_build92.py .github/workflows/apply-capture-lifecycle-lock-build92.yml
          git diff --cached --check
          git commit -m "fix: lock camera capture lifecycle from BUILD92"
          git push origin HEAD:fix/capture-lifecycle-lock-build92
