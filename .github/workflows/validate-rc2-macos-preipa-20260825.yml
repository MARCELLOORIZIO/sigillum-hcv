name: Validate SIGILLUM RC2 macOS materialized pre-IPA

on:
  push:
    branches:
      - release/testflight-rc2-20260825
      - fix/capture-lifecycle-lock-build92
  pull_request:
    branches:
      - release/testflight-rc2-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preipa-macos:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up validated Flutter version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Enforce materialized-build architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'python3 tool/(apply_|finalize_)' codemagic.yaml tool/build_testflight_ipa_rc2_20260825.sh; then
            echo 'BUILD_PATCH_CHAIN_PRESENT=FAIL'
            exit 1
          fi
          echo 'BUILD_PATCH_CHAIN_PRESENT=NO'

          GITLINKS="$(git ls-files --stage | awk '$1 == "160000" {print $4}')"
          if [[ -n "$GITLINKS" ]]; then
            echo 'ORPHAN_GITLINK_PRESENT=FAIL'
            printf '%s\n' "$GITLINKS"
            exit 1
          fi
          echo 'ORPHAN_GITLINK_PRESENT=NO'

      - name: Resolve locked dependencies and pin external iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Analyze and test committed materialized source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          git diff --exit-code -- lib test ios/Runner ios/Podfile
          shasum -a 256 \
            lib/import_page.dart \
            lib/camera_page.dart \
            lib/commercial_account_service.dart \
            lib/registry_verify_page.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_scene_decision_fusion.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            ios/Runner/SceneDelegate.swift \
            > /tmp/source-before-tests.sha256
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded 2>&1 | tee /tmp/xcodebuild_logs/flutter-tests-materialized-macos.log
          python3 tool/verify_postpatch_release_20260825.py
          shasum -a 256 \
            lib/import_page.dart \
            lib/camera_page.dart \
            lib/commercial_account_service.dart \
            lib/registry_verify_page.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_scene_decision_fusion.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            ios/Runner/SceneDelegate.swift \
            > /tmp/source-after-tests.sha256
          diff -u /tmp/source-before-tests.sha256 /tmp/source-after-tests.sha256
          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Resolve CocoaPods for exact native runtime
        shell: bash
        run: |
          set -euo pipefail
          pushd ios >/dev/null
          pod install --repo-update
          popd >/dev/null
          test -f ios/Podfile.lock
          grep -F 'TensorFlowLiteSwift (2.17.0)' ios/Podfile.lock
          grep -n 'TensorFlowLite' ios/Podfile.lock | tee /tmp/xcodebuild_logs/tflite-pods.log
          git diff --exit-code -- lib test ios/Runner ios/Podfile
          echo 'MACOS_COCOAPODS_RUNTIME=PASS'

      - name: Build unsigned iOS Release from exact committed source
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 \
            lib/import_page.dart \
            lib/camera_page.dart \
            lib/commercial_account_service.dart \
            lib/registry_verify_page.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_scene_decision_fusion.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            ios/Runner/SceneDelegate.swift \
            > /tmp/source-before-ios-build.sha256

          flutter build ios --release --no-codesign --no-pub \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com \
            --dart-define=GIT_COMMIT="$GITHUB_SHA" \
            2>&1 | tee /tmp/xcodebuild_logs/flutter-ios-release-build.log

          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'

          FLUTTER_ASSETS="$APP/Frameworks/App.framework/flutter_assets"
          for MODEL in sigillum_screen_replay_v2.tflite sigillum_screen_replay_v1.tflite; do
            SOURCE_MODEL="assets/ml/$MODEL"
            BUILT_MODEL="$FLUTTER_ASSETS/assets/ml/$MODEL"
            test -f "$BUILT_MODEL"
            cmp "$SOURCE_MODEL" "$BUILT_MODEL"
            shasum -a 256 "$BUILT_MODEL" | tee -a /tmp/xcodebuild_logs/built-ml-assets.log
          done

          SHARE_EXTENSION="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -n 1 || true)"
          if [[ -z "$SHARE_EXTENSION" || ! -d "$SHARE_EXTENSION" ]]; then
            echo 'IOS_SHARE_EXTENSION_MISSING'
            exit 1
          fi
          echo "IOS_SHARE_EXTENSION=$SHARE_EXTENSION" | tee /tmp/xcodebuild_logs/ios-share-extension.log

          shasum -a 256 \
            lib/import_page.dart \
            lib/camera_page.dart \
            lib/commercial_account_service.dart \
            lib/registry_verify_page.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_scene_decision_fusion.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            ios/Runner/SceneDelegate.swift \
            > /tmp/source-after-ios-build.sha256
          diff -u /tmp/source-before-ios-build.sha256 /tmp/source-after-ios-build.sha256
          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml
          python3 tool/verify_postpatch_release_20260825.py
          echo 'IOS_UNSIGNED_RELEASE_BUILD=PASS'
          echo 'MACOS_MATERIALIZED_PREIPA=PASS'

      - name: Upload pre-IPA materialized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigillum-macos-materialized-preipa-audit
          path: |
            /tmp/xcodebuild_logs/*.log
            /tmp/source-before-tests.sha256
            /tmp/source-after-tests.sha256
            /tmp/source-before-ios-build.sha256
            /tmp/source-after-ios-build.sha256
            ios/Podfile.lock
            build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 14
