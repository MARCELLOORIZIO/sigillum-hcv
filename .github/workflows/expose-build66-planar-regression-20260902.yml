name: Validate Build66 Planar Monitor Fix

on:
  push:
    branches:
      - phase-c-build66-planar-multiframe-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Materialize narrow PLANAR multi-frame fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('lib/hcv_display_risk_fusion.dart')
          text = path.read_text()

          marker = 'ML_PLANAR_GEOMETRY_CORROBORATED_BY_MULTI_FRAME_SCREEN_EVIDENCE'
          if marker not in text:
              text, n1 = re.subn(
                  r"(    final mlUnresolvedGeometryOverride = !reflectedRealityEvidence &&\n        geometrySceneClass == 'UNKNOWN' &&\n        \(mlPersistentVideoEvidence \|\| mlMultiFrameScreenConsistency\);)",
                  r"\1\n    final mlPlanarGeometryOverride = !reflectedRealityEvidence &&\n        geometrySceneClass == 'PLANAR' &&\n        (mlPersistentVideoEvidence || mlMultiFrameScreenConsistency);",
                  text,
                  count=1,
              )
              text, n2 = re.subn(
                  r"    \} else if \(mlGeometryOverride \|\| mlUnresolvedGeometryOverride\) \{",
                  "    } else if (mlGeometryOverride ||\n        mlUnresolvedGeometryOverride ||\n        mlPlanarGeometryOverride) {",
                  text,
                  count=1,
              )
              text, n3 = re.subn(
                  r"      reasons\.add\(\n        mlGeometryOverride\n            \? 'ML_GEOMETRY_CONFLICT_RESOLVED_BY_CORROBORATED_SCREEN_EVIDENCE'\n            : 'ML_UNRESOLVED_GEOMETRY_RESOLVED_BY_CORROBORATED_SCREEN_EVIDENCE',\n      \);",
                  "      reasons.add(\n        mlGeometryOverride\n            ? 'ML_GEOMETRY_CONFLICT_RESOLVED_BY_CORROBORATED_SCREEN_EVIDENCE'\n            : mlUnresolvedGeometryOverride\n                ? 'ML_UNRESOLVED_GEOMETRY_RESOLVED_BY_CORROBORATED_SCREEN_EVIDENCE'\n                : 'ML_PLANAR_GEOMETRY_CORROBORATED_BY_MULTI_FRAME_SCREEN_EVIDENCE',\n      );",
                  text,
                  count=1,
              )
              if (n1, n2, n3) != (1, 1, 1):
                  raise SystemExit(f'unexpected patch counts: {(n1, n2, n3)}')
              path.write_text(text)
          PY
          dart format lib/hcv_display_risk_fusion.dart test/build66_planar_multiframe_regression_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Build66 planar regression
        run: flutter test test/build66_planar_multiframe_regression_test.dart --reporter expanded
      - name: Run 48-case and Phase C regression matrices
        run: |
          flutter test test/phase_c_48_case_promotion_matrix_test.dart --reporter expanded
          flutter test test/build65_display_recall_regression_test.dart --reporter expanded
          flutter test test/phase_c_ml_geometry_persistence_regression_test.dart --reporter expanded
          flutter test test/archive42_reality_active_probe_regression_test.dart --reporter expanded
          flutter test test/current_device_monitor_recall_regression_test.dart --reporter expanded
          flutter test test/reality_temporal_false_positive_regression_test.dart --reporter expanded
          flutter test test/hcv_display_risk_fusion_test.dart --reporter expanded
          flutter test test/hcv_display_risk_conflict_regression_test.dart --reporter expanded
      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded
      - name: Commit tested runtime fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/hcv_display_risk_fusion.dart test/build66_planar_multiframe_regression_test.dart; then
            echo 'No runtime/test changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/hcv_display_risk_fusion.dart test/build66_planar_multiframe_regression_test.dart
          git commit -m "fix: allow corroborated multi-frame ML for planar geometry"
          git push
