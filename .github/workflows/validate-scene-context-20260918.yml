name: Validate scene-context architecture

on:
  push:
    branches:
      - feature/display-scene-context-ledger-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focused scene-context regressions
        run: |
          flutter test \
            test/scene_context_final_policy_test.dart \
            test/build112_photo_optical_corroboration_test.dart \
            test/build115_reflection_semantic_resolution_test.dart \
            test/build116_bmw_display_hfr_mixedscene_test.dart \
            test/hfr_v3_fullframe_mixed_scene_test.dart \
            test/reality_temporal_false_positive_regression_test.dart

      - name: Full Flutter suite
        run: flutter test --reporter expanded
