name: Temporary Messenger iOS compile validation

on:
  push:
    branches:
      - fix/messenger-mlkit-image-preflight-20260901
    paths:
      - tool/tmp_messenger_ios_compile_trigger_20260901.txt

jobs:
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/messenger-mlkit-image-preflight-20260901
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign
