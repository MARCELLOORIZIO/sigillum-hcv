name: Diagnose commercial Codemagic format

on:
  push:
    branches:
      - release/testflight-rc-20260824
    paths:
      - .github/workflows/diagnose-commercial-format-20260824.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark diagnostic started
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"pending","context":"sigillum/tf-format-diagnostic"}'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Materialize through text stage
        run: |
          python3 tool/run_ios_share_handoff_fix.py
          python3 tool/apply_file_import_and_ocr_fix.py
          python3 tool/apply_safe_capture_location_fix.py
          python3 tool/apply_mixed_scene_monitor_fix.py
          python3 tool/apply_planar_parallax_compile_safety.py
          python3 tool/apply_certificate_regression_fix.py
          python3 tool/apply_certificate_regression_compile_fix.py
          python3 tool/apply_certificate_regression_behavior_fix.py
          python3 tool/apply_certificate_contract_test_fix.py
          dart format lib/camera_page.dart lib/registry_verify_page.dart lib/hcv_capture_location.dart lib/hcv_location_image_watermark.dart lib/hcv_location_video_watermark.dart lib/hcv_planar_motion_model.dart lib/hcv_projective_motion_model.dart lib/hcv_live_screen_probe.dart lib/hcv_live_screen_probe_sampling.dart lib/hcv_live_screen_probe_geometry.dart lib/hcv_scene_geometry_classifier.dart lib/hcv_scene_decision_fusion.dart lib/hcv_display_risk_fusion.dart lib/hcv_live_screen_probe_core.dart test/camera_physical_scene_contract_test.dart test/photo_pre_capture_only_contract_test.dart test/registry_verify_hcv_id16_contract_test.dart test/capture_location_contract_test.dart test/camera_ready_video_evidence_contract_test.dart test/hcv_planar_motion_model_test.dart test/mixed_scene_monitor_regression_test.dart test/photo_display_risk_policy_test.dart test/monitor_certificate_regression_test.dart test/hcv_projective_motion_model_test.dart test/registry_local_republish_contract_test.dart
          python3 tool/apply_account_success_feedback.py
          dart format lib/account_page.dart test/account_success_feedback_contract_test.dart
          python3 tool/apply_text_social_verification.py
          python3 tool/apply_text_keyboard_registry_photo_arm_fix.py
          dart format lib/camera_page.dart lib/text_cert_page.dart lib/hcv_text_integrity.dart lib/text_social_verify_page.dart test/hcv_text_integrity_test.dart test/text_social_workflow_contract_test.dart test/text_keyboard_registry_photo_arm_contract_test.dart
      - name: Mark text stage
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-text-stage"}'

      - id: patch_registry_auth
        name: Apply commercial Registry auth
        continue-on-error: true
        run: python3 tool/apply_commercial_registry_auth.py
      - name: Mark Registry auth patch
        if: always()
        env:
          OUTCOME: ${{ steps.patch_registry_auth.outcome }}
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-patch-registry-auth\"}"
      - id: patch_profile
        name: Apply commercial profile shell
        continue-on-error: true
        run: python3 tool/apply_commercial_profile_shell.py
      - name: Mark profile patch
        if: always()
        env:
          OUTCOME: ${{ steps.patch_profile.outcome }}
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-patch-profile\"}"
      - id: patch_billing_gate
        name: Apply server verified billing gate
        continue-on-error: true
        run: python3 tool/apply_server_verified_billing_gate.py
      - name: Mark billing gate patch
        if: always()
        env:
          OUTCOME: ${{ steps.patch_billing_gate.outcome }}
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-patch-billing-gate\"}"
      - id: patch_media
        name: Apply media verification finalizers
        continue-on-error: true
        run: python3 tool/apply_media_specific_verification_picker_fix_20260822.py
      - name: Mark media finalizer patch
        if: always()
        env:
          OUTCOME: ${{ steps.patch_media.outcome }}
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-patch-media\"}"

      - id: fmt_import
        continue-on-error: true
        run: dart format lib/import_page.dart
      - name: Mark import
        if: always()
        env: { OUTCOME: "${{ steps.fmt_import.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-import\"}"
      - id: fmt_registry
        continue-on-error: true
        run: dart format lib/hcv_registry_service.dart
      - name: Mark Registry service
        if: always()
        env: { OUTCOME: "${{ steps.fmt_registry.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-registry\"}"
      - id: fmt_auth
        continue-on-error: true
        run: dart format lib/hcv_auth_service.dart
      - name: Mark auth
        if: always()
        env: { OUTCOME: "${{ steps.fmt_auth.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-auth\"}"
      - id: fmt_home
        continue-on-error: true
        run: dart format lib/user_home_page.dart
      - name: Mark home
        if: always()
        env: { OUTCOME: "${{ steps.fmt_home.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-home\"}"
      - id: fmt_account_service
        continue-on-error: true
        run: dart format lib/commercial_account_service.dart
      - name: Mark account service
        if: always()
        env: { OUTCOME: "${{ steps.fmt_account_service.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-account-service\"}"
      - id: fmt_billing
        continue-on-error: true
        run: dart format lib/commercial_billing_service.dart
      - name: Mark billing service
        if: always()
        env: { OUTCOME: "${{ steps.fmt_billing.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-billing\"}"
      - id: fmt_gate
        continue-on-error: true
        run: dart format lib/commercial_gate.dart
      - name: Mark gate
        if: always()
        env: { OUTCOME: "${{ steps.fmt_gate.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-gate\"}"
      - id: fmt_profile
        continue-on-error: true
        run: dart format lib/commercial_profile_page.dart
      - name: Mark profile
        if: always()
        env: { OUTCOME: "${{ steps.fmt_profile.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-profile\"}"
      - id: fmt_main
        continue-on-error: true
        run: dart format lib/main.dart
      - name: Mark main
        if: always()
        env: { OUTCOME: "${{ steps.fmt_main.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-main\"}"
      - id: fmt_billing_test
        continue-on-error: true
        run: dart format test/commercial_billing_server_verification_contract_test.dart
      - name: Mark billing test
        if: always()
        env: { OUTCOME: "${{ steps.fmt_billing_test.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-billing-test\"}"
      - id: fmt_media_test
        continue-on-error: true
        run: dart format test/media_specific_verification_picker_contract_test.dart
      - name: Mark media test
        if: always()
        env: { OUTCOME: "${{ steps.fmt_media_test.outcome }}" }
        run: |
          state=success; [ "$OUTCOME" = success ] || state=failure
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$state\",\"context\":\"sigillum/tf-fmt-media-test\"}"
      - name: Mark diagnostic complete
        if: always()
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/tf-format-diagnostic"}'
