      - name: Add regression contract
        shell: bash
        run: |
          cat > test/ios_share_handoff_contract_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            group('iOS share handoff', () {
              final extension = File(
                'ios/SigillumShareExtension/ShareViewController.swift',
              ).readAsStringSync();
              final scene = File('ios/Runner/SceneDelegate.swift').readAsStringSync();
              final userHome = File('lib/user_home_page.dart').readAsStringSync();
              final labHome = File('lib/home_page.dart').readAsStringSync();

              test('share extension waits for an explicit user tap', () {
                expect(extension, contains('Tocca APRI SIGILLUM'));
                expect(extension, contains('openButton?.isEnabled = true'));
                expect(extension, isNot(contains('.now() + 0.6')));
                expect(extension, isNot(contains('finishOnSuccess')));
              });

              test('native layer keeps the path pending until Flutter pulls it', () {
                expect(scene, contains('stageSharedPathFromAppGroupIfNeeded'));
                expect(scene, contains('sharedPathAvailable'));
                expect(
                  scene,
                  contains('UserDefaults.standard.set(path, forKey: "hcv.sharedPath")'),
                );
                expect(
                  scene,
                  isNot(contains('intentChannel?.invokeMethod("onSharedPath", arguments: path)')),
                );
              });

              test('both Flutter homes retry the pending path on resume', () {
                for (final source in [userHome, labHome]) {
                  expect(source, contains('with WidgetsBindingObserver'));
                  expect(source, contains('AppLifecycleState.resumed'));
                  expect(source, contains("call.method == 'sharedPathAvailable'"));
                  expect(source, contains('_intentCheckInProgress'));
                  expect(source, contains('addPostFrameCallback'));
                }
              });
            });
          }
          DART

