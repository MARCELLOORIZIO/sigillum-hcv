name: Apply reliable iOS share handoff

on:
  push:
    paths:
      - '.github/workflows/apply-ios-share-handoff-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0

      - name: Patch iOS extension and native handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_string, old, new):
              path = Path(path_string)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_string}: expected one occurrence, found {count}: {old[:120]}'
                  )
              path.write_text(source.replace(old, new, 1))

          replace_once(
              'ios/SigillumShareExtension/ShareViewController.swift',
              '''  private func openHostAppAndFinish() {
    DispatchQueue.main.async {
      guard let url = URL(string: "\(self.urlScheme)://shared") else {
        self.showOpenFailed()
        return
      }

      self.pendingOpenUrl = url
      self.statusLabel?.text = "Contenuto pronto.\nTocca APRI SIGILLUM per verificare."
      self.openButton?.isHidden = false

      DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
        self.openUrl(url, finishOnSuccess: true)
      }
    }
  }
''',
              '''  private func openHostAppAndFinish() {
    DispatchQueue.main.async {
      guard let url = URL(string: "\(self.urlScheme)://shared") else {
        self.showOpenFailed()
        return
      }

      self.pendingOpenUrl = url
      self.statusLabel?.text = "Contenuto pronto.\nTocca APRI SIGILLUM per verificare."
      self.openButton?.isHidden = false
      self.openButton?.isEnabled = true
    }
  }
''',
          )

          replace_once(
              'ios/SigillumShareExtension/ShareViewController.swift',
              '''  @objc private func openButtonTapped() {
    guard let url = pendingOpenUrl else {
      showOpenFailed()
      return
    }
    openUrl(url, finishOnSuccess: true)
  }

  private func openUrl(_ url: URL, finishOnSuccess: Bool) {
    extensionContext?.open(url) { success in
      DispatchQueue.main.async {
        if success || self.openUrlViaResponderChain(url) {
          if finishOnSuccess {
            self.finish()
          }
        } else {
          self.showOpenFailed()
        }
      }
    }
  }
''',
              '''  @objc private func openButtonTapped() {
