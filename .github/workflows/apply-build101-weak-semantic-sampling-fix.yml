name: Validate BUILD101 bounded display fix

on:
  push:
    branches:
      - fix/build101-photo-video-weak-semantic-20260912
    paths:
      - tools/apply_build101_weak_semantic_sampling_fix.py
      - .github/workflows/apply-build101-weak-semantic-sampling-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/build101-photo-video-weak-semantic-20260912
          fetch-depth: 0

      - name: Verify branch still descends from validated BUILD101 source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cd391a6c010151cefebf97e02ebe3a3907eaa319 HEAD

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply bounded BUILD101 patch
        run: python3 tools/apply_build101_weak_semantic_sampling_fix.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run full regression suite
        run: flutter test --reporter expanded

      - name: Verify intended diff is clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain | awk '{print $2}' | grep -Ev '^(lib/hcv_display_risk_fusion.dart|lib/hcv_ml_screen_replay_classifier.dart|test/weak_semantic_no_physical_resolution_test.dart|test/video_ml_adaptive_sampling_contract_test.dart)$' || true)"

      - name: Commit only validated runtime and regression changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SIGILLUM CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            test/weak_semantic_no_physical_resolution_test.dart \
            test/video_ml_adaptive_sampling_contract_test.dart
          git diff --cached --check
          git commit -m "fix: resolve BUILD101 weak semantics and short-video sampling"
          git push origin HEAD:fix/build101-photo-video-weak-semantic-20260912
