name: D1 Clean Validation Temporary CI

on:
  push:
    branches:
      - fix/software-attestation-verifier-d1-clean-20260914

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run D1 targeted verifier tests
        run: flutter test test/hcv_software_attestation_verifier_test.dart --reporter expanded

      - name: Run full Flutter test suite
        run: flutter test --reporter expanded
