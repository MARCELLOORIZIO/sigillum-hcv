name: Temp video writer stability patch

on:
  push:
    branches:
      - fix/video-first-capture-ios-writer-20260831

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-first-capture-ios-writer-20260831

      - name: Apply targeted patch
        run: python3 .github/scripts/apply_video_writer_stability_patch.py

      - name: Commit patch when needed
        shell: bash
        run: |
          dart format lib/hcv_live_screen_probe_core.dart lib/camera_page.dart test/video_native_capture_writer_stability_contract_test.dart || true
          git config user.name "SIGILLUM CI"
          git config user.email "ci@sigillum-hcv.com"
          git add lib/hcv_live_screen_probe_core.dart lib/camera_page.dart test/video_native_capture_writer_stability_contract_test.dart
          git diff --cached --quiet && exit 0
          git diff --cached --check
          git commit -m "Video: avoid pre-capture writer collision on iOS"
          git push origin HEAD:fix/video-first-capture-ios-writer-20260831
