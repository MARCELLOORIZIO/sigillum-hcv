name: HCV Film v0 compression survivability

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/hcv-film-v0-20260923
    paths:
      - 'experiments/hcv_film_v0/**'
      - '.github/workflows/hcv-film-v0-validation.yml'
  pull_request:
    paths:
      - 'experiments/hcv_film_v0/**'
      - '.github/workflows/hcv-film-v0-validation.yml'

jobs:
  film-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: experiments/hcv_film_v0/requirements.txt
      - name: Install dependencies
        run: pip install -r experiments/hcv_film_v0/requirements.txt
      - name: Run HCV Film v0 experiment
        run: python experiments/hcv_film_v0/hcv_film_v0.py
      - name: Publish summary
        if: always()
        run: |
          echo '## HCV Film v0' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compression-survivability experiment only. No authenticity claim.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat experiments/hcv_film_v0/out/summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcv-film-v0-results
          path: |
            experiments/hcv_film_v0/out/results.csv
            experiments/hcv_film_v0/out/results.json
            experiments/hcv_film_v0/out/summary.json
            experiments/hcv_film_v0/out/*/photo_marked.png
            experiments/hcv_film_v0/out/*/video_marked_lossless.mp4
          if-no-files-found: warn
