name: Start final Codemagic TestFlight

on:
  push:
    branches:
      - release/testflight-final-20260827

jobs:
  start-testflight:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Codemagic app and start ios-testflight
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN || secrets.CODEMAGIC_API_TOKEN || secrets.CODEMAGIC_TOKEN }}
          REPOSITORY_FULL_NAME: ${{ github.repository }}
          RELEASE_BRANCH: release/testflight-final-20260827
        run: |
          set -euo pipefail
          if [[ -z "${CM_API_TOKEN:-}" ]]; then
            echo "CODEMAGIC_API_TOKEN_NOT_CONFIGURED"
            exit 2
          fi

          APPS_JSON="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CM_API_TOKEN}" \
            https://api.codemagic.io/apps > "$APPS_JSON"

          APP_ID="$(python3 - "$APPS_JSON" "$REPOSITORY_FULL_NAME" <<'PY'
import json
import sys

path, repo = sys.argv[1:]
data = json.load(open(path, encoding='utf-8'))
apps = data.get('applications') or data.get('apps') or []
repo_l = repo.lower()
for app in apps:
    candidates = [
        app.get('repositoryUrl'),
        app.get('repoUrl'),
        app.get('repository'),
        app.get('appName'),
        app.get('name'),
    ]
    text = ' '.join(str(v) for v in candidates if v).lower()
    if repo_l in text or 'sigillum-hcv' in text:
        print(app.get('_id') or app.get('id') or '')
        break
PY
)"

          if [[ -z "$APP_ID" ]]; then
            echo "CODEMAGIC_SIGILLUM_APP_NOT_FOUND"
            python3 - "$APPS_JSON" <<'PY'
import json, sys
x=json.load(open(sys.argv[1], encoding='utf-8'))
apps=x.get('applications') or x.get('apps') or []
for a in apps:
    print('APP', a.get('_id') or a.get('id'), a.get('appName') or a.get('name'), a.get('repositoryUrl') or a.get('repoUrl') or '')
PY
            exit 3
          fi

          echo "CODEMAGIC_APP_ID=$APP_ID"
          REQUEST_JSON="$(mktemp)"
          python3 - "$REQUEST_JSON" "$APP_ID" "$RELEASE_BRANCH" <<'PY'
import json, sys
out, app_id, branch = sys.argv[1:]
with open(out, 'w', encoding='utf-8') as f:
    json.dump({
        'appId': app_id,
        'workflowId': 'ios-testflight',
        'branch': branch,
    }, f)
PY

          RESPONSE_JSON="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CM_API_TOKEN}" \
            --request POST \
            --data-binary "@$REQUEST_JSON" \
            https://api.codemagic.io/builds > "$RESPONSE_JSON"

          python3 - "$RESPONSE_JSON" <<'PY'
import json, sys
x=json.load(open(sys.argv[1], encoding='utf-8'))
b=x.get('build') or x
print('CODEMAGIC_BUILD_ID=' + str(b.get('_id') or b.get('id') or 'UNKNOWN'))
print('CODEMAGIC_BUILD_STATUS=' + str(b.get('status') or 'QUEUED'))
PY
