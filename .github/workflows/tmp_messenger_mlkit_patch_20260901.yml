name: Temporary Messenger MLKit crash patch

on:
  push:
    branches:
      - fix/messenger-mlkit-image-preflight-20260901

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message == 'chore: add temporary Messenger MLKit crash patcher'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/messenger-mlkit-image-preflight-20260901
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply crash patch
        run: python3 tool/tmp_patch_messenger_mlkit_preflight_20260901.py
      - name: Format Dart
        run: dart format lib/hcv_media_id_ocr.dart test/messenger_mlkit_image_preflight_contract_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter test suite
        run: flutter test --reporter expanded
      - name: Commit validated patch
        run: |
          git config user.name "MARCELLOORIZIO"
          git config user.email "MARCELLOORIZIO@YAHOO.IT"
          git add lib/hcv_media_id_ocr.dart ios/Runner/SceneDelegate.swift ios/SigillumShareExtension/ShareViewController.swift test/messenger_mlkit_image_preflight_contract_test.dart
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: guard Messenger images before ML Kit OCR"
          git push origin HEAD:fix/messenger-mlkit-image-preflight-20260901
