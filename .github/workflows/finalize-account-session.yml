name: Finalize SIGILLUM account session

on:
  push:
    paths:
      - '.github/workflows/finalize-account-session.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0
      - name: Preserve session expiry during profile updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/account_page.dart')
          source = path.read_text()
          old = """    if (!mounted) return;
              setState(() {
                _account = account;
                _sessionExpiresAt = envelope['expiresAt']?.toString() ?? '';
                _emailController.text = account['email']?.toString() ?? '';
              });
          """
          new = """    if (!mounted) return;
              final returnedExpiry = envelope['expiresAt']?.toString() ?? '';
              setState(() {
                _account = account;
                if (returnedExpiry.isNotEmpty) {
                  _sessionExpiresAt = returnedExpiry;
                }
                _emailController.text = account['email']?.toString() ?? '';
              });
          """
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit('Account expiry patch anchor not found exactly once')
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY
      - name: Commit final Account source
        run: |
          git config user.name 'SIGILLUM Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/account_page.dart
          if git diff --cached --quiet; then
            echo 'Account session already finalized'
          else
            git commit -m 'Preserve active account session expiry after profile updates'
            git push origin HEAD:fix/reality-monitor-geometry-20260725
          fi
