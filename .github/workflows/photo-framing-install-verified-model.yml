name: PHOTO install verified trained TFLite artifact
on:
  push:
    branches: [experiment/photo-framing-context-guard-20261010]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  install-verified-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/photo-framing-context-guard-20261010
          persist-credentials: true
      - name: Download model which passed original-checkpoint parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38145523635 -R ${{ github.repository }} --name sigillum-trained-framing-tflite-parity --dir /tmp/sigillum-parity
      - name: Verify SHA-256 and copy isolated experimental model
        run: |
          echo 'fb66682d213e15f2418ab802c3d00af375b57646e94c50fd0d18a8c8422c567f  /tmp/sigillum-parity/sigillum_photo_framing_v1.tflite' | sha256sum --check
          mkdir -p assets/ml
          cp /tmp/sigillum-parity/sigillum_photo_framing_v1.tflite assets/ml/
          cp /tmp/sigillum-parity/sigillum_photo_framing_v1_PARITY.json ml/
      - name: Commit only the verified TFLite asset and parity report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ml/sigillum_photo_framing_v1.tflite ml/sigillum_photo_framing_v1_PARITY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add parity-verified experimental SIGILLUM PHOTO TFLite model'
          git push origin HEAD:experiment/photo-framing-context-guard-20261010
