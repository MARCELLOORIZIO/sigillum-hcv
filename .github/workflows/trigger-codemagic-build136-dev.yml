name: Trigger Codemagic BUILD136 Development

on:
  push:
    branches:
      - feature/build133-closed-chain-vault-youtube-20260925
    paths:
      - '.github/workflows/trigger-codemagic-build136-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CM_A: ${{ secrets.CM_API_TOKEN }}
      CM_B: ${{ secrets.CODEMAGIC_API_TOKEN }}
    steps:
      - name: Start Codemagic development build
        shell: bash
        run: |
          set -euo pipefail
          token="$CM_A"
          if [[ -z "$token" ]]; then token="$CM_B"; fi
          if [[ -z "$token" ]]; then
            echo "CODEMAGIC_API_TOKEN_MISSING"
            exit 2
          fi
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "x-auth-token: $token" \
            --data '{"appId":"6a0747e8d58afdcf30d2793c","workflowId":"ios-workflow","branch":"feature/build133-closed-chain-vault-youtube-20260925"}' \
            -X POST https://api.codemagic.io/builds | tee codemagic-build.json
          grep -q '"buildId"' codemagic-build.json
          echo "CODEMAGIC_BUILD136_DEVELOPMENT_TRIGGERED=PASS"

      - name: Upload trigger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemagic-build136-development-trigger-evidence
          path: codemagic-build.json
          if-no-files-found: ignore
          retention-days: 7
