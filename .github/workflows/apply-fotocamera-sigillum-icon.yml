name: Install Fotocamera Sigillum icon

on:
  push:
    paths:
      - '.github/workflows/apply-fotocamera-sigillum-icon.yml'

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active iOS branch
        uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Download selected SIGILLUM icon
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F20df3999-ada4-4d46-96da-64c991475e4a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANR8JNHQ5c54DQCZxWM-TUOgLWE5fJMhxBUiR4vPLs2j&exp=1785200516&osig=AAAAAAAAAAAAAAAAAAAAACdjwhpPHIBiFRFqME1M_0hIsI_z0BlrEEdDcQJmBwCL&signer=media-rpc&x-canva-quality=thumbnail' \
            --output /tmp/fotocamera_sigillum.png
          file /tmp/fotocamera_sigillum.png

      - name: Generate complete iOS AppIcon catalog
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('/tmp/fotocamera_sigillum.png').convert('RGB')
          catalog = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          catalog.mkdir(parents=True, exist_ok=True)

          sizes = {
              'Icon-App-20x20@1x.png': 20,
              'Icon-App-20x20@2x.png': 40,
              'Icon-App-20x20@3x.png': 60,
              'Icon-App-29x29@1x.png': 29,
              'Icon-App-29x29@2x.png': 58,
              'Icon-App-29x29@3x.png': 87,
              'Icon-App-40x40@1x.png': 40,
              'Icon-App-40x40@2x.png': 80,
              'Icon-App-40x40@3x.png': 120,
              'Icon-App-50x50@1x.png': 50,
              'Icon-App-50x50@2x.png': 100,
              'Icon-App-57x57@1x.png': 57,
              'Icon-App-57x57@2x.png': 114,
              'Icon-App-60x60@2x.png': 120,
              'Icon-App-60x60@3x.png': 180,
              'Icon-App-72x72@1x.png': 72,
              'Icon-App-72x72@2x.png': 144,
              'Icon-App-76x76@1x.png': 76,
              'Icon-App-76x76@2x.png': 152,
              'Icon-App-83.5x83.5@2x.png': 167,
              'Icon-App-1024x1024@1x.png': 1024,
          }

          for filename, pixels in sizes.items():
              resized = source.resize((pixels, pixels), Image.Resampling.LANCZOS)
              resized.save(catalog / filename, format='PNG', optimize=True, compress_level=9)
          PY

      - name: Commit generated icons to active branch
        shell: bash
        run: |
          git config user.name 'SIGILLUM Icon Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
          git commit -m 'Install Fotocamera Sigillum iOS app icon'
          git push origin HEAD:fix/reality-monitor-geometry-20260725
