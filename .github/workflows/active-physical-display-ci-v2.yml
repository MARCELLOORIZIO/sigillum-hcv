name: Active physical display integration v2

on:
  push:
    branches:
      - feature/active-physical-display-photo-video
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/active-physical-display-photo-video
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 tool/apply_active_physical_display_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Format changed Dart
        run: dart format lib/camera_page.dart lib/hcv_display_physical_discriminator.dart lib/hcv_video_short_exposure_probe.dart test/hcv_display_physical_discriminator_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test new discriminator
        run: flutter test test/hcv_display_physical_discriminator_test.dart --reporter expanded

      - name: Test full suite with diagnostics
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-test-full.log
          status=${PIPESTATUS[0]}
          echo "===== CONCISE FAILURE DIAGNOSTICS ====="
          grep -nE "Expected:|Actual:|Which:|Failure|FAILED|Some tests failed|Test failed|test/.*\.dart" /tmp/flutter-test-full.log | tail -250 || true
          echo "===== FINAL TEST LOG TAIL ====="
          tail -250 /tmp/flutter-test-full.log
          exit "$status"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-physical-display-flutter-test-log
          path: /tmp/flutter-test-full.log
          if-no-files-found: ignore

      - name: Commit validated integration
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/camera_page.dart lib/hcv_display_physical_discriminator.dart lib/hcv_video_short_exposure_probe.dart test/hcv_display_physical_discriminator_test.dart; then
            echo "No generated integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart lib/hcv_display_physical_discriminator.dart lib/hcv_video_short_exposure_probe.dart test/hcv_display_physical_discriminator_test.dart
          git commit -m "Activate SHORT_1X physical discriminator for photo and video"
          git push origin HEAD:feature/active-physical-display-photo-video
