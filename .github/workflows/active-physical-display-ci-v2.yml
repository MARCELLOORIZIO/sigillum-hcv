name: Active physical display integration v2

on:
  push:
    branches:
      - feature/active-physical-display-photo-video
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/active-physical-display-photo-video
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 tool/apply_active_physical_display_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Format changed Dart
        run: dart format lib/camera_page.dart lib/hcv_display_physical_discriminator.dart lib/hcv_video_short_exposure_probe.dart test/hcv_display_physical_discriminator_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      - name: Commit validated integration
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/camera_page.dart lib/hcv_display_physical_discriminator.dart lib/hcv_video_short_exposure_probe.dart test/hcv_display_physical_discriminator_test.dart; then
            echo "No generated integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart lib/hcv_display_physical_discriminator.dart lib/hcv_video_short_exposure_probe.dart test/hcv_display_physical_discriminator_test.dart
          git commit -m "Activate SHORT_1X physical discriminator for photo and video"
          git push origin HEAD:feature/active-physical-display-photo-video
