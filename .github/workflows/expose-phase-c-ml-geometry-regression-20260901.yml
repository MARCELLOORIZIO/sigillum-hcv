name: Expose Phase C ML Geometry Regression

on:
  push:
    branches:
      - phase-c-ml-geometry-persistence-20260901

permissions:
  contents: read

jobs:
  expose-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Run physical ML geometry regression before fix
        run: flutter test test/phase_c_ml_geometry_persistence_regression_test.dart --reporter expanded
