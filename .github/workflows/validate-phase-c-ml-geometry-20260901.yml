name: Validate Phase C ML Geometry Persistence

on:
  push:
    branches:
      - phase-c-ml-geometry-persistence-20260901

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply narrow ML geometry conflict patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/hcv_display_risk_fusion.dart')
          text = path.read_text()

          old_ml = '''    final mlRealityStrong =\n        mlSaysReality && (mlConfidence ?? 0.0) >= 0.90 && mlScore <= 2;\n    final mlOpticalCorroborated = mlStrong &&\n'''
          new_ml = '''    final mlRealityStrong =\n        mlSaysReality && (mlConfidence ?? 0.0) >= 0.90 && mlScore <= 2;\n    final mlFramesAnalyzed = (ml?['framesAnalyzed'] as num?)?.toInt() ?? 0;\n    final mlStrongScreenFrameCount =\n        (ml?['strongScreenFrameCount'] as num?)?.toInt() ?? 0;\n    final mlSignals = _signals(ml);\n    final mlFullFrameRisk =\n        (mlSignals['fullFrameRiskScore'] as num?)?.toInt() ?? 0;\n    final mlContentAreaRisk =\n        (mlSignals['contentAreaRiskScore'] as num?)?.toInt() ?? 0;\n    final mlPersistentVideoEvidence = mlSaysScreen &&\n        mlFramesAnalyzed >= 3 &&\n        mlStrongScreenFrameCount >= 3 &&\n        mlStrongScreenFrameCount * 4 >= mlFramesAnalyzed * 3 &&\n        (mlAverageFrameScore ?? 0.0) >= 90.0 &&\n        (mlScreenProbability ?? 0.0) >= 0.93 &&\n        (mlConfidence ?? 0.0) >= 0.85;\n    final mlDualRegionPhotoEvidence = mlSaysScreen &&\n        mlFramesAnalyzed == 1 &&\n        mlFullFrameRisk >= 94 &&\n        mlContentAreaRisk >= 90 &&\n        (mlScreenProbability ?? 0.0) >= 0.97 &&\n        (mlConfidence ?? 0.0) >= 0.90;\n    final mlPersistentCorroboratedEvidence =\n        mlPersistentVideoEvidence || mlDualRegionPhotoEvidence;\n    final mlOpticalCorroborated = mlStrong &&\n'''

          old_geometry = '''    final geometryReality =\n        reflectedRealityEvidence || geometrySceneClass == 'REALITY';\n    final geometryPlanar = geometrySceneClass == 'PLANAR';\n'''
          new_geometry = '''    final geometryReality =\n        reflectedRealityEvidence || geometrySceneClass == 'REALITY';\n    final geometryPlanar = geometrySceneClass == 'PLANAR';\n    final mlGeometryOverride = !reflectedRealityEvidence &&\n        geometrySceneClass == 'REALITY' &&\n        mlPersistentCorroboratedEvidence;\n'''

          old_decision = '''    } else if (mlStrong && geometryReality) {\n      decision = 'NON_CONCLUSIVE';\n      score = max(45, min(rawScore, 69));\n      reasons.add('ML_GEOMETRY_CONFLICT');\n'''
          new_decision = '''    } else if (mlGeometryOverride) {\n      decision = 'STRONG_DISPLAY_RISK';\n      score = max(max(rawScore, mlStrongestFrameScore), 85)\n          .clamp(85, 100)\n          .toInt();\n      if (mlPersistentVideoEvidence) {\n        reasons.add('ML_SCREEN_MULTI_FRAME_PERSISTENCE_CONFIRMED');\n      }\n      if (mlDualRegionPhotoEvidence) {\n        reasons.add('ML_SCREEN_DUAL_REGION_CONFIRMED');\n      }\n      reasons.add(\n        'ML_GEOMETRY_CONFLICT_RESOLVED_BY_CORROBORATED_SCREEN_EVIDENCE',\n      );\n    } else if (mlStrong && geometryReality) {\n      decision = 'NON_CONCLUSIVE';\n      score = max(45, min(rawScore, 69));\n      reasons.add('ML_GEOMETRY_CONFLICT');\n'''

          replacements = [
              ('ML anchor', old_ml, new_ml),
              ('geometry anchor', old_geometry, new_geometry),
              ('decision anchor', old_decision, new_decision),
          ]
          for name, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          required = [
              'mlPersistentVideoEvidence',
              'mlDualRegionPhotoEvidence',
              'mlGeometryOverride',
              'ML_GEOMETRY_CONFLICT_RESOLVED_BY_CORROBORATED_SCREEN_EVIDENCE',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing required token: {token}')

          path.write_text(text)
          PY

          dart format \
            lib/hcv_display_risk_fusion.dart \
            test/phase_c_ml_geometry_persistence_regression_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Phase C ML geometry regression matrix
        run: |
          flutter test \
            test/phase_c_ml_geometry_persistence_regression_test.dart \
            test/hcv_display_risk_conflict_regression_test.dart \
            test/hcv_display_risk_fusion_test.dart \
            test/current_device_monitor_recall_regression_test.dart \
            test/mixed_scene_monitor_regression_test.dart \
            test/reality_temporal_false_positive_regression_test.dart \
            test/geometry_not_absolute_proof_test.dart \
            --reporter expanded

      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded

      - name: Materialize only tested runtime and regression test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/hcv_display_risk_fusion.dart \
            test/phase_c_ml_geometry_persistence_regression_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve ML geometry conflict with corroborated screen evidence [skip ci]"
            git push origin HEAD:phase-c-ml-geometry-persistence-20260901
          fi
