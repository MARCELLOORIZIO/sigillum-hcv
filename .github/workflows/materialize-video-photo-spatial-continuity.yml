name: VIDEO PHOTO-like spatial continuity materialization

on:
  push:
    branches:
      - feature/video-photo-spatial-continuity-20260913

permissions:
  contents: write

concurrency:
  group: video-photo-spatial-continuity-20260913
  cancel-in-progress: false

jobs:
  materialize-test-checkpoint:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Stop after tested source checkpoint
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fq 'VIDEO: materialize PHOTO-like spatial continuity'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.guard.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply VIDEO PHOTO-like continuity patch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/materialize_video_photo_spatial_continuity.py
          dart format \
            lib/hcv_video_photo_spatial_evidence.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            lib/hcv_display_risk_fusion.dart \
            test/video_photo_spatial_evidence_test.dart \
            test/video_photo_spatial_fusion_test.dart
          git add -N \
            lib/hcv_video_photo_spatial_evidence.dart \
            test/video_photo_spatial_evidence_test.dart \
            test/video_photo_spatial_fusion_test.dart

      - name: Prove narrow patch scope
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 5
          printf '%s\n' "$changed" | grep -Fx 'lib/hcv_display_risk_fusion.dart'
          printf '%s\n' "$changed" | grep -Fx 'lib/hcv_ml_screen_replay_classifier.dart'
          printf '%s\n' "$changed" | grep -Fx 'lib/hcv_video_photo_spatial_evidence.dart'
          printf '%s\n' "$changed" | grep -Fx 'test/video_photo_spatial_evidence_test.dart'
          printf '%s\n' "$changed" | grep -Fx 'test/video_photo_spatial_fusion_test.dart'
          grep -F 'SIGILLUM_VIDEO_PHOTO_SPATIAL_EVIDENCE_V1' lib/hcv_video_photo_spatial_evidence.dart
          grep -F 'VIDEO_PHOTO_SPATIAL_CORROBORATION' lib/hcv_display_risk_fusion.dart
          grep -F 'contentArea >= 85' lib/hcv_display_risk_fusion.dart
          grep -F 'ML_THREE_FRAME_FULL_FRAME_SCREEN_RECOVERY_V109' lib/hcv_display_risk_fusion.dart

      - name: Resolve dependencies
        if: steps.guard.outputs.skip != 'true'
        run: flutter pub get

      - name: Run focused VIDEO spatial and regression tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/video-photo-spatial
          flutter test test/video_photo_spatial_evidence_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/evidence.log
          flutter test test/video_photo_spatial_fusion_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/fusion.log
          flutter test test/build109_ml_fullframe_recovery_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/build109-ml-regression.log
          flutter test test/build109_low_modulation_hfr_recovery_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/build109-hfr-regression.log
          flutter test test/hfr_v3_fullframe_mixed_scene_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/mixed-scene-regression.log
          flutter test test/hcv_display_risk_fusion_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/display-fusion-regression.log
          flutter test test/reality_temporal_false_positive_regression_test.dart --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/reality-fp-regression.log

      - name: Analyze and run full Flutter suite
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/video-photo-spatial/flutter-analyze.log
          flutter test --reporter expanded 2>&1 | tee /tmp/video-photo-spatial/flutter-tests-full.log

      - name: Compile iOS without signing
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/video-photo-spatial/ios-no-codesign.log

      - name: Restore toolchain mutations and prove final source scope
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Tracked/untracked status immediately after validation:'
          git status --short
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed" | while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              lib/hcv_display_risk_fusion.dart|lib/hcv_ml_screen_replay_classifier.dart|lib/hcv_video_photo_spatial_evidence.dart|test/video_photo_spatial_evidence_test.dart|test/video_photo_spatial_fusion_test.dart)
                ;;
              *)
                echo "Restoring toolchain-generated tracked mutation: $path"
                git restore --staged --worktree -- "$path" || git checkout -- "$path"
                ;;
            esac
          done
          git add -N \
            lib/hcv_video_photo_spatial_evidence.dart \
            test/video_photo_spatial_evidence_test.dart \
            test/video_photo_spatial_fusion_test.dart
          changed="$(git diff --name-only)"
          echo 'Authorized diff after restoration:'
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 5
          git diff --check

      - name: Commit tested source checkpoint
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_ml_screen_replay_classifier.dart \
            lib/hcv_video_photo_spatial_evidence.dart \
            test/video_photo_spatial_evidence_test.dart \
            test/video_photo_spatial_fusion_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'VIDEO: materialize PHOTO-like spatial continuity'
          git push origin HEAD:feature/video-photo-spatial-continuity-20260913

      - name: Upload validation logs
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-photo-spatial-continuity-validation
          path: /tmp/video-photo-spatial
          if-no-files-found: warn
          retention-days: 14
