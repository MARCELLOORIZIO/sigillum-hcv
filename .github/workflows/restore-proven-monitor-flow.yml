name: Restore proven monitor capture flow

on:
  push:
    paths:
      - '.github/workflows/restore-proven-monitor-flow.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0
      - name: Restore pre-movement camera flow
        run: |
          git checkout 998a0ef9184430b0c92cd919a18a755a9a63226c -- lib/camera_page.dart test/physical_probe_user_instruction_test.dart
          rm -f test/capture_motion_gate_contract_test.dart
      - name: Commit exact monitor-flow restoration
        run: |
          git config user.name 'SIGILLUM Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A lib/camera_page.dart test/capture_motion_gate_contract_test.dart test/physical_probe_user_instruction_test.dart
          if git diff --cached --quiet; then
            echo 'Monitor capture flow already restored'
          else
            git commit -m 'Restore proven photo and video monitor detection flow'
            git push origin HEAD:fix/reality-monitor-geometry-20260725
          fi
