name: Production flow CI

on:
  push:
    branches:
      - fix/production-flows-display-registry-20260723
  pull_request:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
