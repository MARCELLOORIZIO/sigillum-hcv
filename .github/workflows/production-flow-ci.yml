name: Production flow CI

on:
  push:
    branches:
      - fix/production-flows-display-registry-20260723
  pull_request:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze compile errors
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > flutter_analyze.log 2>&1
          code=$?
          cat flutter_analyze.log
          exit $code
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: flutter_analyze.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: flutter test
