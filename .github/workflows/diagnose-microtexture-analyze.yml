name: Diagnose microtexture analyze

on:
  push:
    branches:
      - diagnose/microtexture-analyze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze full log
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
