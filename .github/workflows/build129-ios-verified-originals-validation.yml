name: BUILD129 iOS Verified Originals validation

on:
  push:
    branches:
      - feature/verified-originals-v02-trusted-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build129:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Resolve locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Verify BUILD129 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 1.0.0+129' pubspec.yaml
          grep -Fq '/api/verified-originals/' lib/verified_originals_page.dart
          grep -Fq '/view' lib/verified_originals_page.dart
          grep -Fq 'billingStatus()' lib/verified_originals_page.dart
          grep -Fq 'SUBSCRIPTION_REQUIRED' lib/verified_originals_page.dart
          grep -Fq 'SIGILLUM_API_BASE_URL' lib/hcv_registry_service.dart
          grep -Fq 'https://sigillum-registry-production.onrender.com' lib/hcv_registry_service.dart
          grep -Fq 'https://sigillum-registry-production.onrender.com' lib/commercial_account_service.dart
          grep -Fq 'com.sigillum.hcv' ios/Runner.xcodeproj/project.pbxproj

      - name: Analyze and test app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/build129-ios
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/build129-ios/analyze.log
          flutter test --reporter expanded 2>&1 | tee /tmp/build129-ios/flutter-tests.log
          git diff --exit-code -- lib test ios/Runner ios/Podfile pubspec.yaml analysis_options.yaml

      - name: Resolve CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          pushd ios >/dev/null
          pod install --repo-update
          popd >/dev/null
          test -f ios/Podfile.lock
          grep -F 'TensorFlowLiteSwift (2.17.0)' ios/Podfile.lock
          git diff --exit-code -- lib test ios/Runner ios/Podfile pubspec.yaml analysis_options.yaml

      - name: Build unsigned iPhone Release
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub \
            --build-number=129 \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=SIGILLUM_BUILD_NUMBER=129 \
            --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com \
            --dart-define=GIT_COMMIT="$GITHUB_SHA" \
            2>&1 | tee /tmp/build129-ios/flutter-ios-release.log

          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '129'

          FLUTTER_ASSETS="$APP/Frameworks/App.framework/flutter_assets"
          test -f "$FLUTTER_ASSETS/assets/ml/sigillum_screen_replay_v3_multihead.tflite"
          test -f "$FLUTTER_ASSETS/assets/ml/sigillum_screen_replay_v2.tflite"
          test -f "$FLUTTER_ASSETS/assets/ml/sigillum_screen_replay_v1.tflite"

          SHARE_EXTENSION="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -n 1 || true)"
          test -n "$SHARE_EXTENSION"
          test -d "$SHARE_EXTENSION"

          python3 tool/verify_postpatch_release_20260825.py
          git diff --exit-code -- lib test ios/Runner ios/Podfile pubspec.yaml analysis_options.yaml
          echo 'BUILD129_IOS_UNSIGNED_RELEASE=PASS'

      - name: Upload BUILD129 preflight audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build129-ios-verified-originals-preflight
          path: |
            /tmp/build129-ios/*.log
            ios/Podfile.lock
          if-no-files-found: warn
          retention-days: 14
