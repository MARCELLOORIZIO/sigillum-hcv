name: Illumination response fusion V1 validation

on:
  push:
    branches:
      - feature/illumination-response-fusion-v1

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply illumination response fusion V1
        run: python3 tool/apply_illumination_response_fusion_v1.py

      - name: Harden torch error handling
        run: python3 tool/harden_illumination_torch_unlock.py

      - name: Fix V1 test imports
        run: python3 tool/fix_v1_test_imports.py

      - name: Format
        run: dart format lib/hcv_illumination_response_probe.dart lib/hcv_physical_display_fusion.dart lib/camera_page.dart test/illumination_response_probe_math_test.dart test/physical_display_fusion_v1_test.dart test/native_illumination_response_contract_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focused physical probe tests
        run: >-
          flutter test
          test/illumination_response_probe_math_test.dart
          test/physical_display_fusion_v1_test.dart
          test/native_illumination_response_contract_test.dart
          test/native_temporal_frequency_v2_hfr_range_contract_test.dart
          test/native_temporal_frequency_focus_handoff_contract_test.dart
          test/camera_focus_recovery_after_native_probe_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Compile iOS device without signing
        run: flutter build ios --release --no-codesign

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_illumination_response_fusion_v1.py
          rm -f tool/harden_illumination_torch_unlock.py
          rm -f tool/fix_v1_test_imports.py
          rm -f .github/workflows/illumination-response-fusion-v1-validation.yml
          git config user.name 'SIGILLUM CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/Runner/AppDelegate.swift lib/camera_page.dart lib/hcv_illumination_response_probe.dart lib/hcv_physical_display_fusion.dart
          git add test/illumination_response_probe_math_test.dart test/physical_display_fusion_v1_test.dart test/native_illumination_response_contract_test.dart
          git add -u tool/apply_illumination_response_fusion_v1.py tool/harden_illumination_torch_unlock.py tool/fix_v1_test_imports.py .github/workflows/illumination-response-fusion-v1-validation.yml
          if git diff --cached --quiet; then
            echo 'No materialized changes'
            exit 1
          fi
          git commit -m 'Add illumination response guard and HFR rescue'
          git push origin HEAD:feature/illumination-response-fusion-v1
