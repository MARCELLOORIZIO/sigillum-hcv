name: Apply bounded weak-semantic display resolution

on:
  push:
    branches:
      - fix/weak-semantic-no-physical-display-resolution-20260911
    paths:
      - tools/apply_weak_semantic_no_physical_resolution.py
      - .github/workflows/apply-weak-semantic-no-physical-resolution.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/weak-semantic-no-physical-display-resolution-20260911
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply bounded decision patch
        run: python3 tools/apply_weak_semantic_no_physical_resolution.py

      - name: Format changed Dart files
        run: dart format lib/hcv_display_risk_fusion.dart lib/camera_page.dart test/weak_semantic_no_physical_resolution_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run full regression suite
        run: flutter test

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SIGILLUM CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/hcv_display_risk_fusion.dart lib/camera_page.dart test/weak_semantic_no_physical_resolution_test.dart
          git diff --cached --check
          git commit -m "fix: resolve weak semantic display ambiguity with negative physical evidence"
          git push origin HEAD:fix/weak-semantic-no-physical-display-resolution-20260911
