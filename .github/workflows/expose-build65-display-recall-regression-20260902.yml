name: Validate Build65 Phase C Fix

on:
  push:
    branches:
      - phase-c-build65-spatial-multiframe-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Materialize formatting
        run: |
          dart format lib/hcv_display_risk_fusion.dart test/build65_display_recall_regression_test.dart test/phase_c_48_case_promotion_matrix_test.dart
          if ! git diff --quiet -- lib/hcv_display_risk_fusion.dart test/build65_display_recall_regression_test.dart test/phase_c_48_case_promotion_matrix_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/hcv_display_risk_fusion.dart test/build65_display_recall_regression_test.dart test/phase_c_48_case_promotion_matrix_test.dart
            git commit -m "style: materialize tested Build65 Phase C formatting [skip ci]"
            git push
          fi
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/hcv_display_risk_fusion.dart test/build65_display_recall_regression_test.dart test/phase_c_48_case_promotion_matrix_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Build65 and 48-case policy regressions
        run: |
          flutter test test/build65_display_recall_regression_test.dart --reporter expanded
          flutter test test/phase_c_48_case_promotion_matrix_test.dart --reporter expanded
      - name: Run Phase C regression matrix
        run: |
          flutter test test/phase_c_ml_geometry_persistence_regression_test.dart --reporter expanded
          flutter test test/photo_display_risk_policy_test.dart --reporter expanded
          flutter test test/photo_pre_capture_only_contract_test.dart --reporter expanded
          flutter test test/archive42_reality_active_probe_regression_test.dart --reporter expanded
          flutter test test/current_device_monitor_recall_regression_test.dart --reporter expanded
          flutter test test/reality_temporal_false_positive_regression_test.dart --reporter expanded
          flutter test test/hcv_display_risk_fusion_test.dart --reporter expanded
          flutter test test/hcv_display_risk_conflict_regression_test.dart --reporter expanded
          flutter test test/monitor_corroboration_policy_test.dart --reporter expanded
          flutter test test/mixed_scene_monitor_regression_test.dart --reporter expanded
          flutter test test/display_signature_matrix_test.dart --reporter expanded
      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded
