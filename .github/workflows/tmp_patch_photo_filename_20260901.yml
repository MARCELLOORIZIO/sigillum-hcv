name: Temporary photo filename patch

on:
  push:
    branches:
      - fix/robust-photo-hcv-ocr-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve original photo names
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('ios/Runner/SceneDelegate.swift')
          text = path.read_text()

          old_picker = '''      let rawExtension = source.pathExtension
      let fileExtension = rawExtension.isEmpty ? "jpg" : rawExtension
      let output = FileManager.default.temporaryDirectory.appendingPathComponent(
        "hcv_picker_\\(UUID().uuidString).\\(fileExtension)"
      )
'''
          new_picker = '''      let rawExtension = source.pathExtension
      let fileExtension = rawExtension.isEmpty ? "jpg" : rawExtension
      let suggestedLeaf = provider.suggestedName.map {
        URL(fileURLWithPath: $0).lastPathComponent
      }?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
      let suggestedExtension = URL(fileURLWithPath: suggestedLeaf).pathExtension
      let preservedName: String
      if suggestedLeaf.isEmpty {
        preservedName = "hcv_picker_\\(UUID().uuidString).\\(fileExtension)"
      } else if suggestedExtension.isEmpty {
        preservedName = "hcv_picker_\\(UUID().uuidString)_\\(suggestedLeaf).\\(fileExtension)"
      } else {
        preservedName = "hcv_picker_\\(UUID().uuidString)_\\(suggestedLeaf)"
      }
      let output = FileManager.default.temporaryDirectory.appendingPathComponent(
        preservedName
      )
'''

          old_original = '''    let rawExtension = URL(fileURLWithPath: resource.originalFilename).pathExtension
    let fileExtension = rawExtension.isEmpty ? "jpg" : rawExtension
    let output = FileManager.default.temporaryDirectory.appendingPathComponent(
      "hcv_original_\\(UUID().uuidString).\\(fileExtension)"
    )
'''
          new_original = '''    let originalLeaf = URL(fileURLWithPath: resource.originalFilename).lastPathComponent
    let rawExtension = URL(fileURLWithPath: originalLeaf).pathExtension
    let fileExtension = rawExtension.isEmpty ? "jpg" : rawExtension
    let preservedName = originalLeaf.isEmpty
      ? "hcv_original_\\(UUID().uuidString).\\(fileExtension)"
      : "hcv_original_\\(UUID().uuidString)_\\(originalLeaf)"
    let output = FileManager.default.temporaryDirectory.appendingPathComponent(
      preservedName
    )
'''

          if old_picker not in text:
            raise SystemExit('PHPicker filename block not found')
          if old_original not in text:
            raise SystemExit('PhotoKit filename block not found')

          text = text.replace(old_picker, new_picker, 1)
          text = text.replace(old_original, new_original, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/SceneDelegate.swift
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve HCV photo filename on iOS"
          git push
