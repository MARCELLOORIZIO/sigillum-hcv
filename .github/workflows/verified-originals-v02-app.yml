name: Verified Originals v0.2 app
on:
  push:
    branches:
      - feature/verified-originals-v02-trusted-20260924
  pull_request:
    paths:
      - 'lib/verified_originals_*.dart'
      - 'test/verified_originals_*.dart'
      - 'test/build133_live_reference_and_recovery_contract_test.dart'
      - 'test/build143_authorized_subtitle_derivation_contract_test.dart'
      - 'test/build144_prelaunch_hardening_test.dart'
      - 'test/build145_social_verification_recovery_test.dart'
      - 'test/reference_visual_fingerprint_v3_test.dart'
      - 'test/quick_hcv_media_gate_contract_test.dart'
      - 'lib/hcv_reference_visual_fingerprint_v3.dart'
      - 'lib/quick_hcv_media_gate_page.dart'
      - 'lib/text_social_verify_page.dart'
      - 'lib/text_cert_page.dart'
      - 'lib/hcvpack_player_page.dart'
      - 'pubspec.yaml'
      - 'lib/registry_verify_page.dart'
      - 'lib/registry_verify_copy.dart'
      - 'lib/manual_reference_compare_page.dart'
      - 'lib/camera_page.dart'
      - 'lib/hcv_secure_media_vault.dart'
      - 'lib/secure_originals_page.dart'
      - 'lib/hcv_audio_fingerprint.dart'
      - 'lib/home_page.dart'
      - 'lib/user_home_page.dart'
      - 'lib/commercial_gate.dart'
      - '.github/workflows/verified-originals-v02-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
      - run: flutter pub get
      - run: dart format lib/verified_originals_reference.dart lib/verified_originals_page.dart lib/verified_originals_consent_page.dart lib/verified_originals_publish_service.dart lib/registry_verify_page.dart lib/registry_verify_copy.dart lib/manual_reference_compare_page.dart lib/camera_page.dart lib/hcv_secure_media_vault.dart lib/secure_originals_page.dart lib/hcv_audio_fingerprint.dart lib/text_social_verify_page.dart lib/text_cert_page.dart lib/hcvpack_player_page.dart test/verified_originals_reference_test.dart test/verified_originals_v2_contract_test.dart test/build133_live_reference_and_recovery_contract_test.dart test/build143_authorized_subtitle_derivation_contract_test.dart test/build144_prelaunch_hardening_test.dart test/build145_social_verification_recovery_test.dart test/reference_visual_fingerprint_v3_test.dart test/quick_hcv_media_gate_contract_test.dart
      - run: git diff --exit-code -- lib/verified_originals_reference.dart lib/verified_originals_page.dart lib/verified_originals_consent_page.dart lib/verified_originals_publish_service.dart lib/registry_verify_page.dart lib/registry_verify_copy.dart lib/manual_reference_compare_page.dart lib/camera_page.dart lib/hcv_secure_media_vault.dart lib/secure_originals_page.dart lib/hcv_audio_fingerprint.dart lib/text_social_verify_page.dart lib/text_cert_page.dart lib/hcvpack_player_page.dart test/verified_originals_reference_test.dart test/verified_originals_v2_contract_test.dart test/build133_live_reference_and_recovery_contract_test.dart test/build143_authorized_subtitle_derivation_contract_test.dart test/build144_prelaunch_hardening_test.dart test/build145_social_verification_recovery_test.dart test/reference_visual_fingerprint_v3_test.dart test/quick_hcv_media_gate_contract_test.dart
      - run: flutter test --reporter expanded
      - run: python3 tool/verify_postpatch_release_20260825.py
      - run: git diff --exit-code -- lib test ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
