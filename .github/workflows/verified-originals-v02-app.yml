name: Verified Originals v0.2 app
on:
  push:
    branches:
      - feature/verified-originals-v02-trusted-20260924
      - release/testflight-final-20260827
      - fix/video-geometry-ml-conflict-20261009
  pull_request:
    paths:
      - 'lib/verified_originals_*.dart'
      - 'test/verified_originals_*.dart'
      - 'test/build133_live_reference_and_recovery_contract_test.dart'
      - 'test/build143_authorized_subtitle_derivation_contract_test.dart'
      - 'test/build144_prelaunch_hardening_test.dart'
      - 'test/build145_social_verification_recovery_test.dart'
      - 'test/build146_text_verification_entry_test.dart'
      - 'test/build147_gps_photo_integrity_test.dart'
      - 'test/photo_detail_compare_v4_test.dart'
      - 'test/capture_location_contract_test.dart'
      - 'lib/hcv_photo_detail_compare.dart'
      - 'lib/hcv_capture_location.dart'
      - 'lib/camera_ui_extended_copy.dart'
      - 'lib/import_page.dart'
      - 'test/reference_visual_fingerprint_v3_test.dart'
      - 'test/quick_hcv_media_gate_contract_test.dart'
      - 'lib/hcv_reference_visual_fingerprint_v3.dart'
      - 'lib/quick_hcv_media_gate_page.dart'
      - 'lib/text_social_verify_page.dart'
      - 'lib/text_cert_page.dart'
      - 'lib/hcvpack_player_page.dart'
      - 'pubspec.yaml'
      - 'lib/registry_verify_page.dart'
      - 'lib/registry_verify_copy.dart'
      - 'lib/manual_reference_compare_page.dart'
      - 'lib/camera_page.dart'
      - 'lib/hcv_secure_media_vault.dart'
      - 'lib/secure_originals_page.dart'
      - 'lib/hcv_audio_fingerprint.dart'
      - 'lib/home_page.dart'
      - 'lib/user_home_page.dart'
      - 'lib/commercial_gate.dart'
      - '.github/workflows/verified-originals-v02-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
      - run: flutter pub get
      - name: Parse-check changed Dart sources
        run: |
          dart format --output=none             lib/hcv_multi_evidence_display_policy.dart             lib/camera_page.dart             lib/registry_verify_page.dart             lib/registry_verify_copy.dart             lib/verified_originals_publish_service.dart             lib/secure_originals_page.dart             lib/commercial_gate.dart             lib/sigillum_localization.dart             test/photo_hfr_partial_conflict_guard_test.dart             test/verification_color_semantics_test.dart             test/save_original_reference_first_test.dart             test/storekit_user_safe_error_copy_test.dart             test/free_photo_reference_verification_contract_test.dart
      - run: flutter test test/verified_originals_reference_test.dart test/verified_originals_v2_contract_test.dart test/build133_live_reference_and_recovery_contract_test.dart test/build143_authorized_subtitle_derivation_contract_test.dart test/build144_prelaunch_hardening_test.dart test/build145_social_verification_recovery_test.dart test/build146_text_verification_entry_test.dart test/build147_gps_photo_integrity_test.dart test/photo_detail_compare_v4_test.dart test/capture_location_contract_test.dart test/reference_visual_fingerprint_v3_test.dart test/quick_hcv_media_gate_contract_test.dart --reporter expanded
      - run: flutter test --reporter expanded
      - run: bash tool/pin_tflite_ios_runtime_20260826.sh
      - run: python3 tool/verify_postpatch_release_20260825.py
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
