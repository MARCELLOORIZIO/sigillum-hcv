name: Validate Reality Crossmodal Fix

on:
  push:
    branches:
      - phase-c-reality-crossmodal-fix-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Materialize narrow cross-modal REALITY fix
        run: python3 tool/materialize_reality_crossmodal_fix_20260902.py
      - name: Format touched Dart files
        run: dart format lib/hcv_display_risk_fusion.dart test/phase_c_reality_crossmodal_regression_20260902_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run new reality regressions
        run: flutter test test/phase_c_reality_crossmodal_regression_20260902_test.dart --reporter expanded
      - name: Run critical Phase C regressions
        run: |
          flutter test test/build66_planar_multiframe_regression_test.dart --reporter expanded
          flutter test test/phase_c_ml_geometry_persistence_regression_test.dart --reporter expanded
          flutter test test/archive42_reality_active_probe_regression_test.dart --reporter expanded
      - name: Run full regression suite
        run: flutter test --reporter expanded
      - name: Commit materialized runtime fix
        if: success()
        run: |
          if ! git diff --quiet -- lib/hcv_display_risk_fusion.dart test/phase_c_reality_crossmodal_regression_20260902_test.dart; then
            git config user.name "MARCELLOORIZIO"
            git config user.email "MARCELLOORIZIO@YAHOO.IT"
            git add lib/hcv_display_risk_fusion.dart test/phase_c_reality_crossmodal_regression_20260902_test.dart
            git commit -m "fix: resolve cross-modal REALITY regressions"
            git push
          fi
