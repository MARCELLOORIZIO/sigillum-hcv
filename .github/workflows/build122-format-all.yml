name: BUILD122 format all

on:
  pull_request:
    branches:
      - fix/build121-unified-photo-scene-context-20260918

permissions:
  contents: write

jobs:
  dart-format-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout BUILD122 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Format BUILD122 files
        run: |
          dart format             lib/hcv_temporal_frequency_probe.dart             lib/hcv_ml_screen_replay_classifier.dart             lib/hcv_display_risk_fusion.dart             lib/hcv_scene_context_evidence.dart             lib/hcv_display_final_policy.dart             test/build122_corpus_wide_recovery_test.dart
          if git diff --quiet --             lib/hcv_temporal_frequency_probe.dart             lib/hcv_ml_screen_replay_classifier.dart             lib/hcv_display_risk_fusion.dart             lib/hcv_scene_context_evidence.dart             lib/hcv_display_final_policy.dart             test/build122_corpus_wide_recovery_test.dart; then
            echo "BUILD122_FORMAT_ALREADY_CLEAN=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/hcv_temporal_frequency_probe.dart             lib/hcv_ml_screen_replay_classifier.dart             lib/hcv_display_risk_fusion.dart             lib/hcv_scene_context_evidence.dart             lib/hcv_display_final_policy.dart             test/build122_corpus_wide_recovery_test.dart
          git commit -m "BUILD122 apply Dart formatter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
