name: Materialize SIGILLUM auth secure storage

on:
  push:
    paths:
      - '.github/workflows/materialize-auth-secure-storage.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/reality-monitor-geometry-20260725
          fetch-depth: 0

      - name: Apply native secure storage
        run: python3 tool/materialize_auth_secure_storage.py

      - name: Commit native sources
        run: |
          git config user.name 'SIGILLUM Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/Runner/SceneDelegate.swift android/app/src/main/kotlin/com/example/hcv_app/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'Native secure storage already materialized'
          else
            git commit -m 'Store SIGILLUM account sessions in native secure storage'
            git push origin HEAD:fix/reality-monitor-geometry-20260725
          fi
