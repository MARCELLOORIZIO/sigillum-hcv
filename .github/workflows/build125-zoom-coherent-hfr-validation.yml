name: BUILD125 final FOV comparability validation
# BUILD125 final validation trigger
# isolated CI base active

on:
  push:
    branches:
      - fix/build125-final-fov-comparability-20260921
  pull_request:
    branches:
      - fix/build124-multi-evidence-display-fusion-20260920
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build125-final-fov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BUILD125 candidate
        uses: actions/checkout@v4
      - name: Set up validated Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify BUILD125 formatting
        run: |
          dart format \
            lib/camera_page.dart \
            lib/hcv_temporal_frequency_probe.dart \
            lib/hcv_multi_evidence_display_policy.dart \
            test/build124_multi_evidence_display_policy_test.dart \
            test/build125_zoom_coherent_hfr_test.dart \
            test/build125_fov_comparability_guard_test.dart
          git diff --exit-code
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test --reporter expanded

  ios-unsigned-release:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - name: Checkout BUILD125 candidate
        uses: actions/checkout@v4
      - name: Set up validated Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Pin validated TensorFlow Lite iOS runtime
        run: bash tool/pin_tflite_ios_runtime_20260826.sh
      - name: Resolve CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS Release
        run: flutter build ios --release --no-codesign --no-pub --dart-define=SIGILLUM_EDITION=user --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com --dart-define=GIT_COMMIT="$GITHUB_SHA"
      - name: Verify built app
        run: |
          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'
          echo 'BUILD125_IOS_UNSIGNED_RELEASE=PASS'
