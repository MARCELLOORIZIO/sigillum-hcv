name: TEMP BUILD113 audio fingerprint validation

on:
  push:
    branches:
      - fix/build113-audio-fingerprint-20260915

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: fix/build113-audio-fingerprint-20260915
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply BUILD113 audio fingerprint patch
        run: |
          python3 .github/scripts/build113_audio_fingerprint_patch.py
          python3 - <<'PY'
          from pathlib import Path

          audio = Path('lib/hcv_audio_fingerprint.dart')
          source = audio.read_text(encoding='utf-8')
          source = source.replace(
              "final samples = <int>[];\n      samples.length = bytes.length ~/ 2;",
              "final samples = List<int>.filled(bytes.length ~/ 2, 0);",
          )
          source = source.replace(
              "features.add(((correlation + 1.0) * 127.5).round().clamp(0, 255));",
              "features.add(((correlation + 1.0) * 127.5).round().clamp(0, 255).toInt());",
          )
          source = source.replace(
              "features.add((((delta + 2.0) / 4.0) * 255.0).round().clamp(0, 255));",
              "features.add((((delta + 2.0) / 4.0) * 255.0).round().clamp(0, 255).toInt());",
          )
          audio.write_text(source, encoding='utf-8')

          test = Path('test/build113_audio_fingerprint_test.dart')
          source = test.read_text(encoding='utf-8')
          source = source.replace(
              "samples.add((value * 12000).round().clamp(-32768, 32767));",
              "samples.add((value * 12000).round().clamp(-32768, 32767).toInt());",
          )
          source = source.replace(
              ").clamp(-32768, 32767);",
              ").clamp(-32768, 32767).toInt();",
          )
          test.write_text(source, encoding='utf-8')
          PY

      - name: Diff guard
        run: |
          git diff --check
          git status --short
          CHANGED="$(git status --porcelain | awk '{print $2}' | sort)"
          EXPECTED=$'lib/hcv_audio_fingerprint.dart\nlib/hcv_social_fingerprint.dart\nlib/registry_verify_page.dart\ntest/build113_audio_fingerprint_test.dart'
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: BUILD113 focused audio fingerprint regression
        run: flutter test test/build113_audio_fingerprint_test.dart

      - name: BUILD112 social fail-closed regression
        run: flutter test test/build112_social_fingerprint_failclosed_test.dart

      - name: Registry verification regressions
        run: flutter test test/registry_verify_hcv_id16_contract_test.dart test/registry_display_risk_claims_test.dart test/hcv_media_id_ocr_test.dart test/quick_hcv_media_gate_contract_test.dart test/rc2_photo_integrity_contract_test.dart

      - name: Registry provenance regression
        run: flutter test test/hcv_registry_provenance_gate_contract_test.dart

      - name: HCVPACK integrity gate
        run: flutter test test/hcvpack_integrity_release_gate_test.dart

      - name: BUILD112 A6 and BUILD111 monitor regressions
        run: flutter test test/build112_photo_optical_corroboration_test.dart test/build111_photo_monitor_regression_test.dart

      - name: Full Flutter suite
        run: flutter test

      - name: Commit tested candidate
        run: |
          git add lib/hcv_audio_fingerprint.dart lib/hcv_social_fingerprint.dart lib/registry_verify_page.dart test/build113_audio_fingerprint_test.dart
          git commit -m "feat(build113): add recompression-tolerant audio fingerprint [skip ci]"
          git push origin HEAD:fix/build113-audio-fingerprint-20260915
