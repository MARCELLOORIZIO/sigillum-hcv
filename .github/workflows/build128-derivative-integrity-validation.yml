name: BUILD128 derivative integrity validation

on:
  push:
    branches:
      - fix/build128-derivative-integrity-v2-20260923
  pull_request:
    branches:
      - fix/build127-ml-hard-negatives-20260921
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build128-derivative-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format BUILD128 sources
        run: |
          dart format lib/hcv_spatial_fingerprint_v2.dart lib/hcv_social_fingerprint.dart lib/registry_verify_page.dart lib/registry_verify_copy.dart test/build128_derivative_integrity_spatial_v2_test.dart
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git add lib/hcv_spatial_fingerprint_v2.dart lib/hcv_social_fingerprint.dart lib/registry_verify_page.dart lib/registry_verify_copy.dart test/build128_derivative_integrity_spatial_v2_test.dart
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "BUILD128: apply dart format to derivative integrity sources"
              git push
            fi
          fi
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test --reporter expanded
