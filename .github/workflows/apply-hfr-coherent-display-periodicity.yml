name: Apply HFR coherent display periodicity fix

on:
  push:
    branches:
      - fix/hfr-coherent-display-periodicity-20260910
    paths:
      - .github/workflows/apply-hfr-coherent-display-periodicity.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/hfr-coherent-display-periodicity-20260910
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused HFR decision patch
        run: python3 tools/apply_hfr_coherent_display_periodicity.py

      - name: Format changed Dart files
        run: dart format lib/hcv_temporal_frequency_probe.dart lib/camera_page.dart test/hfr_coherent_display_periodicity_gate_test.dart test/hfr_coherent_display_periodicity_integration_contract_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test full suite
        run: flutter test

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "SIGILLUM CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/hcv_temporal_frequency_probe.dart lib/camera_page.dart test/hfr_coherent_display_periodicity_gate_test.dart test/hfr_coherent_display_periodicity_integration_contract_test.dart
          git diff --cached --check
          git commit -m "fix: detect full-frame display recapture from coherent HFR periodicity"
          git push origin HEAD:fix/hfr-coherent-display-periodicity-20260910
