name: Apply HFR coherent display periodicity fix

on:
  push:
    branches:
      - fix/hfr-coherent-display-periodicity-20260910
    paths:
      - .github/workflows/apply-hfr-coherent-display-periodicity.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/hfr-coherent-display-periodicity-20260910
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused HFR decision patch
        shell: bash
        run: |
          python3 tools/apply_hfr_coherent_display_periodicity.py
          sed -i "s#import 'package:sigillum_hcv/hcv_temporal_frequency_probe.dart';#import 'package:sigillum_iphone/hcv_temporal_frequency_probe.dart';#" test/hfr_coherent_display_periodicity_gate_test.dart
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('test/frequency_probe_session_safety_contract_test.dart'),
              Path('test/temporal_frequency_probe_contract_test.dart'),
              Path('test/native_temporal_frequency_v2_contract_test.dart'),
          ]
          role = 'DECISIONAL_ONLY_FOR_STRICT_HFR_COHERENT_DISPLAY_PERIODICITY'
          for path in files:
              text = path.read_text()
              text = text.replace('SHADOW_ONLY_NEVER_DECISIONAL', role)
              text = text.replace('frequency probe remains shadow-only', 'frequency probe is decisional only under the strict coherent HFR gate')
              text = text.replace('probe contract is explicitly shadow-only and non-decisional', 'probe contract exposes the strict coherent HFR decision role')
              text = text.replace('V2 probe is native, consecutive and permanently shadow-only', 'V2 probe is native, consecutive and decision-limited to strict coherent HFR periodicity')
              if path.name == 'frequency_probe_session_safety_contract_test.dart':
                  old = f'''expect(source, contains("'decisionRole': '{role}'"));'''
                  new = f'''expect(source, contains('{role}'));'''
                  if old not in text:
                      raise SystemExit('Missing formatting-sensitive decisionRole assertion')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Format changed Dart files
        run: dart format lib/hcv_temporal_frequency_probe.dart test/hfr_coherent_display_periodicity_gate_test.dart test/hfr_coherent_display_periodicity_integration_contract_test.dart test/frequency_probe_session_safety_contract_test.dart test/temporal_frequency_probe_contract_test.dart test/native_temporal_frequency_v2_contract_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test full suite
        run: flutter test

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "SIGILLUM CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/hcv_temporal_frequency_probe.dart lib/camera_page.dart test/hfr_coherent_display_periodicity_gate_test.dart test/hfr_coherent_display_periodicity_integration_contract_test.dart test/frequency_probe_session_safety_contract_test.dart test/temporal_frequency_probe_contract_test.dart test/native_temporal_frequency_v2_contract_test.dart
          git diff --cached --check
          git commit -m "fix: detect full-frame display recapture from coherent HFR periodicity"
          git push origin HEAD:fix/hfr-coherent-display-periodicity-20260910
