name: BUILD123 temporary autoformat

on:
  pull_request:
    branches:
      - fix/build122-corpus-wide-display-recovery-20260919

permissions:
  contents: write

jobs:
  dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Apply official Dart formatter
        run: |
          dart format lib/hcv_context_free_display_policy.dart lib/camera_page.dart test/build123_context_free_corpus_test.dart
          if git diff --quiet -- lib/hcv_context_free_display_policy.dart lib/camera_page.dart test/build123_context_free_corpus_test.dart; then
            echo BUILD123_FORMAT_ALREADY_CLEAN=PASS
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/hcv_context_free_display_policy.dart lib/camera_page.dart test/build123_context_free_corpus_test.dart
          git commit -m "BUILD123 apply official Dart formatter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
