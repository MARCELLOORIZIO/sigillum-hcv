name: Temporary BUILD109 Monitor Photo Fix

on:
  push:
    branches:
      - fix/build109-monitor-photo-security-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact BUILD109 fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Layer verified security changes and monitor-photo regression fix
        run: |
          set -euo pipefail
          if [ ! -f test/hcv_software_attestation_verifier_test.dart ]; then
            git cherry-pick e99640a0b52e1ecd703c9711d0e6fccaf8cd00f1
          fi
          if [ ! -f test/hcvpack_integrity_release_gate_test.dart ]; then
            git cherry-pick 52d4cf3ddcbd4e01d406050e5eb17cda2bdfc6e6
            git cherry-pick 5cf665118ce6102902feef4a4516fa05667dda45
            git cherry-pick 5f9c102d126fe756f3069320be4c025e519b05d2
          fi
          if [ ! -f test/build110_monitor_photo_regression_test.dart ]; then
            python3 - <<'PY'
          from pathlib import Path

          fusion_path = Path('lib/hcv_display_risk_fusion.dart')
          text = fusion_path.read_text()

          old = """    final videoPhotoSpatialFullFrameCorroboration =
              v3Analyzed &&
              !mixedScene &&
              !physicalDisplay &&
              temporalFrames >= 3 &&
              _hasStableVideoPhotoSpatialFullFrameCorroboration(temporalMl) &&
              base.decision == 'STRONG_DISPLAY_RISK' &&
              base.reasons.contains(
                'ML_FIRST_VIDEO_SCREEN_MAJORITY_HIGH_PROBABILITY',
              ) &&
              base.reasons.contains('ML_FIRST_VIDEO_FRAME_DIAGNOSTIC_CORROBORATION');

          """
          new = old + """    // BUILD110 regression guard: a final still photo that is independently
              // strong/full-frame SCREEN evidence may corroborate three temporally stable
              // full-frame SCREEN frames even when the temporal content-area crop stays
              // below the generic 85 threshold. This is deliberately photo-only and does
              // not lower any global threshold or override the mixed-scene HFR veto.
              final photoStillTemporalFullFrameCorroboration =
                  photoTemporalMl != null &&
                  v3Analyzed &&
                  !mixedScene &&
                  !physicalDisplay &&
                  temporalFrames == 3 &&
                  highAnyScreenFrames == 3 &&
                  highFullFrameScreenFrames == 0 &&
                  _hasExactlyThreeStrongFullFrameScreenSemanticFramesForPhoto(
                    temporalMl,
                  ) &&
                  _isStrongStillPhotoFullFrameScreen(ml) &&
                  mlStrongScreenFrames == 3 &&
                  mlAverageScreenRisk >= 90.0 &&
                  base.decision == 'STRONG_DISPLAY_RISK' &&
                  base.reasons.contains(
                    'ML_FIRST_VIDEO_SCREEN_MAJORITY_HIGH_PROBABILITY',
                  ) &&
                  base.reasons.contains(
                    'ML_FIRST_VIDEO_FRAME_DIAGNOSTIC_CORROBORATION',
                  );

          """
          if old not in text:
              raise SystemExit('Expected videoPhotoSpatial corroboration block not found')
          text = text.replace(old, new, 1)

          old = """        !narrowThreeFrameFullFrameRecoveryV109 &&
              !videoPhotoSpatialFullFrameCorroboration &&
              temporalFrames >= 2 &&
          """
          new = """        !narrowThreeFrameFullFrameRecoveryV109 &&
              !videoPhotoSpatialFullFrameCorroboration &&
              !photoStillTemporalFullFrameCorroboration &&
              temporalFrames >= 2 &&
          """
          if old not in text:
              raise SystemExit('Expected screenPresentButNotFullFrame guard not found')
          text = text.replace(old, new, 1)

          old = """    final persistentVisualDisplay =
              strictPersistentVisualDisplay ||
              narrowThreeFrameFullFrameRecoveryV109 ||
              videoPhotoSpatialFullFrameCorroboration;
          """
          new = """    final persistentVisualDisplay =
              strictPersistentVisualDisplay ||
              narrowThreeFrameFullFrameRecoveryV109 ||
              videoPhotoSpatialFullFrameCorroboration ||
              photoStillTemporalFullFrameCorroboration;
          """
          if old not in text:
              raise SystemExit('Expected persistentVisualDisplay block not found')
          text = text.replace(old, new, 1)

          old = """        if (videoPhotoSpatialFullFrameCorroboration) {
                    evidenceSources.add('VIDEO_PHOTO_SPATIAL_CORROBORATION');
                    strongSources.add('VIDEO_PHOTO_SPATIAL_CORROBORATION');
                    reasons.add('VIDEO_PHOTO_SPATIAL_STABLE_SCREEN_SEQUENCE');
                    reasons.add('VIDEO_PHOTO_SPATIAL_FULL_FRAME_CORROBORATION');
                  }
          """
          new = old + """        if (photoStillTemporalFullFrameCorroboration) {
                    evidenceSources.add('PHOTO_STILL_TEMPORAL_SCREEN_CORROBORATION');
                    strongSources.add('PHOTO_STILL_TEMPORAL_SCREEN_CORROBORATION');
                    reasons.add('STRONG_STILL_PHOTO_FULL_FRAME_SCREEN');
                    reasons.add('THREE_STRONG_FULL_FRAME_SCREEN_TEMPORAL_FRAMES');
                    reasons.add('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION');
                  }
          """
          if old not in text:
              raise SystemExit('Expected videoPhotoSpatial reasons block not found')
          text = text.replace(old, new, 1)

          marker = """  static bool _hasStableVideoPhotoSpatialFullFrameCorroboration(
          """
          helper = """  static bool _hasExactlyThreeStrongFullFrameScreenSemanticFramesForPhoto(
              Map<String, dynamic>? ml,
            ) {
              if (ml == null || ml['analysisStatus'] == 'NOT_ANALYZED') return false;
              final framesAnalyzed = (ml['framesAnalyzed'] as num?)?.toInt() ?? 0;
              final rawFrames = ml['videoFrameAnalyses'];
              if (framesAnalyzed != 3 || rawFrames is! List || rawFrames.length != 3) {
                return false;
              }
              return rawFrames.every((rawFrame) {
                if (rawFrame is! Map) return false;
                final predictedClass = rawFrame['predictedClass']?.toString() ?? '';
                final probability =
                    (rawFrame['screenProbability'] as num?)?.toDouble() ?? 0.0;
                final rawSignals = rawFrame['signals'];
                if (rawSignals is! Map) return false;
                final signals = Map<String, dynamic>.from(rawSignals);
                final fullFrame =
                    (signals['fullFrameRiskScore'] as num?)?.toInt() ?? 0;
                return predictedClass.startsWith('SCREEN_') &&
                    probability >= 0.90 &&
                    fullFrame >= 90;
              });
            }

            static bool _isStrongStillPhotoFullFrameScreen(Map<String, dynamic>? ml) {
              if (ml == null || ml['analysisStatus'] == 'NOT_ANALYZED') return false;
              final predictedClass = ml['predictedClass']?.toString() ?? '';
              final framesAnalyzed = (ml['framesAnalyzed'] as num?)?.toInt() ?? 0;
              final score = (ml['screenReplayRiskScore'] as num?)?.toInt() ?? 0;
              final probability =
                  (ml['screenProbability'] as num?)?.toDouble() ?? 0.0;
              final confidence =
                  (ml['predictedClassConfidence'] as num?)?.toDouble() ?? 0.0;
              final signals = _signals(ml);
              final fullFrame =
                  (signals['fullFrameRiskScore'] as num?)?.toInt() ?? 0;
              final contentArea =
                  (signals['contentAreaRiskScore'] as num?)?.toInt() ?? 0;
              return predictedClass.startsWith('SCREEN_') &&
                  framesAnalyzed == 1 &&
                  score >= 92 &&
                  probability >= 0.92 &&
                  fullFrame >= 90 &&
                  contentArea >= 85 &&
                  (confidence == 0.0 || confidence >= 0.75);
            }

          """
          if marker not in text:
              raise SystemExit('Expected spatial helper marker not found')
          text = text.replace(marker, helper + marker, 1)
          fusion_path.write_text(text)

          test = r'''import 'package:flutter_test/flutter_test.dart';
          import 'package:sigillum_iphone/hcv_display_risk_fusion.dart';

          Map<String, dynamic> _opticalClean() => <String, dynamic>{
            'analysisStatus': 'ANALYZED',
            'framesAnalyzed': 15,
            'screenReplayRiskScore': 20,
            'signals': <String, dynamic>{
              'displayFlicker': false,
              'pixelGridOrMoireHint': false,
              'uniformPixelGrid': false,
              'localRefreshFlicker': false,
              'horizontalRefreshBands': false,
              'pairedLocalRefresh': false,
              'temporalScreenPulse': false,
              'structuralDisplayTrace': false,
              'strongDisplayTrace': false,
              'confirmedDisplayTrace': false,
              'periodicLightTrace': false,
              'opticalCorroboratedTrace': false,
            },
          };

          Map<String, dynamic> _quietV32({bool mixed = false}) => <String, dynamic>{
            'type': 'SIGILLUM_TEMPORAL_FREQUENCY_PROBE_V3_2',
            'analysisStatus': 'ANALYZED',
            'coherentDisplayPeriodicity': false,
            'shortExposureVerified': true,
            'exposureLockedForEntireNativeCapture': true,
            'framesAnalyzed': 84,
            'actualFrameRateFromTimestamps': 240.62,
            'displayRealityEvidenceV3': <String, dynamic>{
              'fullFrameDisplay': false,
              'fullFrameReality': false,
              'positivePhysicalRealityEvidence': false,
              'mixedSceneDetected': mixed,
              'allNineCellsSameDisplayFamily': false,
              'displayLikeCellCount': mixed ? 4 : 0,
              'spatialFamilyCellCount': mixed ? 4 : 0,
              'harmonicAwareSpatialFamilyCellCount': mixed ? 4 : 0,
              'rowTimeFamilyCellCount': mixed ? 4 : 0,
            },
          };

          Map<String, dynamic> _still({
            required int score,
            required double probability,
            required int fullFrame,
            required int contentArea,
            String predictedClass = 'SCREEN_MONITOR',
          }) => <String, dynamic>{
            'type': 'SIGILLUM_SCREEN_REPLAY_ML_ANALYSIS_V1',
            'analysisStatus': 'ANALYZED',
            'scanMode': 'STILL_IMAGE_ML_CLASSIFIER',
            'framesAnalyzed': 1,
            'screenReplayRisk': score >= 90 ? 'HIGH' : 'LOW',
            'screenReplayRiskScore': score,
            'screenProbability': probability,
            'predictedClass': predictedClass,
            'predictedClassConfidence': probability,
            'signals': <String, dynamic>{
              'fullFrameRiskScore': fullFrame,
              'contentAreaRiskScore': contentArea,
            },
          };

          Map<String, dynamic> _temporal({
            required List<double> probabilities,
            required List<int> fullFrames,
            required List<int> contentAreas,
            List<String>? predictedClasses,
          }) {
            final scores = probabilities.map((value) => (value * 100).round()).toList();
            final strong = scores.where((score) => score >= 92).length;
            final medium = scores.where((score) => score >= 88).length;
            final average = scores.reduce((a, b) => a + b) / scores.length;
            final maxScore = scores.reduce((a, b) => a > b ? a : b);
            final classes = predictedClasses ??
                List<String>.filled(probabilities.length, 'SCREEN_MONITOR');
            return <String, dynamic>{
              'type': 'SIGILLUM_SCREEN_REPLAY_ML_ANALYSIS_V1',
              'analysisStatus': 'ANALYZED',
              'scanMode': 'VIDEO_MULTI_FRAME_ML_CLASSIFIER',
              'framesAnalyzed': probabilities.length,
              'screenReplayRiskScore': maxScore,
              'screenReplayRisk': 'HIGH',
              'predictedClass': 'SCREEN_MONITOR',
              'predictedClassConfidence': probabilities.reduce((a, b) => a > b ? a : b),
              'screenProbability': probabilities.reduce((a, b) => a > b ? a : b),
              'strongScreenFrameCount': strong,
              'mediumScreenFrameCount': medium,
              'averageScreenReplayRiskScore': average,
              'maxFrameScreenReplayRiskScore': maxScore,
              'signals': <String, dynamic>{
                'fullFrameRiskScore': fullFrames.reduce((a, b) => a > b ? a : b),
                'contentAreaRiskScore': contentAreas.reduce((a, b) => a > b ? a : b),
              },
              'videoFrameAnalyses': <Map<String, dynamic>>[
                for (var i = 0; i < probabilities.length; i++)
                  <String, dynamic>{
                    'analysisStatus': 'ANALYZED',
                    'videoFrameIndex': i,
                    'predictedClass': classes[i],
                    'predictedClassConfidence': probabilities[i],
                    'screenProbability': probabilities[i],
                    'screenReplayRiskScore': scores[i],
                    'signals': <String, dynamic>{
                      'fullFrameRiskScore': fullFrames[i],
                      'contentAreaRiskScore': contentAreas[i],
                    },
                  },
              ],
            };
          }

          HCVDisplayRiskResult _resolve({
            required Map<String, dynamic> still,
            required Map<String, dynamic> temporal,
            bool mixed = false,
          }) {
            final base = HCVDisplayRiskFusion.mlFirstVideoDecision(temporal);
            expect(base, isNotNull);
            expect(base!.decision, 'STRONG_DISPLAY_RISK');
            return HCVDisplayRiskFusion.resolveWeakSemanticOnlyWithNegativeHfr(
              base: base,
              passiveOptical: _opticalClean(),
              ml: still,
              photoTemporalMl: temporal,
              temporalFrequencyProbe: _quietV32(mixed: mixed),
            );
          }

          void main() {
            test('C546 BUILD110 monitor regression remains HIGH', () {
              final temporal = _temporal(
                probabilities: const <double>[0.954401, 0.951494, 0.922244],
                fullFrames: const <int>[95, 95, 92],
                contentAreas: const <int>[71, 79, 73],
              );
              final result = _resolve(
                still: _still(
                  score: 93,
                  probability: 0.932044,
                  fullFrame: 93,
                  contentArea: 87,
                ),
                temporal: temporal,
              );
              expect(result.decision, 'STRONG_DISPLAY_RISK');
              expect(result.risk, 'HIGH');
              expect(
                result.reasons,
                contains('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION'),
              );
              expect(
                result.reasons,
                isNot(contains('SCREEN_PRESENT_BUT_NOT_FULL_FRAME_REAL_SCENE')),
              );
            });

            test('F776 BUILD110 monitor regression remains HIGH', () {
              final temporal = _temporal(
                probabilities: const <double>[0.979805, 0.931175, 0.922176],
                fullFrames: const <int>[98, 93, 92],
                contentAreas: const <int>[75, 74, 73],
              );
              final result = _resolve(
                still: _still(
                  score: 97,
                  probability: 0.9732,
                  fullFrame: 97,
                  contentArea: 92,
                ),
                temporal: temporal,
              );
              expect(result.decision, 'STRONG_DISPLAY_RISK');
              expect(result.risk, 'HIGH');
              expect(
                result.reasons,
                contains('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION'),
              );
            });

            test('strong temporal monitor sequence cannot promote weak still-photo spatial evidence', () {
              final temporal = _temporal(
                probabilities: const <double>[0.954401, 0.951494, 0.922244],
                fullFrames: const <int>[95, 95, 92],
                contentAreas: const <int>[71, 79, 73],
              );
              final result = _resolve(
                still: _still(
                  score: 93,
                  probability: 0.932044,
                  fullFrame: 93,
                  contentArea: 84,
                ),
                temporal: temporal,
              );
              expect(result.decision, 'NO_DISPLAY_EVIDENCE');
              expect(
                result.reasons,
                contains('SCREEN_PRESENT_BUT_NOT_FULL_FRAME_REAL_SCENE'),
              );
              expect(
                result.reasons,
                isNot(contains('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION')),
              );
            });

            test('semantic transition cannot activate still-temporal corroboration', () {
              final temporal = _temporal(
                probabilities: const <double>[0.954401, 0.951494, 0.922244],
                fullFrames: const <int>[95, 95, 92],
                contentAreas: const <int>[71, 79, 73],
                predictedClasses: const <String>[
                  'SCREEN_MONITOR',
                  'REALITY_ROOM',
                  'SCREEN_MONITOR',
                ],
              );
              final result = _resolve(
                still: _still(
                  score: 93,
                  probability: 0.932044,
                  fullFrame: 93,
                  contentArea: 87,
                ),
                temporal: temporal,
              );
              expect(result.decision, 'NO_DISPLAY_EVIDENCE');
              expect(
                result.reasons,
                isNot(contains('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION')),
              );
            });

            test('mixed-scene HFR veto remains absolute', () {
              final temporal = _temporal(
                probabilities: const <double>[0.954401, 0.951494, 0.922244],
                fullFrames: const <int>[95, 95, 92],
                contentAreas: const <int>[71, 79, 73],
              );
              final result = _resolve(
                still: _still(
                  score: 93,
                  probability: 0.932044,
                  fullFrame: 93,
                  contentArea: 87,
                ),
                temporal: temporal,
                mixed: true,
              );
              expect(result.decision, 'NO_DISPLAY_EVIDENCE');
              expect(result.reasons, contains('HFR_V3_MIXED_REAL_SCENE'));
              expect(
                result.reasons,
                isNot(contains('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION')),
              );
            });
          }
          '''
          Path('test/build110_monitor_photo_regression_test.dart').write_text(test)
          PY
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: dart format lib/hcv_display_risk_fusion.dart test/build110_monitor_photo_regression_test.dart test/hcv_software_attestation_verifier_test.dart test/hcvpack_integrity_release_gate_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Monitor-photo regression gate
        run: flutter test test/build110_monitor_photo_regression_test.dart --reporter expanded

      - name: BUILD109 recovery gates
        run: |
          flutter test test/build109_ml_fullframe_recovery_test.dart --reporter expanded
          flutter test test/video_photo_spatial_evidence_test.dart --reporter expanded
          flutter test test/video_photo_spatial_fusion_test.dart --reporter expanded

      - name: Security gates
        run: |
          flutter test test/hcv_software_attestation_verifier_test.dart --reporter expanded
          flutter test test/hcvpack_integrity_release_gate_test.dart --reporter expanded

      - name: Full Flutter suite
        run: flutter test --reporter expanded

      - name: Commit validated candidate changes
        run: |
          set -euo pipefail
          git add lib/hcv_display_risk_fusion.dart test/build110_monitor_photo_regression_test.dart test/hcv_software_attestation_verifier_test.dart test/hcvpack_integrity_release_gate_test.dart lib/hcv_verifier.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve full-frame monitor photos with still-temporal corroboration"
          fi
          git push origin HEAD:fix/build109-monitor-photo-security-20260914
