name: Validate planar parallax correction

on:
  push:
    branches:
      - fix/reality-monitor-geometry-20260725
      - feature/text-social-verification-20260801
  pull_request:
    branches:
      - fix/reality-monitor-geometry-20260725
      - feature/text-social-verification-20260801
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply build-time source corrections
        run: |
          python3 tool/run_ios_share_handoff_fix.py
          python3 tool/apply_file_import_and_ocr_fix.py
          python3 tool/apply_safe_capture_location_fix.py
          python3 tool/apply_mixed_scene_monitor_fix.py
          python3 tool/apply_planar_parallax_compile_safety.py
          python3 tool/apply_certificate_regression_fix.py
          python3 tool/apply_certificate_regression_compile_fix.py
          python3 tool/apply_certificate_regression_behavior_fix.py
          python3 tool/apply_certificate_contract_test_fix.py
          python3 tool/apply_account_success_feedback.py
          python3 tool/apply_text_social_verification.py
          python3 tool/apply_text_keyboard_registry_photo_arm_fix.py

      - name: Format generated sources
        run: |
          dart format \
            lib/camera_page.dart \
            lib/account_page.dart \
            lib/text_cert_page.dart \
            lib/hcv_text_integrity.dart \
            lib/text_social_verify_page.dart \
            lib/registry_verify_page.dart \
            lib/hcv_capture_location.dart \
            lib/hcv_location_image_watermark.dart \
            lib/hcv_location_video_watermark.dart \
            lib/hcv_planar_motion_model.dart \
            lib/hcv_projective_motion_model.dart \
            lib/hcv_live_screen_probe.dart \
            lib/hcv_live_screen_probe_sampling.dart \
            lib/hcv_live_screen_probe_geometry.dart \
            lib/hcv_scene_geometry_classifier.dart \
            lib/hcv_scene_decision_fusion.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_live_screen_probe_core.dart \
            test/camera_physical_scene_contract_test.dart \
            test/photo_pre_capture_only_contract_test.dart \
            test/registry_verify_hcv_id16_contract_test.dart \
            test/capture_location_contract_test.dart \
            test/camera_ready_video_evidence_contract_test.dart \
            test/hcv_planar_motion_model_test.dart \
            test/mixed_scene_monitor_regression_test.dart \
            test/photo_display_risk_policy_test.dart \
            test/monitor_certificate_regression_test.dart \
            test/hcv_projective_motion_model_test.dart \
            test/registry_local_republish_contract_test.dart \
            test/account_success_feedback_contract_test.dart \
            test/hcv_text_integrity_test.dart \
            test/text_social_workflow_contract_test.dart \
            test/text_keyboard_registry_photo_arm_contract_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run analysis and tests with diagnostic logs
        id: diagnostics
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          ANALYZE_STATUS=$?
          flutter test --reporter expanded > test.log 2>&1
          TEST_STATUS=$?
          printf 'analyze_status=%s\ntest_status=%s\n' "$ANALYZE_STATUS" "$TEST_STATUS" > validation-status.txt
          echo '===== ANALYZE LOG ====='
          cat analyze.log
          echo '===== TEST LOG (LAST 350 LINES) ====='
          tail -n 350 test.log
          if [ "$ANALYZE_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planar-parallax-diagnostics
          path: |
            analyze.log
            test.log
            validation-status.txt
          if-no-files-found: error
          retention-days: 7
