name: Diagnose BUILD107 Flutter contracts

on:
  push:
    branches:
      - fix/hfr-v31-exposure-spatial-build107-20260912

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Materialize BUILD107
        run: |
          python3 tools/apply_build107_hfr_v31_advanced_probe.py
          python3 tools/apply_build107_contract_corrections.py
      - name: Dependencies
        run: flutter pub get
      - name: Test and preserve complete log
        id: tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/build107-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: build107-diagnostic-test-log
          path: /tmp/build107-tests.log
          if-no-files-found: error
      - name: Enforce result
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"
