name: BUILD127 convert V3 dual-branch LiteRT

on:
  push:
    branches:
      - fix/build127-ml-hard-negatives-20260921
    paths:
      - ml/v3_export/**
      - tool/convert_v3_dualbranch_litert.py
      - .github/workflows/build127-convert-v3-dualbranch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build127-v3-dualbranch-convert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct int8 transport checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat ml/v3_export/v3_dualbranch_int8.pt.xz.b64.part* \
            | base64 --decode > /tmp/v3_dualbranch_int8.pt.xz
          xz -dc /tmp/v3_dualbranch_int8.pt.xz > /tmp/v3_dualbranch_int8.pt
          test -s /tmp/v3_dualbranch_int8.pt
          sha256sum /tmp/v3_dualbranch_int8.pt

      - name: Install LiteRT conversion runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch litert-torch ai-edge-litert

      - name: Convert and verify PyTorch to LiteRT
        run: |
          python tool/convert_v3_dualbranch_litert.py \
            --checkpoint /tmp/v3_dualbranch_int8.pt \
            --out assets/ml/sigillum_screen_replay_v3_dualbranch.tflite \
            --report ml/v3_export/v3_dualbranch_litert_parity.json
          sha256sum assets/ml/sigillum_screen_replay_v3_dualbranch.tflite

      - name: Upload conversion artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigillum-v3-dualbranch-litert
          path: |
            assets/ml/sigillum_screen_replay_v3_dualbranch.tflite
            ml/v3_export/v3_dualbranch_litert_parity.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified LiteRT model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/ml/sigillum_screen_replay_v3_dualbranch.tflite \
            ml/v3_export/v3_dualbranch_litert_parity.json
          git rm -f ml/v3_export/v3_dualbranch_int8.pt.xz.b64.part* || true
          if git diff --cached --quiet; then
            echo "No conversion changes"
            exit 0
          fi
          git commit -m "BUILD127: add verified V3 dual-branch LiteRT model"
          git push origin HEAD:fix/build127-ml-hard-negatives-20260921
