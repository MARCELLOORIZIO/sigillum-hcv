name: Materialize build71 video semantic persistence

on:
  push:
    branches:
      - phase-c-video-semantic-persistence-20260902
    paths:
      - .github/workflows/materialize-build71-video-semantic-persistence-20260902.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-c-video-semantic-persistence-20260902
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize VIDEO-only fusion patch
        run: python3 tool/materialize_build71_video_semantic_persistence_20260902.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run build71 VIDEO regression tests
        run: flutter test test/build71_video_semantic_persistence_regression_test.dart --reporter expanded

      - name: Run prior capture-fusion regressions
        run: flutter test test/build69_capture_fusion_integration_test.dart --reporter expanded

      - name: Run full Flutter test suite
        run: flutter test --reporter expanded

      - name: Diff sanity
        run: |
          git diff --check
          git status --short
          git diff -- lib/hcv_display_risk_fusion.dart lib/camera_page.dart

      - name: Remove temporary materializer
        run: |
          git rm tool/materialize_build71_video_semantic_persistence_20260902.py
          git rm .github/workflows/materialize-build71-video-semantic-persistence-20260902.yml

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/hcv_display_risk_fusion.dart lib/camera_page.dart test/build71_video_semantic_persistence_regression_test.dart
          git commit -am "Phase C: resolve persistent semantic video evidence"
          git push origin HEAD:phase-c-video-semantic-persistence-20260902
