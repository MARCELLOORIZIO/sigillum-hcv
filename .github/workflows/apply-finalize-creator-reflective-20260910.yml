name: Apply Creator reflective finalizer

on:
  push:
    branches:
      - fix/creator-entitlement-and-reflective-planar-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[finalizer-applied]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source finalizer
        run: python3 tool/finalize_creator_reflective_patch_20260910.py

      - name: Commit finalized source when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/hcv_display_risk_fusion.dart lib/user_home_page.dart; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/hcv_display_risk_fusion.dart lib/user_home_page.dart
          git commit -m "fix: finalize Creator entitlement and reflective guard [finalizer-applied]"
          git push origin HEAD:fix/creator-entitlement-and-reflective-planar-20260910
