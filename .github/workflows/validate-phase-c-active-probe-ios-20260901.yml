name: Validate Phase C Active Probe iOS

on:
  push:
    branches:
      - phase-c-active-probe-reality-regression-20260901

permissions:
  contents: read

jobs:
  validate-ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Resolve locked dependencies and validated iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Re-run Phase C regression matrix on macOS
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test \
            test/archive42_reality_active_probe_regression_test.dart \
            test/hcv_active_display_classifier_test.dart \
            test/archive19_flash_response_test.dart \
            test/current_device_monitor_recall_regression_test.dart \
            test/mixed_scene_monitor_regression_test.dart \
            --reporter expanded

      - name: Resolve CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          pushd ios >/dev/null
          pod install --repo-update
          popd >/dev/null
          grep -F 'TensorFlowLiteSwift (2.17.0)' ios/Podfile.lock
          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Build unsigned iOS Release
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com \
            --dart-define=GIT_COMMIT="$GITHUB_SHA"

          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'
          SHARE_EXTENSION="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -n 1 || true)"
          test -n "$SHARE_EXTENSION"
          test -d "$SHARE_EXTENSION"
          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml
          echo 'PHASE_C_ACTIVE_PROBE_IOS_RELEASE=PASS'
