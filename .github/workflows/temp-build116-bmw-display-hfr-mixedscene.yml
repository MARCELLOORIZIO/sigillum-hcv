name: TEMP BUILD116 BMW display HFR mixed-scene recovery

on:
  push:
    branches:
      - fix/build116-bmw-display-hfr-mixedscene-20260917
    paths:
      - .github/workflows/temp-build116-bmw-display-hfr-mixedscene.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BUILD116 branch
        uses: actions/checkout@v4
        with:
          ref: fix/build116-bmw-display-hfr-mixedscene-20260917
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply bounded BUILD116 HFR fix
        run: python3 .github/scripts/apply_build116_bmw_display_hfr_mixedscene.py

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies and pin iOS TFLite runtime
        run: |
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Format and enforce scoped diff
        run: |
          dart format lib/hcv_temporal_frequency_probe.dart test/build116_bmw_display_hfr_mixedscene_test.dart
          git diff --check
          changed="$(git status --short | awk '{print $2}' | grep -v '^\.github/' | sort)"
          expected="$(printf '%s\n' lib/hcv_temporal_frequency_probe.dart test/build116_bmw_display_hfr_mixedscene_test.dart | sort)"
          test "$changed" = "$expected"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Targeted BUILD116 BMW and mixed-scene regression tests
        run: |
          flutter test --reporter expanded \
            test/build116_bmw_display_hfr_mixedscene_test.dart \
            test/hfr_v3_fullframe_mixed_scene_test.dart \
            test/hfr_v32_harmonic_reality_physics_test.dart \
            test/weak_semantic_no_physical_resolution_test.dart \
            test/build115_reflection_semantic_resolution_test.dart \
            test/mixed_scene_monitor_regression_test.dart

      - name: Full Flutter suite
        run: flutter test --reporter expanded

      - name: Postpatch release verifier
        run: python3 tool/verify_postpatch_release_20260825.py

      - name: Final scoped diff guard
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | grep -v '^\.github/' | sort)"
          expected="$(printf '%s\n' lib/hcv_temporal_frequency_probe.dart test/build116_bmw_display_hfr_mixedscene_test.dart | sort)"
          test "$changed" = "$expected"
          git diff --exit-code -- lib/hcv_display_risk_fusion.dart ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Commit tested BUILD116 fix
        run: |
          git add lib/hcv_temporal_frequency_probe.dart test/build116_bmw_display_hfr_mixedscene_test.dart
          git commit -m "fix(build116): recover full-grid automotive displays"
          git push origin HEAD:fix/build116-bmw-display-hfr-mixedscene-20260917
