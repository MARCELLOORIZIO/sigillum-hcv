name: Temporary RC2 runtime contract validation

on:
  push:
    branches:
      - fix/rc2-runtime-contract-20260901

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: |
          dart format --output=none test/rc2_installed_runtime_regression_contract_test.dart
          git diff --exit-code -- test/rc2_installed_runtime_regression_contract_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter test suite
        run: flutter test --reporter expanded
