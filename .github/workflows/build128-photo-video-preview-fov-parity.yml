name: BUILD128 photo/video preview FOV parity

on:
  push:
    branches:
      - fix/build128-photo-video-preview-fov-parity-20260923
  pull_request:
    branches:
      - fix/build128-derivative-integrity-v2-20260923
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build128-photo-video-fov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify changed Dart source formatting
        run: |
          dart format --output=none --set-exit-if-changed lib/camera_page.dart test/build118_photo_preview_highres_contract_test.dart test/build119_photo_preview_rotation_contract_test.dart test/build128_photo_video_preview_fov_parity_test.dart
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter tests
        run: flutter test --reporter expanded

  ios-unsigned-release:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Pin validated TensorFlow Lite iOS runtime
        run: bash tool/pin_tflite_ios_runtime_20260826.sh
      - name: Resolve CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS USER Release
        run: flutter build ios --release --no-codesign --no-pub --dart-define=SIGILLUM_EDITION=user --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com --dart-define=GIT_COMMIT="$GITHUB_SHA"
      - name: Verify iOS bundle
        run: |
          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'
          echo 'PHOTO_VIDEO_FOV_PREVIEW_IOS_UNSIGNED_RELEASE=PASS'
