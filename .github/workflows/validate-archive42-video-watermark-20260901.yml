name: Validate Archive 42 Video Watermark

on:
  push:
    branches:
      - fix/ios-video-watermark-archive42-20260901

permissions:
  contents: write

jobs:
  validate-archive42:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format patch
        run: |
          dart format \
            lib/hcv_location_video_watermark.dart \
            test/ios_video_watermark_archive42_contract_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run archive 42 regression tests
        run: |
          flutter test \
            test/ios_video_watermark_archive42_contract_test.dart \
            test/video_native_capture_writer_stability_contract_test.dart \
            --reporter expanded

      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded

      - name: Materialize tested formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/hcv_location_video_watermark.dart \
            test/ios_video_watermark_archive42_contract_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: materialize tested archive 42 watermark formatting [skip ci]"
            git push origin HEAD:fix/ios-video-watermark-archive42-20260901
          fi
