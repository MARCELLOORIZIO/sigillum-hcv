name: BUILD92 capture lock and HFR full-frame validation

on:
  push:
    branches:
      - fix/build92-capture-lock-hfr-fullframe

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply capture lock and HFR rescue patch
        run: python3 tool/apply_build92_capture_lock_hfr_fullframe.py

      - name: Format production and generated tests
        run: >-
          dart format
          lib/camera_page.dart
          lib/hcv_hfr_display_rescue.dart
          test/hfr_full_frame_rescue_v1_test.dart
          test/camera_capture_finalization_lock_contract_test.dart

      - name: Replace capture-lock test with semantic contract
        shell: bash
        run: |
          cat > test/camera_capture_finalization_lock_contract_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('capture finalization lock protects every conflicting camera command', () {
              final source = File('lib/camera_page.dart').readAsStringSync();
              expect(source, contains('bool _capturePipelineBusy = false;'));
              expect(source, contains('bool get _cameraControlsLocked =>'));
              expect(source, contains('canPop: !_cameraControlsLocked'));
              expect(source, contains('onPressed: _cameraControlsLocked ? null : toggleFlash'));
              expect(source, contains('onPressed: _cameraControlsLocked ? null : switchCamera'));
              expect(source, contains('_cameraControlsLocked || _locationBusy'));
              expect(source, contains('onChanged: _cameraControlsLocked'));
              expect(source, contains('onSelected: _cameraControlsLocked'));
              expect(source, contains('ModalBarrier('));

              final captureButtonStart = source.indexOf('onTap: !ready ||');
              expect(captureButtonStart, greaterThanOrEqualTo(0));
              final captureButtonEnd = source.indexOf(
                'child: AnimatedContainer(',
                captureButtonStart,
              );
              expect(captureButtonEnd, greaterThan(captureButtonStart));
              final captureButton = source.substring(captureButtonStart, captureButtonEnd);
              expect(captureButton, contains('_videoFinalizeInProgress'));
              expect(captureButton, contains('_capturePipelineBusy'));
            });

            test('video stop locks before stopVideoRecording and unlocks only in finally', () {
              final source = File('lib/camera_page.dart').readAsStringSync();
              final start = source.indexOf('  Future<void> stop() async {');
              final end = source.indexOf(
                '  Map<String, dynamic> _photoTemporalV2Unavailable(',
                start,
              );
              expect(start, greaterThanOrEqualTo(0));
              expect(end, greaterThan(start));
              final block = source.substring(start, end);
              final lock = block.indexOf('_capturePipelineBusy = true;');
              final stop = block.indexOf('stopVideoRecording()');
              final process = block.indexOf('await processVideo(');
              final unlock = block.lastIndexOf('_capturePipelineBusy = false;');
              expect(lock, greaterThanOrEqualTo(0));
              expect(stop, greaterThan(lock));
              expect(process, greaterThan(stop));
              expect(unlock, greaterThan(process));
            });

            test('photo remains locked through the entire save/certificate pipeline', () {
              final source = File('lib/camera_page.dart').readAsStringSync();
              final start = source.indexOf('  Future<void> takePhoto() async {');
              final end = source.indexOf('  Future<Directory> _downloadsDirectory()', start);
              expect(start, greaterThanOrEqualTo(0));
              expect(end, greaterThan(start));
              final block = source.substring(start, end);
              expect(block.indexOf('_capturePipelineBusy = true;'), greaterThanOrEqualTo(0));
              expect(block.indexOf('takePicture()'), greaterThanOrEqualTo(0));
              expect(block.indexOf('createPhotoPackage('), greaterThanOrEqualTo(0));
              expect(block.indexOf('saveContentToGallery('), greaterThanOrEqualTo(0));
              expect(block, contains('finally {'));
              expect(
                block.lastIndexOf('_capturePipelineBusy = false;'),
                greaterThan(block.indexOf('saveContentToGallery(')),
              );
            });

            test('no illumination or torch probe is introduced', () {
              final source = File('lib/camera_page.dart').readAsStringSync();
              expect(source, isNot(contains('HCVIlluminationResponseProbe')));
              expect(source, isNot(contains('captureIlluminationResponseNative')));
            });
          }
          DART
          dart format test/camera_capture_finalization_lock_contract_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focused regression tests
        run: >-
          flutter test
          test/hfr_full_frame_rescue_v1_test.dart
          test/camera_capture_finalization_lock_contract_test.dart
          test/native_temporal_frequency_v2_hfr_range_contract_test.dart
          test/native_temporal_frequency_focus_handoff_contract_test.dart
          test/camera_focus_recovery_after_native_probe_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Compile iOS device without signing
        run: flutter build ios --release --no-codesign

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_build92_capture_lock_hfr_fullframe.py
          rm -f .github/workflows/build92-capture-lock-hfr-fullframe-validation.yml
          git config user.name 'SIGILLUM CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/camera_page.dart lib/hcv_hfr_display_rescue.dart
          git add test/hfr_full_frame_rescue_v1_test.dart test/camera_capture_finalization_lock_contract_test.dart
          git add -u tool/apply_build92_capture_lock_hfr_fullframe.py .github/workflows/build92-capture-lock-hfr-fullframe-validation.yml
          if git diff --cached --quiet; then
            echo 'No materialized changes'
            exit 1
          fi
          git commit -m 'Lock camera controls through finalization and add full-frame HFR rescue'
          git push origin HEAD:fix/build92-capture-lock-hfr-fullframe
