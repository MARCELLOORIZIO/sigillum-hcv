name: Trigger Codemagic HFR TestFlight

on:
  push:
    branches:
      - fix/creator-entitlement-and-reflective-planar-20260910

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Codemagic build through REST API
        env:
          TOKEN_A: ${{ secrets.CODEMAGIC_API_TOKEN }}
          TOKEN_B: ${{ secrets.CM_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_A:-}"
          if [[ -z "$TOKEN" ]]; then TOKEN="${TOKEN_B:-}"; fi
          if [[ -z "$TOKEN" ]]; then
            echo "No Codemagic API token secret is configured in GitHub Actions."
            exit 2
          fi
          RESPONSE="$(curl --fail-with-body -sS \
            -H 'Content-Type: application/json' \
            -H "x-auth-token: ${TOKEN}" \
            --data '{"appId":"6a0747e8d58afdcf30d2793c","workflowId":"ios-testflight","branch":"fix/creator-entitlement-and-reflective-planar-20260910"}' \
            -X POST https://api.codemagic.io/builds)"
          echo "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); bid=d.get("buildId"); assert bid, d; print("CODEMAGIC_BUILD_ID="+bid)'
