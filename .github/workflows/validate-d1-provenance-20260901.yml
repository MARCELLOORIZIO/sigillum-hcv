name: Validate D1 Provenance Core

on:
  push:
    branches:
      - phase-d1-provenance-core-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format D1 sources
        run: dart format lib/hcv_provenance_chain.dart test/hcv_provenance_chain_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run D1 regression tests
        run: flutter test test/hcv_provenance_chain_test.dart --reporter expanded

      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded

      - name: Upload formatted D1 sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-formatted-sources
          path: |
            lib/hcv_provenance_chain.dart
            test/hcv_provenance_chain_test.dart
          retention-days: 1
