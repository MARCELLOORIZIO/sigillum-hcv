name: temp-build111-monitor-fix-20260914

on:
  push:
    branches:
      - candidate/build111-v2-20260914

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply security commits
        run: |
          git cherry-pick e99640a0b52e1ecd703c9711d0e6fccaf8cd00f1
          git cherry-pick 52d4cf3ddcbd4e01d406050e5eb17cda2bdfc6e6
      - name: Apply monitor fusion fix
        run: python3 .github/scripts/build111_monitor_patch.py
      - name: Commit candidate changes
        run: |
          git add lib/hcv_display_risk_fusion.dart lib/hcv_verifier.dart test/hcv_software_attestation_verifier_test.dart test/hcvpack_integrity_release_gate_test.dart test/build111_photo_monitor_regression_test.dart
          git commit -m "fix(build111): preserve strong photo monitor corroboration [skip ci]"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        timeout-minutes: 3
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: BUILD111 monitor regression
        timeout-minutes: 3
        run: flutter test test/build111_photo_monitor_regression_test.dart
      - name: BUILD109 spatial regression
        timeout-minutes: 3
        run: flutter test test/video_photo_spatial_evidence_test.dart test/video_photo_spatial_fusion_test.dart
      - name: BUILD109 HFR ML regression
        timeout-minutes: 3
        run: flutter test test/build109_low_modulation_hfr_recovery_test.dart test/build109_ml_fullframe_recovery_test.dart
      - name: D1 verifier regression
        timeout-minutes: 3
        run: flutter test test/hcv_software_attestation_verifier_test.dart
      - name: HCVPACK integrity gate
        timeout-minutes: 3
        run: flutter test test/hcvpack_integrity_release_gate_test.dart
      - name: Full suite
        timeout-minutes: 12
        run: flutter test
      - name: Push tested candidate
        run: git push origin HEAD:candidate/build111-v2-20260914
