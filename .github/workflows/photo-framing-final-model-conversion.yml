name: PHOTO SIGILLUM final trained MobileNetV3 TFLite
on:
  push:
    branches: [experiment/photo-framing-context-guard-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert-sigillum-trained:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LiteRT Torch
        run: |
          python -m pip install litert-torch torchvision ai-edge-litert
      - name: Reconstruct original trained classifier and export
        run: |
          python - <<'PY'
          import torch, numpy as np, litert_torch, json, zlib, base64, hashlib, pathlib
          from torch import nn
          from torchvision.models import mobilenet_v3_small,MobileNet_V3_Small_Weights
          torch.set_num_threads(2)
          hd=pathlib.Path('ml/photo_framing_fused_head_fp16.b85').read_text()
          raw=zlib.decompress(base64.b85decode(hd))
          a=np.frombuffer(raw,dtype='<f2').astype('float32')
          assert a.size==3*576+3,a.size
          w=a[:3*576].reshape(3,576).copy()
          bias=a[3*576:].copy()
          backbone=mobilenet_v3_small(weights=MobileNet_V3_Small_Weights.IMAGENET1K_V1).eval()
          class Classifier(nn.Module):
            def __init__(self,backbone):
              super().__init__()
              self.features=backbone.features
              self.pool=backbone.avgpool
              self.register_buffer('mean',torch.tensor([.485,.456,.406]).view(1,3,1,1))
              self.register_buffer('std',torch.tensor([.229,.224,.225]).view(1,3,1,1))
              self.linear=nn.Linear(576,3)
              with torch.no_grad():
                self.linear.weight.copy_(torch.from_numpy(w))
                self.linear.bias.copy_(torch.from_numpy(bias))
            def forward(self,x):
              x=(x-self.mean)/self.std
              return torch.softmax(self.linear(self.pool(self.features(x)).flatten(1)),dim=1)
          model=Classifier(backbone).eval()
          example=torch.zeros(1,3,160,160)
          converted=litert_torch.convert(model,(example,))
          converted.export('sigillum_photo_framing_v1.tflite')
          expected={20261011:[.2687537670135498,4.796788743988145e-06,.7312413454055786],
                    42:[.2010238617658615,9.008022061607335e-06,.7989671230316162],
                    121:[.45459261536598206,5.970638994767796e-06,.545401394367218],
                    7:[.426824688911438,5.748745479650097e-06,.5731696486473083],
                    2026:[.6294050812721252,4.1045959733310156e-06,.37059083580970764]}
          errors=[];reference_errors=[];details=[]
          for seed,reference in expected.items():
            x=np.random.default_rng(seed).random((1,3,160,160),dtype=np.float32)
            with torch.no_grad():pt=model(torch.from_numpy(x)).detach().numpy()
            edge=np.asarray(converted(torch.from_numpy(x)))
            ref=np.asarray(reference,dtype=np.float32).reshape(1,3)
            assert pt.shape==(1,3) and edge.shape==(1,3)
            err=float(np.max(np.abs(pt-edge)));errors.append(err)
            referr=float(np.max(np.abs(pt-ref)));reference_errors.append(referr)
            details.append({'seed':seed,'converted':[float(v) for v in edge.flatten()],
                            'torch':[float(v) for v in pt.flatten()],'tflite_error':err,
                            'trained_checkpoint_reference_error':referr})
          assert max(errors)<0.005,('TFLite parity',errors)
          assert max(reference_errors)<0.005,('SIGILLUM checkpoint parity',reference_errors)
          file=pathlib.Path('sigillum_photo_framing_v1.tflite')
          report={'status':'PARITY_PASSED','decisionRole':'DIAGNOSTIC_ONLY',
                  'tflite_bytes':file.stat().st_size,
                  'tflite_sha256':hashlib.sha256(file.read_bytes()).hexdigest(),
                  'model_source':'Official torchvision MobileNetV3-Small ImageNet V1 + SIGILLUM frozen-backbone trained fused head',
                  'training_classifications':'PRELIMINARY_NOT_INDEPENDENTLY_VALIDATED',
                  'input_layout':'NCHW_RGB_FLOAT32_0_TO_1','input_shape':[1,3,160,160],
                  'output_shape':[1,3],
                  'classes':['PHYSICAL_SURFACE_OR_SCENE','DISPLAY_IN_REAL_SCENE','POSSIBLE_FULL_FRAME_DISPLAY'],
                  'head_blob_sha256':hashlib.sha256(hd.encode()).hexdigest(),
                  'max_tflite_vs_reconstructed_torch_error':max(errors),
                  'max_reconstructed_torch_vs_original_trained_model_error':max(reference_errors),
                  'details':details}
          pathlib.Path('sigillum_photo_framing_v1_PARITY.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sigillum-trained-framing-tflite-parity
          path: |
            sigillum_photo_framing_v1.tflite
            sigillum_photo_framing_v1_PARITY.json
          retention-days: 2
