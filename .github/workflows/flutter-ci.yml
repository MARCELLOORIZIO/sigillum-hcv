name: Flutter CI

on:
  pull_request:
    branches:
      - fix/display-kyc-zoom-20260723
      - sigillum-iphone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests and save full log
        id: flutter_tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > flutter-test.log 2>&1
          TEST_EXIT=$?
          cat flutter-test.log
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT

      - name: Upload Flutter test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 7
