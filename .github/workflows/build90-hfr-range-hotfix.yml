name: BUILD90 HFR range crash hotfix validation

on:
  push:
    branches:
      - fix/build90-hfr-range-crash

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply HFR range crash hotfix
        run: python3 tool/apply_build90_hfr_range_hotfix.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: HFR crash regression tests
        run: |
          flutter test \
            test/native_temporal_frequency_v2_hfr_range_contract_test.dart \
            test/native_temporal_frequency_v2_crash_hotfix_contract_test.dart \
            test/native_temporal_frequency_v2_contract_test.dart \
            test/frequency_probe_session_safety_contract_test.dart \
            test/temporal_frequency_probe_contract_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Compile iOS device without signing
        run: flutter build ios --release --no-codesign

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_build90_hfr_range_hotfix.py
          rm -f .github/workflows/build90-hfr-range-hotfix.yml
          git config user.name 'SIGILLUM CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/Runner/AppDelegate.swift test/native_temporal_frequency_v2_hfr_range_contract_test.dart
          git add -u tool/apply_build90_hfr_range_hotfix.py .github/workflows/build90-hfr-range-hotfix.yml
          if git diff --cached --quiet; then
            echo 'No materialized changes'
            exit 1
          fi
          git commit -m 'Use hardware AVFrameRateRange for native HFR probe'
          git push origin HEAD:fix/build90-hfr-range-crash
