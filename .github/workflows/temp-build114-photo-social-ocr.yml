name: TEMP BUILD114 photo social OCR recovery

on:
  push:
    branches:
      - fix/build114-photo-social-registry-ocr-20260916

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'ci(build114): validate photo social OCR recovery' }}"
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply bounded PHOTO OCR Registry fix
        run: |
          python3 .github/scripts/fix_build114_photo_social_registry_ocr.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/photo_ocr_registry_recovery_contract_test.dart')
          text = path.read_text(encoding='utf-8')
          old = "expect(registry, contains('_fetchCertificateExact(String hcvId)'));"
          new = "expect(registry, contains('_fetchCertificateExact('));"
          if text.count(old) != 1:
              raise RuntimeError(f'unexpected contract assertion count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          regression = Path('test/c8ff_regression_contract_test.dart')
          regression_text = regression.read_text(encoding='utf-8')
          regression_old = "contains('originalError.kind != HCVRegistryFailureKind.notFound')"
          regression_new = "contains('HCVRegistryFailureKind.notFound')"
          if regression_text.count(regression_old) != 1:
              raise RuntimeError(
                  f'unexpected C8FF Registry assertion count: {regression_text.count(regression_old)}'
              )
          regression.write_text(
              regression_text.replace(regression_old, regression_new, 1),
              encoding='utf-8',
          )
          PY

      - name: Enforce scoped diff
        run: |
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          EXPECTED=$'lib/hcv_media_id_ocr.dart\nlib/registry_verify_page.dart\ntest/c8ff_regression_contract_test.dart\ntest/hcv_media_id_ocr_test.dart\ntest/photo_ocr_registry_recovery_contract_test.dart'
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies and pin iOS TFLite runtime
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Targeted PHOTO OCR tests
        run: |
          flutter test \
            test/hcv_media_id_ocr_test.dart \
            test/photo_ocr_registry_recovery_contract_test.dart \
            test/c8ff_regression_contract_test.dart \
            --reporter expanded

      - name: Full Flutter suite
        run: flutter test --reporter expanded

      - name: Postpatch release verifier
        run: python3 tool/verify_postpatch_release_20260825.py

      - name: Final scoped diff guard
        run: |
          CHANGED="$(git diff --name-only)"
          EXPECTED=$'lib/hcv_media_id_ocr.dart\nlib/registry_verify_page.dart\ntest/c8ff_regression_contract_test.dart\ntest/hcv_media_id_ocr_test.dart\ntest/photo_ocr_registry_recovery_contract_test.dart'
          test "$CHANGED" = "$EXPECTED"
          git diff --exit-code -- lib/camera_page.dart lib/hcv_engine.dart lib/hcv_display_risk_fusion.dart lib/hcv_ml_screen_replay_classifier.dart lib/hcv_social_fingerprint.dart lib/hcv_registry_service.dart

      - name: Commit tested fix
        run: |
          git add \
            lib/hcv_media_id_ocr.dart \
            lib/registry_verify_page.dart \
            test/c8ff_regression_contract_test.dart \
            test/hcv_media_id_ocr_test.dart \
            test/photo_ocr_registry_recovery_contract_test.dart
          git commit -m 'fix(build114): bound photo social Registry OCR recovery'
          git push origin HEAD:fix/build114-photo-social-registry-ocr-20260916
