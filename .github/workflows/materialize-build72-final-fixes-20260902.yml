name: Materialize build72 final fixes

on:
  push:
    branches:
      - phase-c-build72-final-fixes-20260902
    paths:
      - tool/materialize_build72_final_fixes_20260902.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize source and tests
        run: python tool/materialize_build72_final_fixes_20260902.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Targeted build72 regression tests
        run: |
          flutter test test/build72_video_reality_and_container_regression_test.dart
          flutter test test/build72_verification_scene_copy_contract_test.dart
          flutter test test/build71_video_semantic_persistence_regression_test.dart

      - name: Full Flutter test suite
        run: flutter test

      - name: Diff sanity
        run: |
          git diff --check
          git status --short

      - name: Commit validated materialized patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/camera_page.dart \
            lib/hcv_display_risk_fusion.dart \
            lib/registry_verify_page.dart \
            test/build72_video_reality_and_container_regression_test.dart \
            test/build72_verification_scene_copy_contract_test.dart
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 0
          fi
          git commit -m "Phase C: fix build72 video reality, MP4 finalization, and scene copy"
          git push origin HEAD:phase-c-build72-final-fixes-20260902
