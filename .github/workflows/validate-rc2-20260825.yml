name: Validate SIGILLUM RC2 materialized release

on:
  push:
    branches:
      - release/testflight-rc2-20260825
      - release/production-gate-20260827
  pull_request:
    branches:
      - release/testflight-rc2-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rc2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up validated Flutter version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Enforce materialized-build architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'python3 tool/(apply_|finalize_)' codemagic.yaml tool/build_testflight_ipa_rc2_20260825.sh; then
            echo 'BUILD_PATCH_CHAIN_PRESENT=FAIL'
            exit 1
          fi
          grep -F 'bash tool/pin_tflite_ios_runtime_20260826.sh' codemagic.yaml
          echo 'BUILD_PATCH_CHAIN_PRESENT=NO'

      - name: Resolve locked dependencies and pin external iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Validate exact committed materialized source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          git diff --exit-code -- lib test ios/Runner ios/Podfile
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded 2>&1 | tee /tmp/xcodebuild_logs/flutter-tests-materialized.log
          python3 tool/verify_postpatch_release_20260825.py
          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml
          echo 'MATERIALIZED_RELEASE_SOURCE=PASS'

      - name: Upload materialized-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigillum-rc2-materialized-audit
          path: |
            /tmp/xcodebuild_logs/sigillum-postpatch-audit.log
            /tmp/xcodebuild_logs/flutter-tests-materialized.log
          if-no-files-found: warn
          retention-days: 14
