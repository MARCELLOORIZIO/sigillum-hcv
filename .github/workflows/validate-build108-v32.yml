name: Validate BUILD108 HFR V3.2

on:
  push:
    branches:
      - fix/hfr-v32-harmonic-reality-physics-build108-20260913

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify BUILD107 clean base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bad32f7b76a78e55f9e62e92c209df9facea942f HEAD
          echo "BUILD107 base verified"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply BUILD108 V3.2
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build108_probe_part1.py
          python3 tools/build108_probe_part2.py
          python3 tools/build108_fusion_swift_tests.py
          python3 tools/build108_test_import_fix.py
          python3 - <<'PY'
          from pathlib import Path
          old = 'DECISIONAL_VALIDATED_V3_DISPLAY_AND_MIXED_SCENE;V31_ADVANCED_PHYSICS_DIAGNOSTIC_ONLY'
          new = 'DECISIONAL_VALIDATED_V3_DISPLAY_AND_MIXED_SCENE;V32_HARMONIC_DISPLAY_RECOVERY_CANDIDATE;V32_REALITY_PHYSICS_DIAGNOSTIC_ONLY'
          paths = [
              Path('test/frequency_probe_session_safety_contract_test.dart'),
              Path('test/native_temporal_frequency_v2_contract_test.dart'),
              Path('test/temporal_frequency_probe_contract_test.dart'),
          ]
          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing BUILD107 role anchor in {path}')
              path.write_text(text.replace(old, new))
          print('BUILD108 V3.2 contract-role tests aligned')
          PY

      - name: Guard intended diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          ios/Runner/AppDelegate.swift
          lib/hcv_display_risk_fusion.dart
          lib/hcv_temporal_frequency_probe.dart
          test/frequency_probe_session_safety_contract_test.dart
          test/hfr_v32_harmonic_reality_physics_test.dart
          test/native_temporal_frequency_v2_contract_test.dart
          test/temporal_frequency_probe_contract_test.dart
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Resolve Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter test suite
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/build108-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===== BUILD108 TEST FAILURE EXCERPTS ====="
            grep -n -B 8 -A 18 -E 'Expected:|Actual:|Which:|Test failed|Some tests failed|FAILED|Exception|Error:' /tmp/build108-tests.log | tail -n 320 || tail -n 220 /tmp/build108-tests.log
            echo "===== END FAILURE EXCERPTS ====="
            exit "$status"
          fi
          tail -n 12 /tmp/build108-tests.log
          echo "BUILD108 full Flutter suite passed"

      - name: Snapshot intended source before iOS compile
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- lib test ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml > /tmp/pre-ios.diff

      - name: Compile iOS device without signing
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign --no-pub --dart-define=SIGILLUM_EDITION=user

      - name: Prove source unchanged by iOS compile
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- lib test ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml > /tmp/post-ios.diff
          cmp /tmp/pre-ios.diff /tmp/post-ios.diff

      - name: Commit validated BUILD108 application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ios/Runner/AppDelegate.swift \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_temporal_frequency_probe.dart \
            test/frequency_probe_session_safety_contract_test.dart \
            test/hfr_v32_harmonic_reality_physics_test.dart \
            test/native_temporal_frequency_v2_contract_test.dart \
            test/temporal_frequency_probe_contract_test.dart
          git commit -m "feat: add HFR V3.2 harmonic and reality physics"
          git push origin HEAD:fix/hfr-v32-harmonic-reality-physics-build108-20260913
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
