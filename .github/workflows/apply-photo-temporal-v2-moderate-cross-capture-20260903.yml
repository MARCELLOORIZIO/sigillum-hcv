              legacy.decision == 'NO_DISPLAY_EVIDENCE' &&
              HCVPhotoTemporalV2Policy.hasModerateCrossCaptureScreenAgreement(
                stillMl: _mlAnalysisFromAnalyses(analyses),
                liveProbe: liveProbe,
              );
          if (moderateCrossCaptureAgreement) {
            final evidenceSources = <String>{
              ...legacy.evidenceSources,
              'ML_SCREEN_CLASS',
              'PHOTO_TEMPORAL_CROSS_CAPTURE',
            }.toList()
              ..sort();
            final reasons = <String>{
              ...legacy.reasons,
              'PHOTO_TEMPORAL_V2_MODERATE_SCREEN_CROSS_CAPTURE_AGREEMENT',
            }.toList();
            return HCVDisplayRiskResult(
              risk: 'MEDIUM',
              score: 45,
              decision: 'NON_CONCLUSIVE',
              analysisStatus: legacy.analysisStatus,
              evidenceSources: evidenceSources,
              strongSources: legacy.strongSources,
              reasons: reasons,
            );
          }

          if (mlFirst != null &&
"""
          if 'PHOTO_TEMPORAL_V2_MODERATE_SCREEN_CROSS_CAPTURE_AGREEMENT' not in source:
              if source.count(old) != 1:
                  raise RuntimeError('photo decision anchor not unique')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          dart format lib/camera_page.dart lib/hcv_photo_temporal_v2_policy.dart test/photo_temporal_v2_hcvpack_regression_31_test.dart test/photo_temporal_v2_moderate_cross_capture_integration_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full test suite
        run: flutter test --reporter expanded

      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-photo-temporal-v2-moderate-cross-capture-20260903.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart lib/hcv_photo_temporal_v2_policy.dart test/photo_temporal_v2_hcvpack_regression_31_test.dart test/photo_temporal_v2_moderate_cross_capture_integration_test.dart .github/workflows/apply-photo-temporal-v2-moderate-cross-capture-20260903.yml
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Apply validated Photo Temporal V2 moderate cross-capture gate"
          git push origin HEAD:fix/photo-temporal-v2-moderate-cross-capture-20260903
