name: Diagnose SIGILLUM RC2 TFLite models

on:
  push:
    branches:
      - release/testflight-rc2-20260825
    paths:
      - tool/diagnose_tflite_models_20260825.py
      - .github/workflows/diagnose-ml-rc2-20260825.yml
      - assets/ml/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tensorflow-version:
          - '2.12.1'
          - '2.17.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install TensorFlow CPU
        run: python -m pip install --disable-pip-version-check --quiet "tensorflow-cpu==${{ matrix.tensorflow-version }}"

      - name: Prove expected model/runtime compatibility
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ matrix.tensorflow-version }}" == "2.17.0" ]]; then
            python tool/diagnose_tflite_models_20260825.py
            echo "TFLITE_2_17_COMPATIBILITY=PASS"
          else
            set +e
            python tool/diagnose_tflite_models_20260825.py 2>&1 | tee /tmp/tflite-2.12.log
            status=${PIPESTATUS[0]}
            set -e
            if [[ $status -eq 0 ]]; then
              echo "Expected TFLite 2.12 incompatibility but both models loaded"
              exit 1
            fi
            grep -F "FULLY_CONNECTED' version '12'" /tmp/tflite-2.12.log
            grep -F "old TFLite binary with a newer model" /tmp/tflite-2.12.log
            echo "TFLITE_2_12_INCOMPATIBILITY=CONFIRMED"
          fi
