name: Diagnose SIGILLUM RC2 TFLite models

on:
  push:
    branches:
      - release/testflight-rc2-20260825
    paths:
      - tool/diagnose_tflite_models_20260825.py
      - .github/workflows/diagnose-ml-rc2-20260825.yml
      - assets/ml/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tensorflow-version:
          - '2.12.1'
          - '2.17.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install TensorFlow CPU
        run: python -m pip install --disable-pip-version-check --quiet "tensorflow-cpu==${{ matrix.tensorflow-version }}"

      - name: Load both TFLite models and list operators
        run: python tool/diagnose_tflite_models_20260825.py
