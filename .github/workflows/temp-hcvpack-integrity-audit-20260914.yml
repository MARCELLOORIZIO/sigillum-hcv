name: Temporary HCVPACK Integrity Audit

on:
  push:
    branches:
      - audit/hcvpack-integrity-b-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: HCVPACK integrity release gate
        run: flutter test test/hcvpack_integrity_release_gate_test.dart --reporter expanded

      - name: D1 software attestation verifier regression
        run: flutter test test/hcv_software_attestation_verifier_test.dart --reporter expanded

      - name: Full Flutter suite
        run: flutter test --reporter expanded
