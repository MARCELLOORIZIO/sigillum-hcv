name: Build lifecycle feature iOS Release

on:
  push:
    branches:
      - fix/capture-lifecycle-lock-build92

permissions:
  contents: read

jobs:
  build-ios-release:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-lifecycle-lock-build92
          fetch-depth: 0

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Resolve locked dependencies and pin iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Verify lifecycle source before build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          flutter test test/camera_capture_lifecycle_contract_test.dart test/build72_video_reality_and_container_regression_test.dart --reporter expanded
          python3 tool/verify_postpatch_release_20260825.py
          shasum -a 256 lib/camera_page.dart lib/hcv_capture_lifecycle.dart > /tmp/source-before-ios-build.sha256

      - name: Resolve CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          pushd ios >/dev/null
          pod install --repo-update
          popd >/dev/null
          test -f ios/Podfile.lock
          grep -F 'TensorFlowLiteSwift (2.17.0)' ios/Podfile.lock

      - name: Build unsigned iOS Release
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com \
            --dart-define=GIT_COMMIT="$GITHUB_SHA" \
            2>&1 | tee /tmp/xcodebuild_logs/flutter-ios-release-build.log

          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'

          SHARE_EXTENSION="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -n 1 || true)"
          test -n "$SHARE_EXTENSION"
          test -d "$SHARE_EXTENSION"

          FLUTTER_ASSETS="$APP/Frameworks/App.framework/flutter_assets"
          for MODEL in sigillum_screen_replay_v2.tflite sigillum_screen_replay_v1.tflite; do
            SOURCE_MODEL="assets/ml/$MODEL"
            BUILT_MODEL="$FLUTTER_ASSETS/assets/ml/$MODEL"
            test -f "$BUILT_MODEL"
            cmp "$SOURCE_MODEL" "$BUILT_MODEL"
          done

          shasum -a 256 lib/camera_page.dart lib/hcv_capture_lifecycle.dart > /tmp/source-after-ios-build.sha256
          diff -u /tmp/source-before-ios-build.sha256 /tmp/source-after-ios-build.sha256
          python3 tool/verify_postpatch_release_20260825.py
          echo 'IOS_UNSIGNED_RELEASE_BUILD=PASS'

      - name: Package Runner.app
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app /tmp/SIGILLUM-lifecycle-feature-Runner.app.zip

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigillum-lifecycle-feature-ios-release
          path: |
            /tmp/SIGILLUM-lifecycle-feature-Runner.app.zip
            /tmp/xcodebuild_logs/flutter-ios-release-build.log
            /tmp/xcodebuild_logs/sigillum-postpatch-audit.log
            /tmp/source-before-ios-build.sha256
            /tmp/source-after-ios-build.sha256
          if-no-files-found: error
          retention-days: 14
