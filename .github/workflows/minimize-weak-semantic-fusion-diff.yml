name: Minimize and validate weak-semantic fusion diff

on:
  push:
    branches:
      - fix/weak-semantic-no-physical-display-resolution-20260911
    paths:
      - .github/workflows/minimize-weak-semantic-fusion-diff.yml

permissions:
  contents: write

jobs:
  minimize-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/weak-semantic-no-physical-display-resolution-20260911
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild fusion from clean build-100 source plus only new helper
        shell: bash
        run: |
          set -euo pipefail
          cp lib/hcv_display_risk_fusion.dart /tmp/current_fusion.dart
          git show 94e0ad64a3e1a91174a2742b618c26c872fcf712:lib/hcv_display_risk_fusion.dart > /tmp/base_fusion.dart
          python3 - <<'PY'
          from pathlib import Path

          current = Path('/tmp/current_fusion.dart').read_text()
          base = Path('/tmp/base_fusion.dart').read_text()

          class_marker = 'class HCVDisplayRiskFusion {'
          method_marker = '  static HCVDisplayRiskResult? mlFirstPhotoDecision'
          current_class = current.index(class_marker)
          helper_start = current_class + len(class_marker)
          helper_end = current.index(method_marker, helper_start)
          helper = current[helper_start:helper_end]

          if 'resolveWeakSemanticOnlyWithNegativeHfr' not in helper:
              raise SystemExit('new helper not found in current fusion source')
          if 'resolveWeakSemanticOnlyWithNegativeHfr' in base:
              raise SystemExit('base unexpectedly already contains helper')

          base_class = base.index(class_marker) + len(class_marker)
          minimal = base[:base_class] + helper + base[base_class:]
          Path('lib/hcv_display_risk_fusion.dart').write_text(minimal)
          PY
          git diff --check -- lib/hcv_display_risk_fusion.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run full regression suite
        run: flutter test

      - name: Commit minimal validated fusion diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SIGILLUM CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/hcv_display_risk_fusion.dart
          git diff --cached --check
          git commit -m "chore: minimize weak-semantic fusion diff"
          git push origin HEAD:fix/weak-semantic-no-physical-display-resolution-20260911
