name: BUILD91 autofocus recovery validation

on:
  push:
    branches:
      - fix/build91-focus-recovery

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply autofocus recovery patch
        run: python3 tool/apply_build91_focus_recovery.py

      - name: Correct autofocus contract locator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/camera_focus_recovery_after_native_probe_test.dart')
          s = p.read_text()
          s = s.replace(
              "final focusMode = handoff.indexOf('await replacement.setFocusMode(FocusMode.auto);');",
              "final focusMode = handoff.indexOf('await replacement.setFocusMode(FocusMode.auto);', zoom + 1);",
          )
          s = s.replace(
              "final focusPoint = handoff.indexOf('await replacement.setFocusPoint(null);');",
              "final focusPoint = handoff.indexOf('await replacement.setFocusPoint(null);', focusMode + 1);",
          )
          s = s.replace(
              "final exposureMode =\n        handoff.indexOf('await replacement.setExposureMode(ExposureMode.auto);');",
              "final exposureMode = handoff.indexOf(\n      'await replacement.setExposureMode(ExposureMode.auto);',\n      focusPoint + 1,\n    );",
          )
          s = s.replace(
              "final exposurePoint = handoff.indexOf('await replacement.setExposurePoint(null);');",
              "final exposurePoint = handoff.indexOf('await replacement.setExposurePoint(null);', exposureMode + 1);",
          )
          s = s.replace(
              "final settle = handoff.indexOf(\n      'await Future.delayed(const Duration(milliseconds: 650));',\n    );",
              "final settle = handoff.indexOf(\n      'await Future.delayed(const Duration(milliseconds: 650));',\n      exposurePoint + 1,\n    );",
          )
          p.write_text(s)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focus and HFR regression tests
        run: >-
          flutter test
          test/native_temporal_frequency_focus_handoff_contract_test.dart
          test/camera_focus_recovery_after_native_probe_test.dart
          test/native_temporal_frequency_v2_hfr_range_contract_test.dart
          test/native_temporal_frequency_v2_crash_hotfix_contract_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Compile iOS device without signing
        run: flutter build ios --release --no-codesign

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_build91_focus_recovery.py
          rm -f .github/workflows/build91-focus-recovery-validation.yml
          git config user.name 'SIGILLUM CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/Runner/AppDelegate.swift lib/camera_page.dart
          git add test/native_temporal_frequency_focus_handoff_contract_test.dart
          git add test/camera_focus_recovery_after_native_probe_test.dart
          git add -u tool/apply_build91_focus_recovery.py .github/workflows/build91-focus-recovery-validation.yml
          if git diff --cached --quiet; then
            echo 'No materialized changes'
            exit 1
          fi
          git commit -m 'Restore continuous autofocus after native HFR probe'
          git push origin HEAD:fix/build91-focus-recovery
