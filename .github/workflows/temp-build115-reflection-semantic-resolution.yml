name: TEMP BUILD115 reflection semantic resolution

on:
  push:
    branches:
      - fix/build115-reflection-semantic-resolution-20260917
    paths:
      - .github/workflows/temp-build115-reflection-semantic-resolution.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/build115-reflection-semantic-resolution-20260917
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply bounded BUILD115 fusion fix
        run: python3 .github/scripts/apply_build115_reflection_semantic_resolution.py

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format and enforce scoped diff
        run: |
          dart format lib/hcv_display_risk_fusion.dart test/build115_reflection_semantic_resolution_test.dart
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' lib/hcv_display_risk_fusion.dart test/build115_reflection_semantic_resolution_test.dart | sort)"
          test "$changed" = "$expected"

      - name: Resolve dependencies and pin iOS TFLite runtime
        run: |
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Targeted BUILD115 regression tests
        run: |
          flutter test --reporter expanded \
            test/build115_reflection_semantic_resolution_test.dart \
            test/weak_semantic_no_physical_resolution_test.dart \
            test/reflective_planar_ml_guard_regression_test.dart \
            test/mixed_scene_monitor_regression_test.dart \
            test/build112_photo_optical_corroboration_test.dart \
            test/hfr_v3_fullframe_mixed_scene_test.dart

      - name: Full Flutter suite
        run: flutter test --reporter expanded

      - name: Postpatch release verifier
        run: python3 tool/verify_postpatch_release_20260825.py

      - name: Final scoped diff guard
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' lib/hcv_display_risk_fusion.dart test/build115_reflection_semantic_resolution_test.dart | sort)"
          test "$changed" = "$expected"
          git diff --exit-code -- ios/Runner ios/Podfile pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Commit tested BUILD115 fix
        run: |
          git add lib/hcv_display_risk_fusion.dart test/build115_reflection_semantic_resolution_test.dart
          git commit -m "fix(build115): resolve bounded semantic-only display appearance"
          git push origin HEAD:fix/build115-reflection-semantic-resolution-20260917
