name: Temporary photo OCR validation

on:
  push:
    branches:
      - fix/robust-photo-hcv-ocr-20260901

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Parse formatted Dart sources
        run: dart format --output=none lib/hcv_media_id_ocr.dart lib/quick_hcv_media_gate_page.dart lib/registry_verify_page.dart test/hcv_media_id_ocr_test.dart test/fast_uncertified_media_precheck_contract_test.dart test/quick_hcv_media_gate_contract_test.dart test/ios_photo_picker_limited_access_fallback_contract_test.dart test/photo_ocr_registry_recovery_contract_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test OCR parser and consensus
        run: flutter test test/hcv_media_id_ocr_test.dart
      - name: Test quick precheck contract
        run: flutter test test/fast_uncertified_media_precheck_contract_test.dart test/quick_hcv_media_gate_contract_test.dart
      - name: Test iOS original photo picker contract
        run: flutter test test/ios_photo_picker_limited_access_fallback_contract_test.dart
      - name: Test Registry alternate OCR recovery contract
        run: flutter test test/photo_ocr_registry_recovery_contract_test.dart
      - name: Test preserved capture contracts
        run: flutter test test/photo_pre_capture_only_contract_test.dart test/camera_ready_video_evidence_contract_test.dart test/camera_physical_scene_contract_test.dart
