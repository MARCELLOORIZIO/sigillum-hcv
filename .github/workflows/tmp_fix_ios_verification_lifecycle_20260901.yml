name: Temporary iOS verification lifecycle validation

on:
  push:
    branches:
      - fix/ios-verification-lifecycle-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply source patch
        run: python3 .github/scripts/fix_ios_verification_lifecycle_20260901.py
      - name: Format Dart sources
        run: dart format lib/hcv_media_id_ocr.dart lib/quick_hcv_media_gate_page.dart lib/registry_verify_page.dart lib/user_home_page.dart test/fast_uncertified_media_precheck_contract_test.dart test/quick_hcv_media_gate_contract_test.dart test/ios_photo_picker_limited_access_fallback_contract_test.dart test/photo_quick_negative_latency_contract_test.dart test/ios_photo_picker_lifecycle_contract_test.dart test/shared_media_cold_start_contract_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test bounded negative PHOTO path
        run: flutter test test/photo_quick_negative_latency_contract_test.dart
      - name: Test iOS photo picker lifecycle
        run: flutter test test/ios_photo_picker_lifecycle_contract_test.dart
      - name: Test shared-media cold start
        run: flutter test test/shared_media_cold_start_contract_test.dart
      - name: Test OCR and picker contracts
        run: flutter test test/hcv_media_id_ocr_test.dart test/fast_uncertified_media_precheck_contract_test.dart test/quick_hcv_media_gate_contract_test.dart test/ios_photo_picker_limited_access_fallback_contract_test.dart test/photo_ocr_registry_recovery_contract_test.dart
      - name: Test preserved capture contracts
        run: flutter test test/photo_pre_capture_only_contract_test.dart test/camera_ready_video_evidence_contract_test.dart test/camera_physical_scene_contract_test.dart
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/SceneDelegate.swift lib/hcv_media_id_ocr.dart lib/quick_hcv_media_gate_page.dart lib/registry_verify_page.dart lib/user_home_page.dart test/fast_uncertified_media_precheck_contract_test.dart test/quick_hcv_media_gate_contract_test.dart test/ios_photo_picker_limited_access_fallback_contract_test.dart test/photo_quick_negative_latency_contract_test.dart test/ios_photo_picker_lifecycle_contract_test.dart test/shared_media_cold_start_contract_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize iOS verification lifecycle and shared imports"
          git push
