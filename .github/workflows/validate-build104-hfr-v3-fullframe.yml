name: Validate BUILD104 HFR V3 full-frame mixed-scene

on:
  push:
    branches:
      - fix/hfr-v3-fullframe-mixedscene-build104-20260912

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.head_commit.message != 'feat: activate HFR V3 full-frame mixed-scene evidence' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify BUILD103 clean base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a09d9166e31ee138d3fdce2ada035349d07763a5 HEAD
          echo "BUILD103 base verified"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply BUILD104 V3 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_build104_hfr_v3_fullframe.py

      - name: Guard intended diff only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u | tee /tmp/changed-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          lib/hcv_display_risk_fusion.dart
          lib/hcv_temporal_frequency_probe.dart
          test/dual_display_reality_evidence_v1_test.dart
          test/hfr_v3_fullframe_mixed_scene_test.dart
          test/native_temporal_frequency_v2_contract_test.dart
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full test suite
        run: flutter test --reporter expanded

      - name: Commit validated application and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/hcv_display_risk_fusion.dart \
            lib/hcv_temporal_frequency_probe.dart \
            test/dual_display_reality_evidence_v1_test.dart \
            test/hfr_v3_fullframe_mixed_scene_test.dart \
            test/native_temporal_frequency_v2_contract_test.dart
          git commit -m "feat: activate HFR V3 full-frame mixed-scene evidence"
          git push origin HEAD:fix/hfr-v3-fullframe-mixedscene-build104-20260912
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
          git status --short
