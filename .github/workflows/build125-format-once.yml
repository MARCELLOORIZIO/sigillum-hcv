name: BUILD125 format once

on:
  pull_request:
    branches:
      - fix/build124-multi-evidence-display-fusion-20260920

permissions:
  contents: write

jobs:
  dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Format BUILD125 modifications
        run: |
          dart format lib/camera_page.dart lib/hcv_temporal_frequency_probe.dart lib/hcv_multi_evidence_display_policy.dart test/build125_zoom_hfr_fov_test.dart
          if git diff --quiet -- lib/camera_page.dart lib/hcv_temporal_frequency_probe.dart lib/hcv_multi_evidence_display_policy.dart test/build125_zoom_hfr_fov_test.dart; then
            echo "BUILD125_ALREADY_FORMATTED=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart lib/hcv_temporal_frequency_probe.dart lib/hcv_multi_evidence_display_policy.dart test/build125_zoom_hfr_fov_test.dart
          git commit -m "BUILD125 apply official Dart formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
