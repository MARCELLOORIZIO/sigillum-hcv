name: Materialize photo picker fallback 20260827

on:
  push:
    branches:
      - fix/photo-picker-asset-fallback-20260827

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/photo-picker-asset-fallback-20260827

      - name: Materialize Swift fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/patch_photo_picker_fallback_20260827.py
          grep -F 'import UniformTypeIdentifiers' ios/Runner/SceneDelegate.swift
          grep -F 'copyPickerPhotoRepresentation(selection)' ios/Runner/SceneDelegate.swift
          if grep -F 'Selected Photos asset was not found' ios/Runner/SceneDelegate.swift; then
            echo 'PHOTO_ASSET_NOT_FOUND_STILL_PRESENT=FAIL'
            exit 1
          fi
          git diff --check

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Runner/SceneDelegate.swift
          if git diff --cached --quiet; then
            echo 'PHOTO_PICKER_ALREADY_MATERIALIZED=PASS'
            exit 0
          fi
          git commit -m 'iOS: fallback to PHPicker file when PHAsset is unavailable'
          git push origin HEAD:fix/photo-picker-asset-fallback-20260827
