name: Temporary BUILD109 Monitor Photo Fix V2

on:
  push:
    branches:
      - fix/build109-monitor-photo-security-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Layer verified D1 and HCVPACK gates
        run: |
          set -euo pipefail
          if [ ! -f test/hcv_software_attestation_verifier_test.dart ]; then
            git cherry-pick e99640a0b52e1ecd703c9711d0e6fccaf8cd00f1
          fi
          if [ ! -f test/hcvpack_integrity_release_gate_test.dart ]; then
            git cherry-pick 52d4cf3ddcbd4e01d406050e5eb17cda2bdfc6e6
            git cherry-pick 5cf665118ce6102902feef4a4516fa05667dda45
            git cherry-pick 5f9c102d126fe756f3069320be4c025e519b05d2
          fi

      - name: Apply narrow photo still-temporal corroboration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/hcv_display_risk_fusion.dart')
          text = p.read_text()

          if 'photoStillTemporalFullFrameCorroboration' not in text:
              marker = "    final screenPresentButNotFullFrame ="
              insert = """    // BUILD110 regression guard. A strong final still-photo SCREEN result
              // may corroborate three stable full-frame SCREEN temporal samples even when
              // their content-area crop remains below the generic 85 threshold. This path
              // is photo-only, keeps the existing global thresholds, and never overrides
              // the mixed-scene HFR veto above.
              final photoStillTemporalFullFrameCorroboration =
                  photoTemporalMl != null &&
                  v3Analyzed &&
                  !mixedScene &&
                  !physicalDisplay &&
                  temporalFrames == 3 &&
                  highAnyScreenFrames == 3 &&
                  highFullFrameScreenFrames == 0 &&
                  _hasExactlyThreeStrongFullFrameScreenSemanticFramesForPhoto(
                    temporalMl,
                  ) &&
                  _isStrongStillPhotoFullFrameScreen(ml) &&
                  mlStrongScreenFrames == 3 &&
                  mlAverageScreenRisk >= 90.0 &&
                  base.decision == 'STRONG_DISPLAY_RISK' &&
                  base.reasons.contains(
                    'ML_FIRST_VIDEO_SCREEN_MAJORITY_HIGH_PROBABILITY',
                  ) &&
                  base.reasons.contains(
                    'ML_FIRST_VIDEO_FRAME_DIAGNOSTIC_CORROBORATION',
                  );

          """
              if marker not in text:
                  raise SystemExit('screenPresentButNotFullFrame marker missing')
              text = text.replace(marker, insert + marker, 1)

              target = "        !videoPhotoSpatialFullFrameCorroboration &&\n        temporalFrames >= 2 &&"
              replacement = "        !videoPhotoSpatialFullFrameCorroboration &&\n        !photoStillTemporalFullFrameCorroboration &&\n        temporalFrames >= 2 &&"
              if target not in text:
                  raise SystemExit('screen-present guard marker missing')
              text = text.replace(target, replacement, 1)

              target = """    final persistentVisualDisplay =
                  strictPersistentVisualDisplay ||
                  narrowThreeFrameFullFrameRecoveryV109 ||
                  videoPhotoSpatialFullFrameCorroboration;"""
              replacement = """    final persistentVisualDisplay =
                  strictPersistentVisualDisplay ||
                  narrowThreeFrameFullFrameRecoveryV109 ||
                  videoPhotoSpatialFullFrameCorroboration ||
                  photoStillTemporalFullFrameCorroboration;"""
              if target not in text:
                  raise SystemExit('persistentVisualDisplay marker missing')
              text = text.replace(target, replacement, 1)

              persistent_start = text.index('    if (physicalDisplay || persistentVisualDisplay) {')
              reason_marker = "      reasons.add('DUAL_EVIDENCE_V3_ACTIVE');"
              reason_pos = text.index(reason_marker, persistent_start)
              reason_insert = """      if (photoStillTemporalFullFrameCorroboration) {
                  evidenceSources.add('PHOTO_STILL_TEMPORAL_SCREEN_CORROBORATION');
                  strongSources.add('PHOTO_STILL_TEMPORAL_SCREEN_CORROBORATION');
                  reasons.add('STRONG_STILL_PHOTO_FULL_FRAME_SCREEN');
                  reasons.add('THREE_STRONG_FULL_FRAME_SCREEN_TEMPORAL_FRAMES');
                  reasons.add('PHOTO_STILL_TEMPORAL_FULL_FRAME_CORROBORATION');
                }
          """
              text = text[:reason_pos] + reason_insert + text[reason_pos:]

              helper_marker = '  static bool _hasStableVideoPhotoSpatialFullFrameCorroboration('
              helper = """  static bool _hasExactlyThreeStrongFullFrameScreenSemanticFramesForPhoto(
                Map<String, dynamic>? ml,
              ) {
                if (ml == null || ml['analysisStatus'] == 'NOT_ANALYZED') return false;
                final framesAnalyzed = (ml['framesAnalyzed'] as num?)?.toInt() ?? 0;
                final rawFrames = ml['videoFrameAnalyses'];
                if (framesAnalyzed != 3 || rawFrames is! List || rawFrames.length != 3) {
                  return false;
                }
                return rawFrames.every((rawFrame) {
                  if (rawFrame is! Map) return false;
                  final predictedClass = rawFrame['predictedClass']?.toString() ?? '';
                  final probability =
                      (rawFrame['screenProbability'] as num?)?.toDouble() ?? 0.0;
                  final rawSignals = rawFrame['signals'];
                  if (rawSignals is! Map) return false;
                  final signals = Map<String, dynamic>.from(rawSignals);
                  final fullFrame =
                      (signals['fullFrameRiskScore'] as num?)?.toInt() ?? 0;
                  return predictedClass.startsWith('SCREEN_') &&
                      probability >= 0.90 &&
                      fullFrame >= 90;
                });
              }

              static bool _isStrongStillPhotoFullFrameScreen(Map<String, dynamic>? ml) {
                if (ml == null || ml['analysisStatus'] == 'NOT_ANALYZED') return false;
                final predictedClass = ml['predictedClass']?.toString() ?? '';
                final framesAnalyzed = (ml['framesAnalyzed'] as num?)?.toInt() ?? 0;
                final score = (ml['screenReplayRiskScore'] as num?)?.toInt() ?? 0;
                final probability =
                    (ml['screenProbability'] as num?)?.toDouble() ?? 0.0;
                final confidence =
                    (ml['predictedClassConfidence'] as num?)?.toDouble() ?? 0.0;
                final signals = _signals(ml);
                final fullFrame =
                    (signals['fullFrameRiskScore'] as num?)?.toInt() ?? 0;
                final contentArea =
                    (signals['contentAreaRiskScore'] as num?)?.toInt() ?? 0;
                return predictedClass.startsWith('SCREEN_') &&
                    framesAnalyzed == 1 &&
                    score >= 92 &&
                    probability >= 0.92 &&
                    fullFrame >= 90 &&
                    contentArea >= 85 &&
                    (confidence == 0.0 || confidence >= 0.75);
              }

          """
              if helper_marker not in text:
                  raise SystemExit('helper insertion marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)
              p.write_text(text)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format intended files
        run: |
          dart format lib/hcv_display_risk_fusion.dart test/build110_monitor_photo_regression_test.dart
          dart format lib/hcv_verifier.dart test/hcv_software_attestation_verifier_test.dart test/hcvpack_integrity_release_gate_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: BUILD110 monitor-photo regression gate
        run: flutter test test/build110_monitor_photo_regression_test.dart --reporter expanded

      - name: BUILD109 recovery gates
        run: |
          flutter test test/build109_ml_fullframe_recovery_test.dart --reporter expanded
          flutter test test/video_photo_spatial_evidence_test.dart --reporter expanded
          flutter test test/video_photo_spatial_fusion_test.dart --reporter expanded

      - name: Security gates
        run: |
          flutter test test/hcv_software_attestation_verifier_test.dart --reporter expanded
          flutter test test/hcvpack_integrity_release_gate_test.dart --reporter expanded

      - name: Full Flutter suite
        run: flutter test --reporter expanded

      - name: Commit validated candidate
        run: |
          set -euo pipefail
          git add lib/hcv_display_risk_fusion.dart lib/hcv_verifier.dart test/build110_monitor_photo_regression_test.dart test/hcv_software_attestation_verifier_test.dart test/hcvpack_integrity_release_gate_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve full-frame monitor photos with still-temporal corroboration"
            git push origin HEAD:fix/build109-monitor-photo-security-20260914
          fi
