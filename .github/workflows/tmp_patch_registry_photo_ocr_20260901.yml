name: Temporary Registry photo OCR patch

on:
  push:
    branches:
      - fix/robust-photo-hcv-ocr-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Registry candidate recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/registry_verify_page.dart')
          text = path.read_text()
          marker = '_fetchCertificateWithPhotoOcrRecovery'
          if marker in text:
              raise SystemExit(0)

          old_call = '      final resolved = await _fetchCertificateWithLocalRecovery(hcvId);\n'
          new_call = '      final resolved = await _fetchCertificateWithPhotoOcrRecovery(hcvId);\n'
          if old_call not in text:
              raise SystemExit('Registry verification fetch call not found')
          text = text.replace(old_call, new_call, 1)

          anchor = '  int _hexDistance(String left, String right) {\n'
          helper = (
              '  Future<MapEntry<String, Map<String, dynamic>>>\n'
              '      _fetchCertificateWithPhotoOcrRecovery(String hcvId) async {\n'
              '    try {\n'
              '      return await _fetchCertificateWithLocalRecovery(hcvId);\n'
              '    } on HCVRegistryException catch (originalError) {\n'
              '      final path = mediaPath;\n'
              '      if (originalError.kind != HCVRegistryFailureKind.notFound ||\n'
              '          path == null) {\n'
              '        rethrow;\n'
              '      }\n'
              '\n'
              '      final lower = path.toLowerCase();\n'
              '      final isPhoto = lower.endsWith(\'.jpg\') ||\n'
              '          lower.endsWith(\'.jpeg\') ||\n'
              '          lower.endsWith(\'.png\');\n'
              '      if (!isPhoto) rethrow;\n'
              '\n'
              '      final candidates =\n'
              '          await HCVMediaIdOcr.extractCandidatesFromImage(path);\n'
              '      for (final candidate in candidates) {\n'
              '        if (candidate == hcvId) continue;\n'
              '        try {\n'
              '          return await _fetchCertificate(candidate);\n'
              '        } on HCVRegistryException catch (candidateError) {\n'
              '          if (candidateError.kind == HCVRegistryFailureKind.notFound) {\n'
              '            continue;\n'
              '          }\n'
              '          rethrow;\n'
              '        }\n'
              '      }\n'
              '\n'
              '      throw originalError;\n'
              '    }\n'
              '  }\n'
              '\n'
          )
          if anchor not in text:
              raise SystemExit('Registry helper insertion anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/registry_verify_page.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: recover alternate photo OCR IDs from Registry"
          git push
