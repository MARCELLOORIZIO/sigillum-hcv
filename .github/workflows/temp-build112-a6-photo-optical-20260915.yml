name: TEMP BUILD112 A6 photo optical validation

on:
  push:
    branches:
      - candidate/build112-a6-photo-optical-20260915

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/build112-a6-photo-optical-20260915
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply BUILD112 A6 patch
        run: python3 .github/scripts/build112_a6_photo_optical_patch.py

      - name: Diff guard
        run: |
          git diff --check
          git status --short
          CHANGED="$(git status --porcelain | awk '{print $2}' | sort)"
          EXPECTED=$'lib/hcv_display_risk_fusion.dart\ntest/build112_photo_optical_corroboration_test.dart'
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: BUILD112 A6 focused regression
        run: flutter test test/build112_photo_optical_corroboration_test.dart

      - name: BUILD111 monitor regression
        run: flutter test test/build111_photo_monitor_regression_test.dart

      - name: BUILD109 spatial regression
        run: flutter test test/video_photo_spatial_evidence_test.dart test/video_photo_spatial_fusion_test.dart

      - name: BUILD109 HFR ML regression
        run: flutter test test/build109_low_modulation_hfr_recovery_test.dart test/build109_ml_fullframe_recovery_test.dart

      - name: Fusion regression
        run: flutter test test/hcv_display_risk_fusion_test.dart

      - name: D1 verifier regression
        run: flutter test test/hcv_software_attestation_verifier_test.dart

      - name: HCVPACK integrity gate
        run: flutter test test/hcvpack_integrity_release_gate_test.dart

      - name: Full Flutter suite
        run: flutter test

      - name: Commit tested candidate
        run: |
          git add lib/hcv_display_risk_fusion.dart test/build112_photo_optical_corroboration_test.dart
          git commit -m "fix(build112): recover corroborated near-full-frame photo monitor"
          git push origin HEAD:candidate/build112-a6-photo-optical-20260915
