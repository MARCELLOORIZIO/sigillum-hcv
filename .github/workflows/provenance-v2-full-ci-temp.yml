name: Provenance v2 full temporary validation

on:
  push:
    branches:
      - feature/registry-provenance-v2-20260831

permissions:
  contents: read

jobs:
  app-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze committed source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded
