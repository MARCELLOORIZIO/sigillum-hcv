name: BUILD124 temporary legacy test formatter

on:
  pull_request:
    branches:
      - fix/build123-context-free-display-reality-20260919

permissions:
  contents: write

jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Apply official Dart format to historical HFR contract
        run: |
          dart format test/hfr_coherent_display_periodicity_integration_contract_test.dart
          if git diff --quiet -- test/hfr_coherent_display_periodicity_integration_contract_test.dart; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/hfr_coherent_display_periodicity_integration_contract_test.dart
          git commit -m "BUILD124 format historical HFR contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
