name: Apply BUILD96 regression hotfix

on:
  push:
    branches:
      - fix/build96-login-quickverify-regressions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused hotfix
        run: python3 tool/apply_build96_regression_hotfix_20260910.py

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full tests
        run: flutter test --reporter expanded

      - name: Verify release contract
        run: python3 tool/verify_postpatch_release_20260825.py

      - name: Commit validated hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/user_home_page.dart lib/quick_hcv_media_gate_page.dart lib/commercial_gate.dart lib/commercial_account_service.dart test/build96_login_quickverify_regression_contract_test.dart
          git diff --cached --exit-code && { echo "No source changes to commit"; exit 0; } || true
          git commit -m "fix: remove BUILD96 login and quick-verify regressions [hotfix-applied]"
          git push origin HEAD:fix/build96-login-quickverify-regressions
