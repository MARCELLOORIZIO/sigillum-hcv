name: Apply isolated non-blocking parallax patch

on:
  push:
    branches:
      - fix/non-blocking-parallax-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-blocking-parallax-20260901
          fetch-depth: 0

      - name: Make parallax non-blocking
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/camera_page.dart')
          text = path.read_text()

          start_marker = "  bool _hasRequiredParallax(Map<String, dynamic> probe) {\n"
          end_marker = "\n  Future<void> _showCaptureReadyMessage() async {"

          if text.count(start_marker) != 1:
              raise SystemExit('Expected exactly one parallax helper; aborting')
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          new_helper = (
              "  bool _hasRequiredParallax(Map<String, dynamic> probe) {\n"
              "    // Parallax remains part of the probe as non-blocking diagnostic evidence.\n"
              "    // Photo and video capture must not require lateral phone movement.\n"
              "    return true;\n"
              "  }\n"
          )
          patched = text[:start] + new_helper + text[end:]

          # Guardrails: preserve the PHOTO temporal mini-video probe and the current
          # iOS VIDEO handling; change only the shared parallax gate semantics.
          if 'liveScreenProbe = await _analyzeLiveScreenProbeWithoutFlash();' not in patched:
              raise SystemExit('PHOTO live/temporal probe call not found; aborting')
          if 'includeTemporalVideoProbe: false' not in patched:
              raise SystemExit('Current VIDEO probe handling not found; aborting')
          if patched.count('_hasRequiredParallax(') != 3:
              raise SystemExit('Unexpected parallax call-site count; aborting')
          if "return true;\n  }\n\n  Future<void> _showCaptureReadyMessage() async {" not in patched:
              raise SystemExit('Patched helper verification failed; aborting')

          path.write_text(patched)
          PY

          git diff --check
          git diff -- lib/camera_page.dart

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/camera_page.dart
          git commit -m "fix: make parallax non-blocking"
          git push origin HEAD:fix/non-blocking-parallax-20260901
