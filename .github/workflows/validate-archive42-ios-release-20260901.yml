name: Validate Archive 42 iOS Release

on:
  push:
    branches:
      - fix/ios-video-watermark-archive42-20260901

permissions:
  contents: read

jobs:
  validate-archive42-ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Codemagic Flutter version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Resolve locked dependencies and validated iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/pin_tflite_ios_runtime_20260826.sh
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Re-run Archive 42 tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test \
            test/ios_video_watermark_archive42_contract_test.dart \
            test/video_native_capture_writer_stability_contract_test.dart \
            --reporter expanded

      - name: Resolve CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          pushd ios >/dev/null
          pod install --repo-update
          popd >/dev/null
          grep -F 'TensorFlowLiteSwift (2.17.0)' ios/Podfile.lock
          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml

      - name: Build unsigned iOS Release
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=SIGILLUM_EDITION=user \
            --dart-define=SIGILLUM_API_BASE_URL=https://sigillum-registry-production.onrender.com \
            --dart-define=GIT_COMMIT="$GITHUB_SHA"

          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.sigillum.hcv'

          SHARE_EXTENSION="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -n 1 || true)"
          test -n "$SHARE_EXTENSION"
          test -d "$SHARE_EXTENSION"

          git diff --exit-code -- \
            lib test ios/Runner ios/Podfile \
            pubspec.yaml pubspec.lock analysis_options.yaml
          echo 'ARCHIVE42_IOS_UNSIGNED_RELEASE=PASS'
