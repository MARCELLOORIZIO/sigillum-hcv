name: hcv_app
description: "HCV App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  camera: 0.10.6
  camera_windows: ^0.2.6
  
  path: ^1.9.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  pointycastle: ^3.9.1
  shared_preferences: ^2.3.2
  file_picker: ^8.0.0
  video_player: ^2.9.2
  media_kit: ^1.1.10
  media_kit_video: ^1.3.1
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_android_video: ^1.3.7
  receive_sharing_intent: ^1.4.5
  share_plus: ^10.1.4
  archive: ^3.6.1
  cryptography: ^2.7.0
  #media_store_plus: ^0.1.3
  sensors_plus: ^7.0.0
  ffmpeg_kit_flutter_new: ^3.1.0
  flutter_launcher_icons: ^0.14.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.15.0

  

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/icon.png"

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"  
